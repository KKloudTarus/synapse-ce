{{- if eq (include "synapse.executionMode" .) "inClusterBroker" }}
{{- /* A data-only role (#1559: control, and the retired integrations, lifecycle and notifications) runs
       no tool: it gets no broker socket, no grant token, no sandbox probe, and schedules on the worker's
       own node selector instead of the broker nodes. */ -}}
{{- $control := has .Values.worker.profile (list "control" "integrations" "lifecycle" "notifications") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synapse.fullname" . }}-worker
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  # Fenced claim leases, per-run execution locks, and leader-gated maintenance make replicas safe.
  # maxSurge zero bounds replacement overlap while the old worker drains its current claim.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "synapse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "synapse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      hostUsers: {{ .Values.sandbox.hostUsers }}
      serviceAccountName: {{ include "synapse.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "synapse.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        {{- include "synapse.topologySpreadConstraints" (list . "worker") | nindent 8 }}
      {{- if $control }}
      nodeSelector:
        {{- toYaml .Values.worker.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.worker.tolerations | nindent 8 }}
      {{- else }}
      # The worker must land on the SAME execution-capable nodes as the broker DaemonSet, so it inherits the
      # broker's node selector and tolerations and reads the node-local broker socket via hostPath.
      nodeSelector:
        {{- toYaml .Values.egressBroker.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.egressBroker.tolerations | nindent 8 }}
      {{- end }}
      affinity:
        {{- toYaml .Values.worker.affinity | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "synapse.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/synapse/synapse-worker"]
          {{- if .Values.worker.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.metrics.port }}
          {{- end }}
          securityContext:
            {{- include "synapse.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "synapse.runtimeEnv" . | nindent 12 }}
            {{- if not $control }}
            {{- include "synapse.workerEgressEnv" . | nindent 12 }}
            {{- end }}
            - name: SYNAPSE_LEADER_ENABLED
              value: "true"
            - name: SYNAPSE_WORKER_PROFILE
              value: {{ .Values.worker.profile | quote }}
            - name: SYNAPSE_INTEGRATION_SCHEDULER_ENABLED
              value: {{ .Values.worker.integrationScheduler.enabled | quote }}
            - name: SYNAPSE_INTEGRATION_SCHEDULER_POLL
              value: {{ .Values.worker.integrationScheduler.poll | quote }}
            - name: SYNAPSE_INTEGRATION_SCHEDULER_DISPATCH_LIMIT
              value: {{ .Values.worker.integrationScheduler.dispatchLimit | quote }}
            - name: SYNAPSE_INTEGRATION_SCHEDULER_MAX_QUEUE_DEPTH
              value: {{ .Values.worker.integrationScheduler.maxQueueDepth | quote }}
            - name: SYNAPSE_METRICS_ENABLED
              value: {{ .Values.worker.metrics.enabled | quote }}
            {{- if .Values.worker.metrics.enabled }}
            - name: SYNAPSE_METRICS_ADDR
              value: {{ printf "0.0.0.0:%d" (.Values.worker.metrics.port | int) | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if not $control }}
          startupProbe:
            # Runs the FULL production sandbox conformance suite (every strict control, not just the
            # host/kernel-dependent subset) before this worker can claim work; -strict fails closed
            # until delegated cgroup limits are actually enforced. The wider timeout gives the
            # behavioral probes (seccomp/filesystem/memory/pids/timeout/output/redaction) headroom.
            exec: {command: ["/opt/synapse/synapse-sandbox-check", "-mode=full", "-strict"]}
            periodSeconds: 15
            failureThreshold: 6
            timeoutSeconds: 30
          {{- end }}
          volumeMounts:
            - {name: synapse-data, mountPath: /var/lib/synapse}
            - {name: tmp, mountPath: /tmp}
            - {name: database-ca, mountPath: /etc/synapse/database-ca, readOnly: true}
            {{- if not $control }}
            # The node-local broker socket, shared with the privileged broker DaemonSet on this node.
            - {name: egress-broker-socket, mountPath: {{ .Values.egressBroker.socketHostPath }}}
            {{- end }}
      volumes:
        - name: synapse-data
          emptyDir:
            sizeLimit: {{ .Values.worker.scratch.dataSizeLimit }}
        - name: tmp
          # A clone, an extracted archive or an image layout is staged here, bounded by
          # SYNAPSE_MAX_WORKSPACE_BYTES. Without a sizeLimit an oversized target filled the node's
          # ephemeral storage and the kubelet evicted the pod; with one, the pod is evicted alone and
          # the scan fails instead of the node degrading. Keep this above scan.maxWorkspaceBytes.
          emptyDir:
            sizeLimit: {{ .Values.worker.scratch.tmpSizeLimit }}
        - name: database-ca
          secret:
            secretName: {{ required "externalDatabase.caBundle.secretName is required" .Values.externalDatabase.caBundle.secretName }}
            items:
              - key: {{ required "externalDatabase.caBundle.key is required" .Values.externalDatabase.caBundle.key }}
                path: ca.crt
        {{- if not $control }}
        - name: egress-broker-socket
          hostPath:
            path: {{ .Values.egressBroker.socketHostPath }}
            type: DirectoryOrCreate
        {{- end }}
{{- end }}
