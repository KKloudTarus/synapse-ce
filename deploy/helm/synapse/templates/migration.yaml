{{- /*
The Job runs the same image as the API and writes the same tenant-owned durable state, so it
inherits the API's placement wholesale rather than one key of it. Copying only
topology.kubernetes.io/region left the Job with no architecture constraint, and on a cluster with
both amd64 and graviton pools the scheduler placed it on arm64, where the amd64-only control-plane
image cannot be pulled (ImagePullBackOff, "no match for platform in manifest"). Set
migration.nodeSelector or migration.tolerations to place the Job somewhere else on purpose.
*/ -}}
{{- $nodeSelector := .Values.api.nodeSelector -}}
{{- if .Values.migration.nodeSelector -}}
{{- $nodeSelector = .Values.migration.nodeSelector -}}
{{- end -}}
{{- $tolerations := .Values.api.tolerations -}}
{{- if .Values.migration.tolerations -}}
{{- $tolerations = .Values.migration.tolerations -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "synapse.fullname" . }}-migrate
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "synapse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      hostUsers: {{ .Values.sandbox.hostUsers }}
      restartPolicy: Never
      serviceAccountName: {{ include "synapse.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if $nodeSelector }}
      nodeSelector:
        {{- toYaml $nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $tolerations }}
      tolerations:
        {{- toYaml $tolerations | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "synapse.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "synapse.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/synapse/synapse-migrate"]
          securityContext:
            {{- include "synapse.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "synapse.runtimeEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - {name: database-ca, mountPath: /etc/synapse/database-ca, readOnly: true}
      volumes:
        - name: database-ca
          secret:
            secretName: {{ required "externalDatabase.caBundle.secretName is required" .Values.externalDatabase.caBundle.secretName }}
            items:
              - key: {{ required "externalDatabase.caBundle.key is required" .Values.externalDatabase.caBundle.key }}
                path: ca.crt
