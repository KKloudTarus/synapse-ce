{{- include "synapse.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synapse.fullname" . }}-api
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "synapse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "synapse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      hostUsers: {{ .Values.sandbox.hostUsers }}
      serviceAccountName: {{ include "synapse.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "synapse.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        {{- include "synapse.topologySpreadConstraints" (list . "api") | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.api.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.api.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.api.affinity | nindent 8 }}
      containers:
        - name: api
          image: {{ include "synapse.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "synapse.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.api.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.api.metrics.port }}
            {{- end }}
            {{- if .Values.api.grantAuthority.enabled }}
            - name: grant-authority
              containerPort: {{ .Values.api.grantAuthority.port }}
            {{- end }}
          env:
            {{- include "synapse.runtimeEnv" . | nindent 12 }}
            - name: SYNAPSE_DB_HALT_WRITER_DSN
              valueFrom: {secretKeyRef: {name: {{ required "existingSecrets.database.haltWriter.name is required" .Values.existingSecrets.database.haltWriter.name }}, key: {{ required "existingSecrets.database.haltWriter.key is required" .Values.existingSecrets.database.haltWriter.key }}}}
            # A production Helm release is a single-tenant regional cell: tenant
            # routing cannot move data across residency boundaries inside one cell.
            - name: SYNAPSE_SINGLE_TENANT
              value: "true"
            - name: SYNAPSE_HTTP_ADDR
              value: ":8080"
            - name: SYNAPSE_METRICS_ENABLED
              value: {{ .Values.api.metrics.enabled | quote }}
            {{- if .Values.api.metrics.enabled }}
            - name: SYNAPSE_METRICS_ADDR
              value: {{ printf "0.0.0.0:%d" (.Values.api.metrics.port | int) | quote }}
            {{- end }}
            - name: SYNAPSE_FLEET_ENABLED
              value: {{ .Values.fleet.enabled | quote }}
            {{- if .Values.fleet.enabled }}
            - name: SYNAPSE_FLEET_SIGNER_KEY
              valueFrom: {secretKeyRef: {name: {{ required "existingSecrets.cryptography.fleetSignerKey.name is required when fleet.enabled" .Values.existingSecrets.cryptography.fleetSignerKey.name }}, key: {{ required "existingSecrets.cryptography.fleetSignerKey.key is required when fleet.enabled" .Values.existingSecrets.cryptography.fleetSignerKey.key }}}}
            {{- end }}
            - name: SYNAPSE_FLEET_ASSETS_ENABLED
              value: {{ .Values.fleet.assetsEnabled | quote }}
            - name: SYNAPSE_FLEET_HOST_INGEST_ENABLED
              value: {{ .Values.fleet.hostIngestEnabled | quote }}
            - name: SYNAPSE_FLEET_TELEMETRY_INGEST_ENABLED
              value: {{ .Values.fleet.telemetryIngestEnabled | quote }}
            - name: SYNAPSE_FLEET_DETECTION_INGEST_ENABLED
              value: {{ .Values.fleet.detectionIngestEnabled | quote }}
            - name: SYNAPSE_FLEET_KEY_REGISTRATION_ENABLED
              value: {{ .Values.fleet.keyRegistrationEnabled | quote }}
            - name: SYNAPSE_FLEET_CLIENT_CERT_HEADER
              value: {{ .Values.fleet.clientCertHeader | quote }}
            - name: SYNAPSE_FLEET_CLIENT_CERT_HOST
              value: {{ .Values.fleet.clientCertHost | quote }}
            - name: SYNAPSE_FLEET_ENROLLMENT_HOST
              value: {{ .Values.fleet.enrollmentHost | quote }}
            - name: SYNAPSE_FLEET_STALE_AFTER
              value: {{ .Values.fleet.staleAfter | quote }}
            - name: SYNAPSE_FLEET_CORRELATION_ENABLED
              value: {{ .Values.fleet.correlation.enabled | quote }}
            - name: SYNAPSE_FLEET_CORRELATION_WINDOW
              value: {{ .Values.fleet.correlation.window | quote }}
            - name: SYNAPSE_FLEET_CORRELATION_ALLOWED_LATENESS
              value: {{ .Values.fleet.correlation.allowedLateness | quote }}
            - name: SYNAPSE_FLEET_CORRELATION_MAX_PER_INCIDENT
              value: {{ .Values.fleet.correlation.maxPerIncident | quote }}
            - name: SYNAPSE_RESPONSE_EXECUTION_ENABLED
              value: {{ .Values.responseExecution.enabled | quote }}
            {{- if .Values.responseExecution.enabled }}
            - name: SYNAPSE_RESPONSE_COMMAND_SIGNING_KEY_FILE
              value: /etc/synapse/response-command-signing/key
            {{- end }}
            - name: SYNAPSE_RESPONSE_COMMAND_TTL
              value: {{ .Values.responseExecution.commandTTL | quote }}
            - name: SYNAPSE_RESPONSE_EXECUTION_POLL_INTERVAL
              value: {{ .Values.responseExecution.pollInterval | quote }}
            {{- if .Values.api.grantAuthority.enabled }}
            - name: SYNAPSE_EGRESS_GRANT_AUTHORITY_ADDR
              value: {{ printf "0.0.0.0:%d" (.Values.api.grantAuthority.port | int) | quote }}
            - name: SYNAPSE_EGRESS_GRANT_ISSUER_TOKEN
              valueFrom: {secretKeyRef: {name: {{ required "existingSecrets.egressGrant.issuerToken.name is required" .Values.existingSecrets.egressGrant.issuerToken.name }}, key: {{ required "existingSecrets.egressGrant.issuerToken.key is required" .Values.existingSecrets.egressGrant.issuerToken.key }}}}
            - name: SYNAPSE_EGRESS_GRANT_SIGNING_SEED
              valueFrom: {secretKeyRef: {name: {{ required "existingSecrets.egressGrant.signingSeed.name is required" .Values.existingSecrets.egressGrant.signingSeed.name }}, key: {{ required "existingSecrets.egressGrant.signingSeed.key is required" .Values.existingSecrets.egressGrant.signingSeed.key }}}}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - {name: synapse-data, mountPath: /var/lib/synapse}
            - {name: tmp, mountPath: /tmp}
            - {name: database-ca, mountPath: /etc/synapse/database-ca, readOnly: true}
            {{- if .Values.responseExecution.enabled }}
            - {name: response-command-signing-key, mountPath: /etc/synapse/response-command-signing, readOnly: true}
            {{- end }}
      volumes:
        - name: synapse-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: database-ca
          secret:
            secretName: {{ required "externalDatabase.caBundle.secretName is required" .Values.externalDatabase.caBundle.secretName }}
            items:
              - key: {{ required "externalDatabase.caBundle.key is required" .Values.externalDatabase.caBundle.key }}
                path: ca.crt
        {{- if .Values.responseExecution.enabled }}
        - name: response-command-signing-key
          secret:
            secretName: {{ required "existingSecrets.cryptography.responseCommandSigningKey.name is required when responseExecution.enabled" .Values.existingSecrets.cryptography.responseCommandSigningKey.name }}
            items:
              - key: {{ required "existingSecrets.cryptography.responseCommandSigningKey.key is required when responseExecution.enabled" .Values.existingSecrets.cryptography.responseCommandSigningKey.key }}
                path: key
        {{- end }}
