# nginx server block for the published dashboard image (deploy/Dockerfile.web target `production`).
#
# The Kubernetes ingress routes /api, /healthz and /readyz to synapse-api, so this container serves
# static files only and proxies nothing. What it must still do is answer a deep link: the dashboard
# is a single-page app, so /settings/team is a client-side route and not a file on disk. Without a
# try_files fallback nginx serves its own 404 for every route except /, which breaks a reload and
# every pasted link. The image previously shipped the stock nginx sample config, which is how that
# happened; deploy/nginx/compose-dashboard.conf already carried the fallback for Compose only.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output. Vite embeds a content hash in every filename here, so a hit can be cached
    # for a year and a miss must stay a miss: falling back to index.html would answer a stale asset
    # request with HTML, which the browser then reports as an unexplained MIME type error rather than
    # as the 404 it is.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The app shell is the only entry point, and it names the hashed assets, so it must never be
    # cached: a stale shell pins a browser to asset filenames a newer deploy no longer serves.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/dashboard-headers.inc;
    }

    # Client-side routing: a deep link such as /engagements/<id> or /settings/team is served the app
    # shell and resolved by the router in the browser.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/dashboard-headers.inc;
    }
}
