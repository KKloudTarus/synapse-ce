# nginx server block for the Compose dashboard (deploy/Dockerfile.web target `compose`).
#
# In Kubernetes the ingress splits traffic: static assets to the web Deployment, /api, /healthz and
# /readyz to synapse-api. Compose has no ingress, so the dashboard container does the split itself.
# The SPA only ever calls same-origin paths, which keeps the browser off CORS and off a second
# published port.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the upstream per request rather than once at startup means a
    # restarted synapse-api container with a new address is picked up instead of blackholed.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # A scan response can take a while; do not cut the connection at nginx's 60s default.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # $api_upstream is a variable on purpose: with a literal host nginx resolves it once at startup
    # and caches the address for the process lifetime, and refuses to start at all if the name does
    # not resolve yet. No URI part, so the original request URI is forwarded unchanged.
    set $api_upstream http://synapse-api:8080;

    location /api/ {
        proxy_pass $api_upstream;
    }

    location = /healthz {
        proxy_pass $api_upstream;
    }

    location = /readyz {
        proxy_pass $api_upstream;
    }

    # Client-side routing: a deep link such as /engagements/<id> is served the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
