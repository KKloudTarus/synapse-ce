# Synapse Kubernetes cluster agent (#411, epic #405).
#
# Least privilege: the ClusterRole grants get/list/watch on EXACTLY the resources the collector
# reads (internal/infrastructure/k8sinv) and nothing more — no secrets, no configmaps, no write verbs.
# A missing permission makes the agent fail loud (naming the resource), never report fewer objects.
#
# Set SYNAPSE_CLUSTER to a UNIQUE identity per cluster: it is part of every asset key, so two clusters
# with identical namespace/workload names never collide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: synapse-cluster-agent
  namespace: synapse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: synapse-cluster-agent-readonly
rules:
  # Core: namespaces (scope), pods (workloads + running digests), services (exposure),
  # serviceaccounts (identity).
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  # Apps: replicasets (Pod -> ReplicaSet -> Deployment owner resolution).
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # Networking: ingresses (exposure) + networkpolicies (exposure posture).
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  # NOTE: roles/rolebindings/clusterroles/clusterrolebindings are intentionally NOT granted yet — the
  # collector does not read them. They will be added here (read-only) only when the RBAC identity-graph
  # collection lands, keeping the role scoped to exactly what is read.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: synapse-cluster-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: synapse-cluster-agent-readonly
subjects:
  - kind: ServiceAccount
    name: synapse-cluster-agent
    namespace: synapse
---
# The one-time enrolment token is provisioned OUT OF BAND by an operator (never committed). Create the
# Secret before applying this manifest, e.g.:
#   kubectl -n synapse create secret generic synapse-cluster-agent-enrol \
#     --from-literal=enrol-token="<one-time token minted by the control plane>"
# It is consumed on first enrolment; the agent then persists a long-lived credential in the state PVC,
# so a restart does not re-enrol. The Deployment mounts it as a FILE (see the enrol-token volume below),
# not as an env var: an env secret is readable through /proc/<pid>/environ and follows child processes.
#
# Once enrolment has happened the Secret is dead weight and DELETING IT IS THE RIGHT THING TO DO. The
# mount is therefore `optional: true` and the agent treats an absent token file as "no token supplied"
# rather than as an error — otherwise that correct hygiene would leave a pod that can never restart.
---
# Persists the agent credential across restarts (without it a restart would re-enrol with an
# already-consumed one-time token and fail).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-cluster-agent-state
  namespace: synapse
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-cluster-agent
  namespace: synapse
  labels:
    app.kubernetes.io/name: synapse-cluster-agent
spec:
  replicas: 1
  strategy:
    type: Recreate # single writer of the state PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse-cluster-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse-cluster-agent
    spec:
      serviceAccountName: synapse-cluster-agent
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532 # so the agent can write the state PVC
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/kkloudtarus/synapse-cluster-agent:latest # pin to a digest in production
          env:
            - name: SYNAPSE_CLUSTER
              value: "REPLACE-with-unique-cluster-identity" # keys every asset; unique per cluster
            # Control-plane fleet API. Must be https (a loopback host is the only http exception).
            - name: SYNAPSE_FLEET_URL
              value: "https://REPLACE-with-control-plane"
            # One-time enrolment token, read from a mounted file (first run only). A file is preferred
            # over an env var: an env secret is readable via /proc/<pid>/environ and can leak into
            # crash dumps / child processes.
            - name: SYNAPSE_FLEET_ENROL_TOKEN_FILE
              value: /var/run/synapse/enrol-token
            - name: SYNAPSE_AGENT_STATE_DIR
              value: /var/lib/synapse-cluster-agent
            # Optional: restrict scope. Empty = all namespaces.
            - name: SYNAPSE_CLUSTER_NAMESPACES
              value: ""
          volumeMounts:
            - name: state
              mountPath: /var/lib/synapse-cluster-agent
            - name: enrol-token
              mountPath: /var/run/synapse
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: synapse-cluster-agent-state
        # The one-time enrolment token, mounted read-only as a file.
        #
        # optional: true so the pod still starts once the consumed Secret has been deleted — the agent
        # has its credential in the state PVC by then and an absent token file is not an error. Without
        # this the correct cleanup of a spent one-time secret would permanently wedge the deployment.
        #
        # defaultMode 0440, not 0400: files in a Secret volume are owned root:fsGroup, so owner-only
        # would lock out the container's own user (65532). 0440 lets the agent read it through fsGroup
        # and nobody else read it at all.
        - name: enrol-token
          secret:
            secretName: synapse-cluster-agent-enrol
            optional: true
            defaultMode: 0440
            items:
              - key: enrol-token
                path: enrol-token
