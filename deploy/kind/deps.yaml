# Local-only Postgres + MinIO for the kind control-plane smoke. NOT for production: single replica, no TLS,
# dev credentials. Production uses externally-operated PostgreSQL and S3-compatible storage.
#
# IMPORTANT: the RUNTIME DB role must be NON-SUPERUSER. Synapse enforces tenant isolation with Postgres RLS
# and refuses to serve if its runtime role is a SUPERUSER (superusers bypass RLS). This init script creates a
# non-superuser role `synapse_rt` for the runtime DSN; migrations run as the owner `synapse`. Real deployments
# must do the same: migrate with an owner role, serve with a non-superuser role.
apiVersion: v1
kind: ConfigMap
metadata: {name: pg-init, namespace: synapse}
data:
  init.sql: |
    CREATE ROLE synapse_rt LOGIN NOSUPERUSER PASSWORD 'synapse';
    GRANT USAGE ON SCHEMA public TO synapse_rt;
    ALTER DEFAULT PRIVILEGES FOR ROLE synapse IN SCHEMA public GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO synapse_rt;
    ALTER DEFAULT PRIVILEGES FOR ROLE synapse IN SCHEMA public GRANT USAGE,SELECT ON SEQUENCES TO synapse_rt;
---
apiVersion: v1
kind: Service
metadata: {name: synapse-postgres, namespace: synapse}
spec:
  selector: {app: synapse-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: synapse-postgres, namespace: synapse}
spec:
  replicas: 1
  selector: {matchLabels: {app: synapse-postgres}}
  template:
    metadata: {labels: {app: synapse-postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_USER, value: synapse}
            - {name: POSTGRES_PASSWORD, value: synapse}
            - {name: POSTGRES_DB, value: synapse}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "synapse"]}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: pginit, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: pginit, configMap: {name: pg-init}}
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: synapse}
spec:
  selector: {app: minio}
  ports: [{name: api, port: 9000, targetPort: 9000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio, namespace: synapse}
spec:
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-09-13T20-26-02Z
          args: ["server", "/data", "--address", ":9000"]
          env:
            - {name: MINIO_ROOT_USER, value: minio}
            - {name: MINIO_ROOT_PASSWORD, value: minio12345}
          ports: [{containerPort: 9000}]
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
# Create the evidence bucket once MinIO is up (the control plane expects it to exist).
apiVersion: batch/v1
kind: Job
metadata: {name: minio-mkbucket, namespace: synapse}
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-09-16T17-43-14Z
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mc alias set local http://minio:9000 minio minio12345; do sleep 2; done
              mc mb --ignore-existing local/synapse-evidence
              echo "bucket ready"
