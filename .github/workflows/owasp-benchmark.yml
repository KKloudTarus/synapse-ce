# SAST benchmark scorecards. Each job provisions a pinned, content-verified corpus and a java-facts-capable
# synapse-ast, then runs a gated per-category / per-CWE recall ratchet and uploads the scorecard. The corpora
# are not vendored (license and size); each is checked out here at a fixed commit and pinned by content (a
# checksum, or the test's compiled answer-key digest). Broader #1043 consolidation (Securibench wiring, a
# capability rename, and lifecycle controls) is tracked separately; this file evolves the OWASP workflow to
# also run the Juliet gate (EPIC #1034, #1039) rather than adding a duplicate SAST-benchmark workflow.
name: SAST Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owasp-scorecard:
    name: OWASP BenchmarkJava scorecard
    runs-on: ubuntu-latest
    env:
      # Pinned OWASP-Benchmark/BenchmarkJava commit the ratchet floors are calibrated against (v1.2 answer
      # key). Bumping this REQUIRES re-verifying the checksum below and re-calibrating the floors.
      OWASP_BENCHMARK_REF: 20cbf3d11123347e47ed89541e6942836def53f7
      OWASP_BENCHMARK_CSV_SHA256: 1809f6a690c6cf7dd6685df6ebe2eef8fe3ca93d19a7ca0ce45987ca4f5d78e1
    steps:
      - name: Checkout synapse
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Checkout OWASP BenchmarkJava (pinned)
        uses: actions/checkout@v7
        with:
          repository: OWASP-Benchmark/BenchmarkJava
          ref: ${{ env.OWASP_BENCHMARK_REF }}
          path: owasp-benchmark
          persist-credentials: false

      - name: Verify answer-key checksum (content pin)
        working-directory: owasp-benchmark
        run: |
          echo "${OWASP_BENCHMARK_CSV_SHA256}  expectedresults-1.2.csv" | sha256sum -c -

      - name: Build java-facts-capable synapse-ast (CGO)
        run: CGO_ENABLED=1 go build -o "${RUNNER_TEMP}/synapse-ast" ./cmd/synapse-ast

      - name: Run OWASP scorecard + recall ratchet
        # No SYNAPSE_OWASP_BENCHMARK_SHA256 override: the test verifies the answer key against its CHECKED-IN
        # compiled constant, independent of this workflow's OWASP_BENCHMARK_CSV_SHA256. Re-pinning the corpus
        # therefore requires editing BOTH the workflow ref/checksum AND the constant in source (reviewed with
        # the recalibrated floors), which is the belt-and-suspenders the workflow-only checksum alone is not.
        env:
          SYNAPSE_OWASP_BENCHMARK_DIR: ${{ github.workspace }}/owasp-benchmark
          SYNAPSE_AST_BIN: ${{ runner.temp }}/synapse-ast
        run: |
          set -o pipefail
          CGO_ENABLED=1 go test -count=1 -v -run TestOWASPBenchmarkScorecard \
            ./internal/infrastructure/tools/ast/ | tee "${RUNNER_TEMP}/owasp-scorecard.log"

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-benchmark-scorecard
          path: ${{ runner.temp }}/owasp-scorecard.log
          if-no-files-found: warn

  juliet-scorecard:
    name: Juliet Java scorecard
    runs-on: ubuntu-latest
    env:
      # Pinned find-sec-bugs/juliet-test-suite commit the ratchet floors and the test's compiled answer-key
      # digest are calibrated against. Bumping this REQUIRES re-calibrating the floors and re-pinning the
      # digest constant in juliet_integration_test.go (reviewed together).
      JULIET_REF: b2c6df3733e2176fe7097e4784895c6891632b4c
    steps:
      - name: Checkout synapse
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Checkout Juliet Java test suite (pinned)
        uses: actions/checkout@v7
        with:
          repository: find-sec-bugs/juliet-test-suite
          ref: ${{ env.JULIET_REF }}
          path: juliet
          persist-credentials: false

      - name: Build java-facts-capable synapse-ast (CGO)
        run: CGO_ENABLED=1 go build -o "${RUNNER_TEMP}/synapse-ast" ./cmd/synapse-ast

      - name: Run Juliet scorecard + per-CWE ratchet
        # The test content-pins the answer key against its compiled julietCorpusDigest constant, so a wrong or
        # silently-changed corpus fails loudly rather than passing the ratchet falsely. Re-pinning the corpus
        # therefore requires editing BOTH JULIET_REF above AND that constant in source (reviewed with the
        # recalibrated floors).
        env:
          SYNAPSE_JULIET_DIR: ${{ github.workspace }}/juliet
          SYNAPSE_AST_BIN: ${{ runner.temp }}/synapse-ast
        run: |
          set -o pipefail
          CGO_ENABLED=1 go test -count=1 -v -timeout 1800s -run TestJulietScorecard \
            ./internal/infrastructure/tools/ast/ | tee "${RUNNER_TEMP}/juliet-scorecard.log"

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: juliet-scorecard
          path: ${{ runner.temp }}/juliet-scorecard.log
          if-no-files-found: warn
