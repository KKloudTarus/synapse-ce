name: Engine accuracy evidence cycle

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "**"
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-accuracy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Determine evidence-cycle route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      trusted_requested: ${{ steps.classify.outputs.trusted_requested }}
    steps:
      - name: Resolve exact source revision
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            source_sha="${{ github.event.pull_request.head.sha }}"
          else
            source_sha="${{ github.sha }}"
          fi
          case "$source_sha" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "source revision is not a full SHA"; exit 1 ;;
          esac
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.resolve.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Assert exact checkout revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.resolve.outputs.source_sha }}"
      - name: Classify trusted execution request
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ steps.resolve.outputs.source_sha }}
          TRUSTED_ENABLED: ${{ vars.ENGINE_ACCURACY_TRUSTED_ENABLED }}
          TRUSTED_REF: ${{ vars.ENGINE_ACCURACY_TRUSTED_REF }}
          TRUSTED_SHA: ${{ vars.ENGINE_ACCURACY_TRUSTED_SHA }}
        run: |
          set -euo pipefail
          trusted_requested=false
          trusted_ref="${TRUSTED_REF:-refs/heads/main}"
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$TRUSTED_ENABLED" = "true" ] && [ -n "$TRUSTED_SHA" ]; then
            if [ "$WORKFLOW_REF" = "$trusted_ref" ] && [ "$WORKFLOW_SHA" = "$TRUSTED_SHA" ]; then
              trusted_requested=true
            fi
          fi
          echo "trusted_requested=$trusted_requested" >> "$GITHUB_OUTPUT"

  smoke:
    name: Offline smoke
    needs: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false
      - name: Assert exact checkout revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.source_sha }}"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Run offline smoke
        run: make sca-accuracy-smoke

  offline-verify:
    name: Offline benchmark contract verification
    needs: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false
      - name: Assert exact checkout revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.source_sha }}"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify benchmark contract without scanners
        run: make sca-accuracy-verify

  trusted-full:
    name: Trusted full evidence cycle
    needs: changes
    if: ${{ needs.changes.outputs.trusted_requested == 'true' }}
    # The runner is registered in ephemeral mode for this one job. Immutable
    # local inputs supply canonical SBOMs, source assets, scanner databases,
    # tools, the independent review, and a distinct maintainer disposition.
    # Derived controls are materialized inside the job.
    runs-on: [self-hosted, linux, sca-accuracy-trusted]
    timeout-minutes: 45
    outputs:
      artifacts: ${{ steps.complete.outputs.artifacts }}
      artifact_id: ${{ steps.candidate-upload.outputs.artifact-id }}
      artifact_url: ${{ steps.candidate-upload.outputs.artifact-url }}
      artifact_digest: ${{ steps.candidate-upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.complete.outputs.artifact_name }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false
      - name: Assert exact checkout revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.source_sha }}"
      - name: Initialize audit-safe capture controls
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          policy="internal/usecase/scabench/corpus/cycle-policy.json"
          output="$RUNNER_TEMP/sca-accuracy-candidate"
          test -s "$policy"
          mkdir -p "$output/control" "$output/records" "$output/publication"
          printf '%s\n' '{"schema_version":"synapse-sca-benchmark-capture-status-v1","status":"pending","phase":"preflight_pending","planned_slots":0,"accepted_slots":0,"retained_failed_attempts":0}' > "$output/capture-status.json"
          printf '%s\n' '{"schema_version":"synapse-sca-benchmark-accepted-bundles-v1","bundles":[]}' > "$output/control/accepted-bundles.json"
          echo "repetitions=$(jq -er '.repetitions' "$policy")" >> "$GITHUB_OUTPUT"
          echo "max_attempts=$(jq -er '.max_attempts' "$policy")" >> "$GITHUB_OUTPUT"
          echo "accepted_retention_days=$(jq -er '.accepted_artifact_retention_days' "$policy")" >> "$GITHUB_OUTPUT"
          echo "failed_retention_days=$(jq -er '.failed_attempt_artifact_retention_days' "$policy")" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Preflight exact trusted runner contract
        shell: bash
        run: |
          set -euo pipefail
          corpus="internal/usecase/scabench/corpus"
          input="$SCA_ACCURACY_TRUSTED_INPUT_ROOT"
          output="$RUNNER_TEMP/sca-accuracy-candidate"
          runner_root="${SCA_ACCURACY_ACTIONS_RUNNER_ROOT:-}"
          test "$(uname -s)" = Linux
          case "$runner_root" in /*) ;; *) echo "actions runner root must be an absolute path"; exit 1;; esac
          test -d "$runner_root"
          test -f "$runner_root/.runner"
          test ! -L "$runner_root/.runner"
          test -r "$runner_root/.runner"
          command -v jq >/dev/null
          jq -e '.ephemeral == true' "$runner_root/.runner" >/dev/null
          runner_config_digest="sha256:$(sha256sum "$runner_root/.runner" | cut -d' ' -f1)"
          jq --arg digest "$runner_config_digest" '.runner_ephemeral = true | .runner_config_digest = $digest' "$output/capture-status.json" > "$output/capture-status.next.json"
          mv "$output/capture-status.next.json" "$output/capture-status.json"
          command -v bwrap >/dev/null
          test -n "${SCA_ACCURACY_BWRAP_VERSION:-}"
          test "$(bwrap --version)" = "$SCA_ACCURACY_BWRAP_VERSION"
          test -r /sys/fs/cgroup/cgroup.controllers
          grep -qw memory /sys/fs/cgroup/cgroup.controllers
          grep -qw pids /sys/fs/cgroup/cgroup.controllers
          test -n "${SCA_ACCURACY_DELEGATED_CGROUP_ROOT:-}"
          case "$SCA_ACCURACY_DELEGATED_CGROUP_ROOT" in /sys/fs/cgroup/*) ;; *) echo "delegated cgroup root must be under cgroup v2"; exit 1;; esac
          test -d "$SCA_ACCURACY_DELEGATED_CGROUP_ROOT"
          test -w "$SCA_ACCURACY_DELEGATED_CGROUP_ROOT"
          go run ./cmd/synapse-sca-cycle -mode sandbox-probe
          command -v docker >/dev/null
          test -n "${SCA_ACCURACY_SYFT_VERSION:-}"
          test -n "${SCA_ACCURACY_SYFT_CONFIG_DIGEST:-}"
          test -n "${SCA_ACCURACY_TRUSTED_INPUT_ROOT:-}"
          test -d "$input"
          test -d "$input/repository"
          jq -e --arg version "$SCA_ACCURACY_SYFT_VERSION" --arg config_digest "$SCA_ACCURACY_SYFT_CONFIG_DIGEST" '.version == $version and .config_digest == $config_digest and .network_disabled == true and .check_for_app_update == false' "$input/syft-probe.json" >/dev/null
          test "sha256:$(sha256sum "$input/syft-config.json" | cut -d' ' -f1)" = "$SCA_ACCURACY_SYFT_CONFIG_DIGEST"
          test -n "${SCA_ACCURACY_RAW_RETENTION_ROOT:-}"
          test -d "$SCA_ACCURACY_RAW_RETENTION_ROOT"
          test -w "$SCA_ACCURACY_RAW_RETENTION_ROOT"
          case "$SCA_ACCURACY_RAW_RETENTION_ROOT/" in "$RUNNER_TEMP"/*) echo "raw retention must not be under runner artifacts"; exit 1;; esac
          for required in catalog.json oracle.json ratchet.json ratchet-baseline.json cycle-policy.json source-freeze.template.json source-evidence-plan.template.json falsifier-spec.json; do
            test -s "$corpus/$required"
          done
          test "$(find "$corpus/capture-manifests" -maxdepth 1 -type f -name '*.json' | wc -l)" -gt 0
          shopt -s nullglob
          review_files=("$input/repository/reviews/github/"*.json)
          decision_files=("$input/repository/reviews/dispositions/github/"*.json)
          test "${#review_files[@]}" = 1
          test "${#decision_files[@]}" = 1
          review_file="${review_files[0]}"
          decision_file="${decision_files[0]}"
          jq -e '.schema_version == "synapse-sca-benchmark-github-review-capture-v1" and (.state == "COMMENTED" or .state == "APPROVED") and (.body | type) == "string" and (.body | length) > 0' "$review_file" >/dev/null
          review_id="$(jq -er '.id' "$review_file")"
          reviewed_commit="$(jq -er '.commit_id' "$review_file")"
          review_login="$(jq -er '.login' "$review_file")"
          implementation_commit="${{ needs.changes.outputs.source_sha }}"
          expected_decision_body="$(printf 'decision: approved\nreview_id: %s\nreviewed_commit: %s\nimplementation_commit: %s' "$review_id" "$reviewed_commit" "$implementation_commit")"
          jq -e --arg review_id "$review_id" --arg reviewed_commit "$reviewed_commit" --arg implementation_commit "$implementation_commit" --arg body "$expected_decision_body" '.schema_version == "synapse-sca-benchmark-github-review-disposition-capture-v1" and .decision == "approved" and .review_id == $review_id and .reviewed_commit == $reviewed_commit and .implementation_commit == $implementation_commit and .created_at == .updated_at and .body == $body' "$decision_file" >/dev/null
          decision_login="$(jq -er '.login' "$decision_file")"
          test "$decision_login" != "$review_login"
          while IFS= read -r target_json; do
            target_id="$(jq -r '.id' <<<"$target_json")"
            expected_sbom_digest="$(jq -r '.sbom_digest' <<<"$target_json")"
            sbom="$input/sboms/$target_id.cdx.json"
            canonical="$RUNNER_TEMP/$target_id.cdx.canonical.json"
            test -s "$sbom"
            jq -e '.bomFormat == "CycloneDX" and (.specVersion | type == "string") and (.components | type == "array")' "$sbom" >/dev/null
            jq -S -c . "$sbom" > "$canonical"
            cmp -s "$sbom" "$canonical"
            expected_components="$(jq -ce --arg target "$target_id" '
              def trim_space: gsub("^[[:space:]]+|[[:space:]]+$"; "");
              def required_string($field):
                if type == "string" and (trim_space | length > 0) then .
                else error("catalog component \($field) must be a nonempty string")
                end;
              [.targets[] | select(.id == $target) | .components[] |
                {purl: (.purl | required_string("purl")), version: (.version | required_string("version"))}
              ] | sort_by(.purl, .version)
            ' "$corpus/catalog.json")"
            benchmark_scopes="$(jq -nce --argjson components "$expected_components" '
              def trim_space: gsub("^[[:space:]]+|[[:space:]]+$"; "");
              def purl_scope:
                trim_space as $purl |
                if ($purl | startswith("pkg:")) then . else error("component purl must begin with pkg") end |
                ($purl[4:] | sub("[?#].*$"; "")) as $path |
                ($path | capture("^(?<ecosystem>[a-z0-9.-]+)/(?<package>.+)$")) as $parts |
                ($parts.package | rindex("@")) as $version_delimiter |
                ($parts.package | if $version_delimiter == null then . else .[0:$version_delimiter] end) as $package |
                if ($package | length == 0) or ($package | split("/") | any(. | trim_space | length == 0)) then
                  error("component purl package is invalid")
                else
                  [$parts.ecosystem, $package]
                end;
              [$components[] | .purl | purl_scope] | unique
            ')"
            actual_components="$(jq -ce --argjson benchmark_scopes "$benchmark_scopes" '
              def trim_space: gsub("^[[:space:]]+|[[:space:]]+$"; "");
              def purl_scope:
                trim_space as $purl |
                if ($purl | startswith("pkg:")) then . else error("component purl must begin with pkg") end |
                ($purl[4:] | sub("[?#].*$"; "")) as $path |
                ($path | capture("^(?<ecosystem>[a-z0-9.-]+)/(?<package>.+)$")) as $parts |
                ($parts.package | rindex("@")) as $version_delimiter |
                ($parts.package | if $version_delimiter == null then . else .[0:$version_delimiter] end) as $package |
                if ($package | length == 0) or ($package | split("/") | any(. | trim_space | length == 0)) then
                  error("component purl package is invalid")
                else
                  [$parts.ecosystem, $package]
                end;
              [.components[] |
                if type != "object" then
                  error("SBOM component must be an object")
                elif ((has("purl") and (.purl != null) and (.purl | type != "string")) or
                  (has("version") and (.version != null) and (.version | type != "string"))) then
                  error("SBOM component purl and version must be strings when present")
                elif ((.purl? | type) == "string" and (.purl | trim_space | length > 0)) then
                  (.purl | purl_scope) as $scope |
                  if ((.version? | type) == "string" and (.version | trim_space | length > 0) and
                    ($benchmark_scopes | any(. == $scope))) then
                    {purl, version}
                  else
                    empty
                  end
                else
                  empty
                end
              ] | sort_by(.purl, .version)
            ' "$sbom")"
            test "$actual_components" = "$expected_components"
            test "sha256:$(sha256sum "$sbom" | cut -d' ' -f1)" = "$expected_sbom_digest"
          done < <(jq -rc '.targets[]' "$corpus/catalog.json")
          status="$RUNNER_TEMP/sca-accuracy-candidate/capture-status.json"
          jq '.phase = "preflight_complete"' "$status" > "$status.next"
          mv "$status.next" "$status"
      - name: Materialize inputs and freeze the scanner-free oracle chain
        shell: bash
        run: |
          set -euo pipefail
          corpus="internal/usecase/scabench/corpus"
          input="$SCA_ACCURACY_TRUSTED_INPUT_ROOT"
          output="$RUNNER_TEMP/sca-accuracy-candidate"
          mkdir -p "$output/control/sboms" "$output/control/capture-manifests" "$output/control/capability-statements" "$output/records" "$output/publication"
          jq '.phase = "source_evidence_preparing"' "$output/capture-status.json" > "$output/capture-status.next.json"
          mv "$output/capture-status.next.json" "$output/capture-status.json"
          cp "$corpus/catalog.json" "$output/control/catalog.json"
          cp "$corpus/oracle.json" "$output/control/oracle.json"
          cp "$corpus/ratchet.json" "$output/control/ratchet.json"
          cp "$corpus/ratchet-baseline.json" "$output/control/ratchet-baseline.json"
          cp "$corpus/cycle-policy.json" "$output/control/cycle-policy.json"
          cp "$corpus/falsifier-spec.json" "$output/control/falsifier-spec.json"
          go run ./cmd/synapse-sca-inputs -mode source-freeze -repository-root "$input/repository" -source-freeze-template "$corpus/source-freeze.template.json" -source-plan-template "$corpus/source-evidence-plan.template.json" -source-freeze-output "$output/control/source-freeze.json" -source-plan-output "$output/control/source-evidence-plan.json"
          while IFS= read -r asset_json; do
            locator="$(jq -er '.locator' <<<"$asset_json")"
            expected_digest="$(jq -er '.digest' <<<"$asset_json")"
            expected_size="$(jq -er '.size' <<<"$asset_json")"
            source_asset="$input/repository/$locator"
            retained_asset="$output/control/source-assets/$locator"
            test -f "$source_asset"
            mkdir -p "$(dirname "$retained_asset")"
            cp "$source_asset" "$retained_asset"
            cmp -s "$source_asset" "$retained_asset"
            test "sha256:$(sha256sum "$retained_asset" | cut -d' ' -f1)" = "$expected_digest"
            test "$(wc -c < "$retained_asset")" = "$expected_size"
          done < <(jq -rc '.assets[]' "$output/control/source-freeze.json")
          while IFS= read -r target_json; do
            target_id="$(jq -r '.id' <<<"$target_json")"
            expected_sbom_digest="$(jq -r '.sbom_digest' <<<"$target_json")"
            frozen_sbom="$input/sboms/$target_id.cdx.json"
            sbom="$output/control/sboms/$target_id.cdx.json"
            cp "$frozen_sbom" "$sbom"
            cmp -s "$frozen_sbom" "$sbom"
            test "sha256:$(sha256sum "$sbom" | cut -d' ' -f1)" = "$expected_sbom_digest"
          done < <(jq -rc '.targets[]' "$output/control/catalog.json")
          go run ./cmd/synapse-sca-inputs -mode manifest-set -repository-root "$input/repository" -source-freeze-output "$output/control/source-freeze.json" -catalog "$output/control/catalog.json" -oracle "$output/control/oracle.json" -ratchet "$output/control/ratchet.json" -manifest-template-dir "$corpus/capture-manifests" -manifest-output-dir "$output/control/capture-manifests" -capability-output-dir "$output/control/capability-statements" -sbom-root "$output/control/sboms"
          make sca-accuracy-source-native-evidence SCA_ACCURACY_REPOSITORY_ROOT="$input/repository" SCA_ACCURACY_SOURCE_FREEZE="$output/control/source-freeze.json" SCA_ACCURACY_CATALOG="$output/control/catalog.json" SCA_ACCURACY_SOURCE_EVIDENCE_PLAN="$output/control/source-evidence-plan.json" SCA_ACCURACY_SOURCE_EVIDENCE_OUTPUT="$output/control/source-case-evidence.json" SCA_ACCURACY_NATIVE_EVIDENCE_OUTPUT="$output/control/native-evidence.json"
          go run ./cmd/synapse-sca-cycle -mode oracle-candidate -repository-root "$input/repository" -source-freeze "$output/control/source-freeze.json" -source-case-evidence "$output/control/source-case-evidence.json" -oracle-output "$output/control/oracle-candidate.json"
          go run ./cmd/synapse-sca-cycle -mode oracle-cross-check -source-case-evidence "$output/control/source-case-evidence.json" -native-evidence "$output/control/native-evidence.json" -oracle-candidate "$output/control/oracle-candidate.json" -oracle-output "$output/control/cross-check.json"
          go run ./cmd/synapse-sca-cycle -mode oracle-adjudicate -oracle-candidate "$output/control/oracle-candidate.json" -cross-check "$output/control/cross-check.json" -oracle-output "$output/control/adjudication.json"
          shopt -s nullglob
          review_files=("$input/repository/reviews/github/"*.json)
          decision_files=("$input/repository/reviews/dispositions/github/"*.json)
          test "${#review_files[@]}" = 1
          test "${#decision_files[@]}" = 1
          review_locator="${review_files[0]#"$input/repository/"}"
          decision_locator="${decision_files[0]#"$input/repository/"}"
          go run ./cmd/synapse-sca-inputs -mode accountable-review -repository-root "$input/repository" -review-capture-locator "$review_locator" -review-capture-output "$output/control/review-capture.json" -decision-capture-locator "$decision_locator" -decision-capture-output "$output/control/review-disposition-capture.json" -implementation-commit "${{ needs.changes.outputs.source_sha }}" -adjudication "$output/control/adjudication.json" -oracle "$output/control/oracle.json" -review-output "$output/control/accountable-review.json"
          go run ./cmd/synapse-sca-cycle -mode oracle-freeze -repository-root "$input/repository" -source-freeze "$output/control/source-freeze.json" -oracle-candidate "$output/control/oracle-candidate.json" -cross-check "$output/control/cross-check.json" -adjudication "$output/control/adjudication.json" -accountable-review "$output/control/accountable-review.json" -oracle "$output/control/oracle.json" -oracle-output "$output/control/final-oracle-freeze.json"
          go run ./cmd/synapse-sca-inputs -mode plan -source-freeze-output "$output/control/source-freeze.json" -oracle-candidate "$output/control/oracle-candidate.json" -cross-check "$output/control/cross-check.json" -adjudication "$output/control/adjudication.json" -accountable-review "$output/control/accountable-review.json" -final-oracle-freeze "$output/control/final-oracle-freeze.json" -catalog "$output/control/catalog.json" -oracle "$output/control/oracle.json" -ratchet "$output/control/ratchet.json" -baseline-ratchet "$output/control/ratchet-baseline.json" -cycle-policy "$output/control/cycle-policy.json" -plan-output "$output/control/plan.json"
          make sca-accuracy-prepare SCA_ACCURACY_REPOSITORY_ROOT="$input/repository" SCA_ACCURACY_PLAN="$output/control/plan.json" SCA_ACCURACY_SOURCE_FREEZE="$output/control/source-freeze.json" SCA_ACCURACY_ORACLE_CANDIDATE="$output/control/oracle-candidate.json" SCA_ACCURACY_CROSS_CHECK="$output/control/cross-check.json" SCA_ACCURACY_ADJUDICATION="$output/control/adjudication.json" SCA_ACCURACY_ACCOUNTABLE_REVIEW="$output/control/accountable-review.json" SCA_ACCURACY_FINAL_ORACLE_FREEZE="$output/control/final-oracle-freeze.json"
          jq '.phase = "capture_pending"' "$output/capture-status.json" > "$output/capture-status.next.json"
          mv "$output/capture-status.next.json" "$output/capture-status.json"
      - name: Capture planned slots with retained retries
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          input="$SCA_ACCURACY_TRUSTED_INPUT_ROOT"
          output="$RUNNER_TEMP/sca-accuracy-candidate"
          control="$output/control"
          status="$output/capture-status.json"
          accepted_bundles="$control/accepted-bundles.json"
          test -s "$status"
          test -s "$accepted_bundles"
          jq '.phase = "capturing"' "$status" > "$status.next"
          mv "$status.next" "$status"
          repetitions="$(jq -er '.repetitions' "$control/plan.json")"
          max_attempts="$(jq -er '.max_attempts' "$control/cycle-policy.json")"
          retention_policy="$(jq -er '.raw_retention' "$control/cycle-policy.json")"
          planned_slots=0
          accepted_slots=0
          retained_failed_attempts=0
          all_slots_accepted=true
          records=()
          repetition=1
          while [ "$repetition" -le "$repetitions" ]; do
            while IFS= read -r encoded; do
              cell="$(printf '%s' "$encoded" | base64 --decode)"
              target="$(jq -r '.target_id' <<<"$cell")"
              engine="$(jq -r '.engine' <<<"$cell")"
              manifest="$control/capture-manifests/$target--$engine.json"
              test -s "$manifest"
              cell_accepted=false
              attempt=1
              while [ "$attempt" -le "$max_attempts" ]; do
                bundle="$SCA_ACCURACY_RAW_RETENTION_ROOT/${GITHUB_RUN_ID:-local}/${GITHUB_RUN_ATTEMPT:-1}/$repetition/$target--$engine/attempt-$attempt"
                record="$output/records/$repetition-$target--$engine-attempt-$attempt.json"
                locator="protected://engine-accuracy/${GITHUB_RUN_ID:-local}/${GITHUB_RUN_ATTEMPT:-1}/$repetition/$target--$engine/attempt-$attempt"
                mkdir -p "$(dirname "$bundle")"
                set +e
                make sca-accuracy-cell SCA_ACCURACY_REPOSITORY_ROOT="$input/repository" SCA_ACCURACY_PLAN="$control/plan.json" SCA_ACCURACY_SOURCE_FREEZE="$control/source-freeze.json" SCA_ACCURACY_ORACLE_CANDIDATE="$control/oracle-candidate.json" SCA_ACCURACY_CROSS_CHECK="$control/cross-check.json" SCA_ACCURACY_ADJUDICATION="$control/adjudication.json" SCA_ACCURACY_ACCOUNTABLE_REVIEW="$control/accountable-review.json" SCA_ACCURACY_FINAL_ORACLE_FREEZE="$control/final-oracle-freeze.json" SCA_ACCURACY_CATALOG="$control/catalog.json" SCA_ACCURACY_CAPTURE_MANIFEST="$manifest" SCA_ACCURACY_NATIVE_EVIDENCE="$control/native-evidence.json" SCA_ACCURACY_CAPTURE_RECORD_OUTPUT="$record" SCA_ACCURACY_OUTPUT="$bundle" SCA_ACCURACY_REPETITION="$repetition" SCA_ACCURACY_RETENTION_LOCATOR="$locator" SCA_ACCURACY_RETENTION_POLICY="$retention_policy"
                exit_code=$?
                set -e
                case "$exit_code" in
                  0)
                    test -s "$record"
                    records+=("-capture-record" "$record")
                    jq --argjson repetition "$repetition" --arg target "$target" --arg engine "$engine" --argjson attempt "$attempt" '.bundles += [{repetition:$repetition, target_id:$target, engine:$engine, attempt:$attempt}]' "$accepted_bundles" > "$accepted_bundles.next"
                    mv "$accepted_bundles.next" "$accepted_bundles"
                    cell_accepted=true
                    accepted_slots=$((accepted_slots + 1))
                    break
                    ;;
                  2)
                    test -s "$record"
                    test -d "$bundle"
                    records+=("-capture-record" "$record")
                    retained_failed_attempts=$((retained_failed_attempts + 1))
                    ;;
                  *)
                    jq --argjson planned_slots "$planned_slots" --argjson accepted_slots "$accepted_slots" --argjson retained_failed_attempts "$retained_failed_attempts" '.status = "pre_dispatch_failure" | .phase = "capture_failed" | .planned_slots = $planned_slots | .accepted_slots = $accepted_slots | .retained_failed_attempts = $retained_failed_attempts' "$status" > "$status.next"
                    mv "$status.next" "$status"
                    echo "pre-dispatch or input-invalid capture failure for $repetition/$target/$engine" >&2
                    exit 1
                    ;;
                esac
                attempt=$((attempt + 1))
              done
              if [ "$cell_accepted" != true ]; then
                all_slots_accepted=false
              fi
              planned_slots=$((planned_slots + 1))
            done < <(jq -rc '.cells[] | @base64' "$control/plan.json")
            repetition=$((repetition + 1))
          done
          cells_per_repetition="$(jq '.cells | length' "$control/plan.json")"
          expected_slots=$((repetitions * cells_per_repetition))
          per_repetition_dispatches="$(jq '[.cells[] | .scanner_dispatches] | add' "$control/plan.json")"
          per_repetition_unsupported="$(jq '[.cells[] | select(.expected_state == "unsupported" and .scanner_dispatches == 0)] | length' "$control/plan.json")"
          expected_dispatches=$((repetitions * per_repetition_dispatches))
          expected_unsupported=$((repetitions * per_repetition_unsupported))
          test "$planned_slots" = "$expected_slots"
          jq --arg status "retained_failure" --argjson planned_slots "$planned_slots" --argjson accepted_slots "$accepted_slots" --argjson retained_failed_attempts "$retained_failed_attempts" --argjson scanner_dispatches "$expected_dispatches" --argjson unsupported_records "$expected_unsupported" '.status = $status | .phase = "capture_complete" | .planned_slots = $planned_slots | .accepted_slots = $accepted_slots | .retained_failed_attempts = $retained_failed_attempts | .scanner_dispatches = $scanner_dispatches | .unsupported_records = $unsupported_records' "$status" > "$status.next"
          mv "$status.next" "$status"
          if [ "$all_slots_accepted" = true ]; then
            test "$accepted_slots" = "$expected_slots"
            actual_dispatches="$(jq -s '[.[] | select(.outcome == "accepted" and .observation_state == "complete") | .scanner_dispatches] | add' "$output"/records/*.json)"
            actual_unsupported="$(jq -s '[.[] | select(.outcome == "accepted" and .observation_state == "unsupported" and .scanner_dispatches == 0)] | length' "$output"/records/*.json)"
            test "$actual_dispatches" = "$expected_dispatches"
            test "$actual_unsupported" = "$expected_unsupported"
            test "$(jq '.bundles | length' "$accepted_bundles")" = "$expected_slots"
            jq '.status = "accepted"' "$status" > "$status.next"
            mv "$status.next" "$status"
            go run ./cmd/synapse-sca-cycle -mode ledger -plan "$control/plan.json" -ledger-output "$control/cycle-ledger.json" "${records[@]}"
            echo "accepted=true" >> "$GITHUB_OUTPUT"
          else
            echo "accepted=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload audited capture controls before verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: engine-accuracy-attempt-controls-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.changes.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/sca-accuracy-candidate/control
            ${{ runner.temp }}/sca-accuracy-candidate/records
            ${{ runner.temp }}/sca-accuracy-candidate/capture-status.json
          if-no-files-found: error
          retention-days: ${{ steps.policy.outputs.failed_retention_days }}
      - name: Finalize comparisons, falsifiers, reduction, ratchet, and report
        if: ${{ steps.capture.outputs.accepted == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/sca-accuracy-candidate"
          control="$output/control"
          publication="$output/publication"
          accepted_bundles="$control/accepted-bundles.json"
          repetitions="$(jq -er '.repetitions' "$control/plan.json")"
          cells="$(jq '.cells | length' "$control/plan.json")"
          expected_slots=$((repetitions * cells))
          test "$(jq '.bundles | length' "$accepted_bundles")" = "$expected_slots"
          mkdir -p "$control/observations" "$publication"
          comparison_pairs=()
          observations=()
          repetition=1
          while [ "$repetition" -le "$repetitions" ]; do
            mkdir -p "$control/observations/$repetition"
            while IFS= read -r encoded; do
              cell="$(printf '%s' "$encoded" | base64 --decode)"
              target="$(jq -r '.target_id' <<<"$cell")"
              engine="$(jq -r '.engine' <<<"$cell")"
              attempt="$(jq -er --argjson repetition "$repetition" --arg target "$target" --arg engine "$engine" '[.bundles[] | select(.repetition == $repetition and .target_id == $target and .engine == $engine)] | if length == 1 then .[0].attempt else error("missing or ambiguous accepted bundle") end' "$accepted_bundles")"
              max_attempts="$(jq -er '.max_attempts' "$control/cycle-policy.json")"
              test "$attempt" -ge 1
              test "$attempt" -le "$max_attempts"
              bundle="$SCA_ACCURACY_RAW_RETENTION_ROOT/${GITHUB_RUN_ID:-local}/${GITHUB_RUN_ATTEMPT:-1}/$repetition/$target--$engine/attempt-$attempt"
              test -s "$bundle/observation.json"
              observation="$control/observations/$repetition/$target--$engine.json"
              cp "$bundle/observation.json" "$observation"
              cmp -s "$bundle/observation.json" "$observation"
              observations+=("$observation")
              if [ "$repetition" = 1 ]; then
                comparison_repetition="$repetitions"
                second_attempt="$(jq -er --argjson repetition "$comparison_repetition" --arg target "$target" --arg engine "$engine" '[.bundles[] | select(.repetition == $repetition and .target_id == $target and .engine == $engine)] | if length == 1 then .[0].attempt else error("missing or ambiguous accepted bundle") end' "$accepted_bundles")"
                test "$second_attempt" -ge 1
                test "$second_attempt" -le "$max_attempts"
                second_bundle="$SCA_ACCURACY_RAW_RETENTION_ROOT/${GITHUB_RUN_ID:-local}/${GITHUB_RUN_ATTEMPT:-1}/$comparison_repetition/$target--$engine/attempt-$second_attempt"
                test -s "$second_bundle/observation.json"
                comparison_pairs+=("$engine,$bundle,$second_bundle")
              fi
            done < <(jq -rc '.cells[] | @base64' "$control/plan.json")
            repetition=$((repetition + 1))
          done
          test "${#observations[@]}" = "$expected_slots"
          test "${#comparison_pairs[@]}" = "$cells"
          make sca-accuracy-finalize SCA_ACCURACY_PLAN="$control/plan.json" SCA_ACCURACY_LEDGER="$control/cycle-ledger.json" SCA_ACCURACY_CATALOG="$control/catalog.json" SCA_ACCURACY_ORACLE="$control/oracle.json" SCA_ACCURACY_RATCHET="$control/ratchet.json" SCA_ACCURACY_RESULT_OUTPUT="$publication/result.json" SCA_ACCURACY_REPORT_OUTPUT="$publication/report.md" SCA_ACCURACY_COMPARISON_OUTPUT="$publication/comparisons.json" SCA_ACCURACY_FALSIFIER_OUTPUT="$publication/falsifiers.json" SCA_ACCURACY_FALSIFIER_SPEC="$control/falsifier-spec.json" SCA_ACCURACY_OBSERVATIONS="${observations[*]}" SCA_ACCURACY_COMPARISON_PAIRS="${comparison_pairs[*]}"
          cp "$control/source-case-evidence.json" "$publication/source-case-evidence.json"
          cp "$control/native-evidence.json" "$publication/native-evidence.json"
          cp "$control/oracle-candidate.json" "$publication/oracle-candidate.json"
          cp "$control/cross-check.json" "$publication/cross-check.json"
          cp "$control/adjudication.json" "$publication/adjudication.json"
          cp "$control/accountable-review.json" "$publication/accountable-review.json"
          cp "$control/final-oracle-freeze.json" "$publication/final-oracle-freeze.json"
          cp "$control/cycle-ledger.json" "$publication/cycle-ledger.json"
          go run ./cmd/synapse-sca-inputs -mode publication-control -candidate-root "$output" -implementation-commit "${{ needs.changes.outputs.source_sha }}" -plan-output "$control/plan.json" -publication-control-output "$control/publication-control.json"
          make sca-accuracy-publication SCA_ACCURACY_PLAN="$control/plan.json" SCA_ACCURACY_LEDGER="$control/cycle-ledger.json" SCA_ACCURACY_PUBLICATION_CONTROL="$control/publication-control.json" SCA_ACCURACY_PUBLICATION_OUTPUT="$publication/publication-manifest.json" SCA_ACCURACY_ACCOUNTABLE_REVIEW="$publication/accountable-review.json" SCA_ACCURACY_SOURCE_CASE_EVIDENCE="$publication/source-case-evidence.json" SCA_ACCURACY_NATIVE_EVIDENCE="$publication/native-evidence.json" SCA_ACCURACY_ORACLE_CANDIDATE="$publication/oracle-candidate.json" SCA_ACCURACY_CROSS_CHECK="$publication/cross-check.json" SCA_ACCURACY_ADJUDICATION="$publication/adjudication.json" SCA_ACCURACY_FINAL_ORACLE_FREEZE="$publication/final-oracle-freeze.json" SCA_ACCURACY_RATCHET="$control/ratchet.json" SCA_ACCURACY_COMPARISON_OUTPUT="$publication/comparisons.json" SCA_ACCURACY_FALSIFIER_OUTPUT="$publication/falsifiers.json" SCA_ACCURACY_RESULT_OUTPUT="$publication/result.json" SCA_ACCURACY_REPORT_OUTPUT="$publication/report.md" SCA_ACCURACY_EVIDENCE_SUMMARY_OUTPUT="$output/candidate-evidence-summary.json"
          test -s "$publication/publication-manifest.json"
          test -s "$output/candidate-evidence-summary.json"
          rm -f \
            "$output/capture-status.json" \
            "$control/accepted-bundles.json" \
            "$control/source-case-evidence.json" \
            "$control/native-evidence.json" \
            "$control/oracle-candidate.json" \
            "$control/cross-check.json" \
            "$control/adjudication.json" \
            "$control/accountable-review.json" \
            "$control/final-oracle-freeze.json" \
            "$control/cycle-ledger.json" \
            "$control/publication-control.json"
          for transient in \
            "$output/capture-status.json" \
            "$control/accepted-bundles.json" \
            "$control/source-case-evidence.json" \
            "$control/native-evidence.json" \
            "$control/oracle-candidate.json" \
            "$control/cross-check.json" \
            "$control/adjudication.json" \
            "$control/accountable-review.json" \
            "$control/final-oracle-freeze.json" \
            "$control/cycle-ledger.json" \
            "$control/publication-control.json"; do
            test ! -e "$transient"
          done
      - name: Clean protected raw and Docker runner state
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/sca-accuracy-candidate"
          go run ./cmd/synapse-sca-inputs -mode cleanup -raw-retention-root "$SCA_ACCURACY_RAW_RETENTION_ROOT" -run-id "${GITHUB_RUN_ID:-local}" -run-attempt "${GITHUB_RUN_ATTEMPT:-1}" -cleanup-output "$output/cleanup-receipt.json"
      - name: Generate candidate inventory and delivery receipt
        if: ${{ steps.capture.outputs.accepted == 'true' }}
        id: complete
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/sca-accuracy-candidate"
          control="$output/control"
          publication="$output/publication"
          artifact_name="engine-accuracy-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ needs.changes.outputs.source_sha }}"
          go run ./cmd/synapse-sca-inputs -mode receipt -candidate-root "$output" -implementation-commit "${{ needs.changes.outputs.source_sha }}" -plan-output "$control/plan.json" -cycle-policy "$control/cycle-policy.json" -catalog "$control/catalog.json" -oracle "$control/oracle.json" -ratchet "$control/ratchet.json" -ledger "$publication/cycle-ledger.json" -result "$publication/result.json" -publication-manifest "$publication/publication-manifest.json" -cleanup-receipt "$output/cleanup-receipt.json" -receipt-output "$output/delivery-receipt.json" -inventory-output "$output/candidate-file-inventory.json" -markdown-output "$output/pr-comment.md" -artifact-name "$artifact_name"
          test -s "$output/delivery-receipt.json"
          test -s "$output/candidate-file-inventory.json"
          test -s "$output/pr-comment.md"
          cat "$output/pr-comment.md" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifacts=produced" >> "$GITHUB_OUTPUT"
      - name: Upload bounded candidate controls and results
        id: candidate-upload
        if: ${{ steps.capture.outputs.accepted == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.complete.outputs.artifact_name }}
          path: ${{ runner.temp }}/sca-accuracy-candidate
          if-no-files-found: error
          retention-days: ${{ steps.policy.outputs.accepted_retention_days }}
      - name: Fail after audited retained-attempt upload
        if: ${{ always() && steps.capture.outputs.accepted != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.capture.outputs.accepted }}" = true

  aggregate:
    name: Aggregate evidence-cycle status
    needs: [changes, smoke, offline-verify, trusted-full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable outcome and full artifact production
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          TRUSTED_ENABLED: ${{ vars.ENGINE_ACCURACY_TRUSTED_ENABLED }}
          TRUSTED_REQUESTED: ${{ needs.changes.outputs.trusted_requested }}
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }} smoke=${{ needs.smoke.result }} offline=${{ needs.offline-verify.result }} full=${{ needs.trusted-full.result }} artifacts=${{ needs.trusted-full.outputs.artifacts }} artifact_id=${{ needs.trusted-full.outputs.artifact_id }} artifact_digest=${{ needs.trusted-full.outputs.artifact_digest }}"
          test "${{ needs.changes.result }}" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "${{ needs.smoke.result }}" = success
            test "${{ needs.offline-verify.result }}" = success
            test "${{ needs.trusted-full.result }}" = skipped
          elif [ "$TRUSTED_REQUESTED" != true ]; then
            test "${{ needs.trusted-full.result }}" = skipped
            if [ "$TRUSTED_ENABLED" = true ]; then
              echo "trusted evidence cycle not requested for non-authorized ref $WORKFLOW_REF"
            else
              echo "trusted evidence cycle disabled by ENGINE_ACCURACY_TRUSTED_ENABLED"
            fi
          else
            test "${{ needs.trusted-full.result }}" = success
            test "${{ needs.trusted-full.outputs.artifacts }}" = produced
            test -n "${{ needs.trusted-full.outputs.artifact_id }}"
            test -n "${{ needs.trusted-full.outputs.artifact_digest }}"
            test "${{ needs.offline-verify.result }}" = skipped
          fi
