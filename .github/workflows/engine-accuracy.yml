name: Engine accuracy benchmark

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-accuracy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Hosted SCA regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Measure embedded owned corpus and gate its ratchet
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/sca-regression"
          go run ./cmd/synapse-bench -mode sca-owned -output "$RUNNER_TEMP/sca-regression/owned-accuracy.json"
          bash scripts/require-go-tests.sh TestDetectionAccuracyGolden "$RUNNER_TEMP/sca-regression/owned-test.jsonl" pass ./internal/usecase/sca -run '^TestDetectionAccuracyGolden$'
          bash scripts/require-go-tests.sh TestOwnedRecallParityOnCommittedRatchet,TestCommittedCorpusEvidenceCurrency,TestCommittedRatchetCoversEveryBaselineTarget \
            "$RUNNER_TEMP/sca-regression/corpus-tests.jsonl" pass ./internal/usecase/scabench \
            -run '^Test(OwnedRecallParityOnCommittedRatchet|CommittedCorpusEvidenceCurrency|CommittedRatchetCoversEveryBaselineTarget)$'
          python3 -m unittest scripts/test_verify_sca_hosted_regression.py
          python3 -m unittest scripts/test_extract_sca_hosted_matrix.py
          go test -count=1 scripts/sca_hosted_score.go scripts/sca_hosted_score_test.go
          go test -count=1 scripts/sca_hosted_matrix_score.go scripts/sca_hosted_matrix_score_test.go
          go run scripts/sca_maintainer_authorization_digests.go --corpus-root internal/usecase/scabench/corpus > "$RUNNER_TEMP/sca-regression/inputs.json"
          python3 scripts/verify_sca_hosted_regression.py \
            --owned-report "$RUNNER_TEMP/sca-regression/owned-accuracy.json" \
            --digests "$RUNNER_TEMP/sca-regression/inputs.json" \
            --capture internal/usecase/scabench/testdata/accepted-capture.json \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/sca-regression/regression.json"
          test -s "$RUNNER_TEMP/sca-regression/regression.json"
      - name: Verify pinned offline SCA matrix inputs
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sca-hosted-regression-v1.tar.gz"
          manifest=testdata/sca/hosted-matrix-inputs.manifest.json
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/KKloudTarus/synapse-ce/releases/download/benchmark-sca-inputs-v1/sca-hosted-regression-v1.tar.gz
          python3 scripts/extract_sca_hosted_matrix.py --archive "$archive" --manifest "$manifest" --output "$RUNNER_TEMP/sca-matrix-inputs"
      - name: Run fresh same-input owned and competitor matrix offline
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          go build -o "$RUNNER_TEMP/synapse-sca-bench" ./cmd/synapse-sca-bench
          mkdir -p "$RUNNER_TEMP/sca-matrix-wires"
          docker run --rm --network none \
            --volume "$RUNNER_TEMP/sca-matrix-inputs:/inputs:ro" \
            --volume "$RUNNER_TEMP/sca-matrix-wires:/out" \
            --volume "$RUNNER_TEMP/synapse-sca-bench:/owned:ro" \
            --volume "$GITHUB_WORKSPACE/scripts/run_sca_hosted_matrix.sh:/run-sca-matrix.sh:ro" \
            ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3 \
            bash /run-sca-matrix.sh
          go run scripts/sca_hosted_matrix_score.go \
            --catalog internal/usecase/scabench/corpus/catalog.json \
            --oracle internal/usecase/scabench/corpus/oracle.json \
            --ratchet internal/usecase/scabench/corpus/ratchet.json \
            --wire-dir "$RUNNER_TEMP/sca-matrix-wires" \
            --input-dir "$RUNNER_TEMP/sca-matrix-inputs" \
            --owned-binary "$RUNNER_TEMP/synapse-sca-bench" \
            --archive-sha256 "$(jq -r '.archive_sha256' testdata/sca/hosted-matrix-inputs.manifest.json)" \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/sca-regression/matrix-result.json"
          jq -e '.passed == true and .target_count == 3 and .cell_count == 12 and .parity == "passed"' "$RUNNER_TEMP/sca-regression/matrix-result.json" > /dev/null
      - name: Upload sanitized regression result
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: engine-accuracy-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sca-regression
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Aggregate SCA benchmark status
    needs: regression
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require measured regression and artifact
        shell: bash
        env:
          REGRESSION: ${{ needs.regression.result }}
          ARTIFACT: ${{ needs.regression.outputs.artifact }}
        run: |
          set -euo pipefail
          test "$REGRESSION" = success
          test -n "$ARTIFACT"
