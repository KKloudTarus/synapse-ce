name: Engine accuracy evidence cycle

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "**"
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-accuracy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Determine evidence-cycle work
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      evidence_only: ${{ steps.classify.outputs.evidence_only }}
      full_required: ${{ steps.classify.outputs.full_required }}
      trusted_requested: ${{ steps.classify.outputs.trusted_requested }}
    steps:
      - name: Resolve exact source and base revisions
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            source_sha="${{ github.event.pull_request.head.sha }}"
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            source_sha="${{ github.sha }}"
            base_sha="${{ github.event.before }}"
          else
            source_sha="${{ github.sha }}"
            base_sha=""
          fi
          case "$source_sha" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "source revision is not a full SHA"; exit 1 ;;
          esac
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.resolve.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Assert exact checkout revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.resolve.outputs.source_sha }}"
      - name: Classify changed surface
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          TRUSTED_ENABLED: ${{ vars.ENGINE_ACCURACY_TRUSTED_ENABLED }}
          TRUSTED_REF: ${{ vars.ENGINE_ACCURACY_TRUSTED_REF }}
        run: |
          set -euo pipefail
          source_sha="${{ steps.resolve.outputs.source_sha }}"
          base_sha="${{ steps.resolve.outputs.base_sha }}"
          evidence_only=false
          full_required=true
          publication_dir="internal/usecase/scabench/testdata/publication/"
          publication_manifest="${publication_dir}publication-manifest.json"
          if [ -n "$base_sha" ] && git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$base_sha" "$source_sha")"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Ev "^${publication_dir}" >/dev/null; then
              test -f "$publication_manifest"
              implementation_sha="$(jq -r '.implementation_commit // empty' "$publication_manifest")"
              test "$implementation_sha" = "$base_sha"
              evidence_only=true
              full_required=false
            fi
          fi
          trusted_requested=false
          if [ "$full_required" = "true" ] && [ "$EVENT_NAME" != "pull_request" ] && [ "$TRUSTED_ENABLED" = "true" ]; then
            if [ "$WORKFLOW_REF" = "refs/heads/main" ] || { [ -n "$TRUSTED_REF" ] && [ "$WORKFLOW_REF" = "$TRUSTED_REF" ]; }; then
              trusted_requested=true
            fi
          fi
          echo "evidence_only=$evidence_only" >> "$GITHUB_OUTPUT"
          echo "full_required=$full_required" >> "$GITHUB_OUTPUT"
          echo "trusted_requested=$trusted_requested" >> "$GITHUB_OUTPUT"

  smoke:
    name: Offline smoke
    needs: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false
      - name: Assert exact checkout revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.source_sha }}"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Run offline smoke
        run: make sca-accuracy-smoke

  offline-verify:
    name: Offline evidence verification
    needs: changes
    if: ${{ github.event_name == 'pull_request' || needs.changes.outputs.evidence_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false
      - name: Assert exact checkout revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.source_sha }}"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify checked-in evidence without scanners
        run: make sca-accuracy-verify

  trusted-full:
    name: Trusted full evidence cycle
    needs: changes
    if: ${{ needs.changes.outputs.trusted_requested == 'true' }}
    # The runner is provisioned only for this job. Its immutable local contract
    # supplies digest-checked source, pin, review, retention, and capture inputs;
    # no credentials or raw bundles are exposed to GitHub artifacts.
    runs-on: [self-hosted, linux, sca-accuracy-trusted]
    timeout-minutes: 45
    outputs:
      artifacts: ${{ steps.complete.outputs.artifacts }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
          persist-credentials: false
      - name: Assert exact checkout revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.source_sha }}"
      - name: Initialize audit-safe capture controls
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/sca-accuracy-candidate"
          mkdir -p "$output/control" "$output/records"
          printf '%s\n' '{"schema_version":"synapse-sca-benchmark-capture-status-v1","status":"pending","phase":"preflight_pending","planned_slots":0,"accepted_slots":0,"retained_failed_attempts":0}' > "$output/capture-status.json"
          printf '%s\n' '{"schema_version":"synapse-sca-benchmark-accepted-bundles-v1","bundles":[]}' > "$output/control/accepted-bundles.json"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Preflight exact trusted runner contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          command -v bwrap >/dev/null
          test -n "${SCA_ACCURACY_BWRAP_VERSION:-}"
          test "$(bwrap --version)" = "$SCA_ACCURACY_BWRAP_VERSION"
          test -r /sys/fs/cgroup/cgroup.controllers
          grep -qw memory /sys/fs/cgroup/cgroup.controllers
          grep -qw pids /sys/fs/cgroup/cgroup.controllers
          test -n "${SCA_ACCURACY_DELEGATED_CGROUP_ROOT:-}"
          case "$SCA_ACCURACY_DELEGATED_CGROUP_ROOT" in /sys/fs/cgroup/*) ;; *) echo "delegated cgroup root must be under cgroup v2"; exit 1;; esac
          test -d "$SCA_ACCURACY_DELEGATED_CGROUP_ROOT"
          test -w "$SCA_ACCURACY_DELEGATED_CGROUP_ROOT"
          # The real child-process probe verifies the explicit delegated service
          # root, direct cgroup, Bubblewrap, and per-child seccomp path; host
          # Seccomp is irrelevant.
          go run ./cmd/synapse-sca-cycle -mode sandbox-probe
          command -v docker >/dev/null
          # Evaluation consumes only pre-frozen canonical CycloneDX SBOMs. The
          # Syft probe and configuration are evidence from the authorized SBOM
          # preparation phase; no Syft process is invoked by this workflow.
          test -n "${SCA_ACCURACY_SYFT_VERSION:-}"
          test -n "${SCA_ACCURACY_SYFT_CONFIG_DIGEST:-}"
          test -n "${SCA_ACCURACY_TRUSTED_INPUT_ROOT:-}"
          test -d "$SCA_ACCURACY_TRUSTED_INPUT_ROOT"
          test -d "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/repository"
          command -v jq >/dev/null
          jq -e --arg version "$SCA_ACCURACY_SYFT_VERSION" --arg config_digest "$SCA_ACCURACY_SYFT_CONFIG_DIGEST" '.version == $version and .config_digest == $config_digest and .network_disabled == true and .check_for_app_update == false' "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/syft-probe.json" >/dev/null
          test "sha256:$(sha256sum "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/syft-config.json" | cut -d' ' -f1)" = "$SCA_ACCURACY_SYFT_CONFIG_DIGEST"
          test -n "${SCA_ACCURACY_RAW_RETENTION_ROOT:-}"
          test -d "$SCA_ACCURACY_RAW_RETENTION_ROOT"
          test -w "$SCA_ACCURACY_RAW_RETENTION_ROOT"
          case "$SCA_ACCURACY_RAW_RETENTION_ROOT/" in "$RUNNER_TEMP"/*) echo "raw retention must not be under runner artifacts"; exit 1;; esac
          for required in source-freeze.json source-evidence-plan.json accountable-review.json oracle.json plan.json catalog.json ratchet.json falsifier-spec.json publication-control.json syft-probe.json syft-config.json; do
            test -s "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/$required"
          done
          while IFS= read -r target_json; do
            target_id="$(jq -r '.id' <<<"$target_json")"
            expected_sbom_digest="$(jq -r '.sbom_digest' <<<"$target_json")"
            sbom="$SCA_ACCURACY_TRUSTED_INPUT_ROOT/sboms/$target_id.cdx.json"
            canonical="$RUNNER_TEMP/$target_id.cdx.canonical.json"
            test -s "$sbom"
            jq -e '.bomFormat == "CycloneDX" and (.specVersion | type == "string") and (.components | type == "array")' "$sbom" >/dev/null
            jq -S -c . "$sbom" > "$canonical"
            cmp -s "$sbom" "$canonical"
            expected_components="$(jq -ce --arg target "$target_id" '
              def trim_space: gsub("^[[:space:]]+|[[:space:]]+$"; "");
              def required_string($field):
                if type == "string" and (trim_space | length > 0) then .
                else error("catalog component \($field) must be a nonempty string")
                end;
              [.targets[] | select(.id == $target) | .components[] |
                {purl: (.purl | required_string("purl")), version: (.version | required_string("version"))}
              ] | sort_by(.purl, .version)
            ' "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/catalog.json")"
            benchmark_scopes="$(jq -ce --argjson components "$expected_components" '
              def trim_space: gsub("^[[:space:]]+|[[:space:]]+$"; "");
              def purl_scope:
                trim_space as $purl |
                if ($purl | startswith("pkg:")) then . else error("component purl must begin with pkg") end |
                ($purl[4:] | sub("[?#].*$"; "")) as $path |
                ($path | capture("^(?<ecosystem>[a-z0-9.-]+)/(?<package>.+)$")) as $parts |
                ($parts.package | rindex("@")) as $version_delimiter |
                ($parts.package | if $version_delimiter == null then . else .[0:$version_delimiter] end) as $package |
                if ($package | length == 0) or ($package | split("/") | any(. | trim_space | length == 0)) then
                  error("component purl package is invalid")
                else
                  [$parts.ecosystem, $package]
                end;
              [$components[] | .purl | purl_scope] | unique
            ')"
            actual_components="$(jq -ce --argjson benchmark_scopes "$benchmark_scopes" '
              def trim_space: gsub("^[[:space:]]+|[[:space:]]+$"; "");
              def purl_scope:
                trim_space as $purl |
                if ($purl | startswith("pkg:")) then . else error("component purl must begin with pkg") end |
                ($purl[4:] | sub("[?#].*$"; "")) as $path |
                ($path | capture("^(?<ecosystem>[a-z0-9.-]+)/(?<package>.+)$")) as $parts |
                ($parts.package | rindex("@")) as $version_delimiter |
                ($parts.package | if $version_delimiter == null then . else .[0:$version_delimiter] end) as $package |
                if ($package | length == 0) or ($package | split("/") | any(. | trim_space | length == 0)) then
                  error("component purl package is invalid")
                else
                  [$parts.ecosystem, $package]
                end;
              [.components[] |
                if type != "object" then
                  error("SBOM component must be an object")
                elif ((has("purl") and (.purl != null) and (.purl | type != "string")) or
                  (has("version") and (.version != null) and (.version | type != "string"))) then
                  error("SBOM component purl and version must be strings when present")
                elif ((.purl? | type) == "string" and (.purl | trim_space | length > 0)) then
                  (.purl | purl_scope) as $scope |
                  if ((.version? | type) == "string" and (.version | trim_space | length > 0) and
                    ($benchmark_scopes | index($scope) != null)) then
                    {purl, version}
                  else
                    empty
                  end
                else
                            empty
                end
              ] | sort_by(.purl, .version)
            ' "$sbom")"
            test "$actual_components" = "$expected_components"
            test "sha256:$(sha256sum "$sbom" | cut -d' ' -f1)" = "$expected_sbom_digest"
          done < <(jq -rc '.targets[]' "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/catalog.json")
          test "$(jq -r '.repetitions' "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/plan.json")" = 2
          test "$(jq '.cells | length' "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/plan.json")" = 8
          test "$(jq -r '.implementation_commit' "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/publication-control.json")" = "${{ needs.changes.outputs.source_sha }}"
          for repetition in 1 2; do
            while IFS= read -r encoded; do
              cell="$(printf '%s' "$encoded" | base64 --decode)"
              target="$(jq -r '.target_id' <<<"$cell")"
              engine="$(jq -r '.engine' <<<"$cell")"
              for input in "capture-manifests/$repetition/$target--$engine.json" "retention/$repetition/$target--$engine.json"; do
                test -s "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/$input"
              done
              jq -e 'type == "object" and (keys | sort == ["locator", "retention"]) and (.locator | strings | length > 0) and (.retention | strings | length > 0)' "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/retention/$repetition/$target--$engine.json" >/dev/null
            done < <(jq -rc '.cells[] | @base64' "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/plan.json")
          done
          status="$RUNNER_TEMP/sca-accuracy-candidate/capture-status.json"
          jq '.phase = "preflight_complete"' "$status" > "$status.next"
          mv "$status.next" "$status"
      - name: Generate scanner-free source and native evidence, then freeze the oracle chain
        shell: bash
        run: |
          set -euo pipefail
          input="$SCA_ACCURACY_TRUSTED_INPUT_ROOT"
          output="$RUNNER_TEMP/sca-accuracy-candidate"
          mkdir -p "$output/control/sboms" "$output/control/capture-manifests" "$output/records"
          jq '.phase = "source_evidence_preparing"' "$output/capture-status.json" > "$output/capture-status.next.json"
          mv "$output/capture-status.next.json" "$output/capture-status.json"
          # The trusted bootstrap delivers filtered canonical CycloneDX bytes.
          # Copying them preserves their pre-approved identity; evaluation never
          # regenerates an SBOM or substitutes a scanner-specific variant.
          while IFS= read -r target_json; do
            target_id="$(jq -r '.id' <<<"$target_json")"
            target_ref="$(jq -r '.oci_ref' <<<"$target_json")"
            target_digest="$(jq -r '.digest' <<<"$target_json")"
            expected_sbom_digest="$(jq -r '.sbom_digest' <<<"$target_json")"
            frozen_sbom="$input/sboms/$target_id.cdx.json"
            sbom="$output/control/sboms/$target_id.cdx.json"
            docker image inspect --format '{{json .RepoDigests}}' "$target_ref" | jq -e --arg ref "$target_ref" 'index($ref) != null' >/dev/null
            cp "$frozen_sbom" "$sbom"
            cmp -s "$frozen_sbom" "$sbom"
            test "sha256:$(sha256sum "$sbom" | cut -d' ' -f1)" = "$expected_sbom_digest"
          done < <(jq -rc '.targets[]' "$input/catalog.json")
          for repetition in 1 2; do
            while IFS= read -r cell; do
              target="$(jq -r '.target_id' <<<"$cell")"
              engine="$(jq -r '.engine' <<<"$cell")"
              sbom="$output/control/sboms/$target.cdx.json"
              test -s "$sbom"
              jq --arg sbom "$sbom" '.sbom_path = $sbom' "$input/capture-manifests/$repetition/$target--$engine.json" > "$output/control/capture-manifests/$repetition-$target--$engine.json"
            done < <(jq -rc '.cells[]' "$input/plan.json")
          done
          # Source selection is external, frozen metadata only. This command reads
          # its exact assets and generates every native predicate once per target.
          make sca-accuracy-source-native-evidence SCA_ACCURACY_REPOSITORY_ROOT="$input/repository" SCA_ACCURACY_SOURCE_FREEZE="$input/source-freeze.json" SCA_ACCURACY_CATALOG="$input/catalog.json" SCA_ACCURACY_SOURCE_EVIDENCE_PLAN="$input/source-evidence-plan.json" SCA_ACCURACY_SOURCE_EVIDENCE_OUTPUT="$output/control/source-case-evidence.json" SCA_ACCURACY_NATIVE_EVIDENCE_OUTPUT="$output/control/native-evidence.json"
          go run ./cmd/synapse-sca-cycle -mode oracle-candidate -repository-root "$input/repository" -source-freeze "$input/source-freeze.json" -source-case-evidence "$output/control/source-case-evidence.json" -oracle-output "$output/control/oracle-candidate.json"
          go run ./cmd/synapse-sca-cycle -mode oracle-cross-check -source-case-evidence "$output/control/source-case-evidence.json" -native-evidence "$output/control/native-evidence.json" -oracle-candidate "$output/control/oracle-candidate.json" -oracle-output "$output/control/cross-check.json"
          go run ./cmd/synapse-sca-cycle -mode oracle-adjudicate -oracle-candidate "$output/control/oracle-candidate.json" -cross-check "$output/control/cross-check.json" -oracle-output "$output/control/adjudication.json"
          go run ./cmd/synapse-sca-cycle -mode oracle-freeze -repository-root "$input/repository" -source-freeze "$input/source-freeze.json" -oracle-candidate "$output/control/oracle-candidate.json" -cross-check "$output/control/cross-check.json" -adjudication "$output/control/adjudication.json" -accountable-review "$input/accountable-review.json" -oracle "$input/oracle.json" -oracle-output "$output/control/final-oracle-freeze.json"
          make sca-accuracy-prepare SCA_ACCURACY_REPOSITORY_ROOT="$input/repository" SCA_ACCURACY_PLAN="$input/plan.json" SCA_ACCURACY_SOURCE_FREEZE="$input/source-freeze.json" SCA_ACCURACY_ORACLE_CANDIDATE="$output/control/oracle-candidate.json" SCA_ACCURACY_CROSS_CHECK="$output/control/cross-check.json" SCA_ACCURACY_ADJUDICATION="$output/control/adjudication.json" SCA_ACCURACY_ACCOUNTABLE_REVIEW="$input/accountable-review.json" SCA_ACCURACY_FINAL_ORACLE_FREEZE="$output/control/final-oracle-freeze.json"
          jq '.phase = "capture_pending"' "$output/capture-status.json" > "$output/capture-status.next.json"
          mv "$output/capture-status.next.json" "$output/capture-status.json"
      - name: Capture planned slots with retained retries
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          input="$SCA_ACCURACY_TRUSTED_INPUT_ROOT"
          output="$RUNNER_TEMP/sca-accuracy-candidate"
          status="$output/capture-status.json"
          accepted_bundles="$output/control/accepted-bundles.json"
          test -s "$status"
          test -s "$accepted_bundles"
          jq '.phase = "capturing"' "$status" > "$status.next"
          mv "$status.next" "$status"
          test "$(jq -r '.repetitions' "$input/plan.json")" = 2
          test "$(jq '.cells | length' "$input/plan.json")" = 8
          planned_slots=0
          accepted_slots=0
          retained_failed_attempts=0
          all_slots_accepted=true
          records=()
          for repetition in 1 2; do
            while IFS= read -r encoded; do
              cell="$(printf '%s' "$encoded" | base64 --decode)"
              target="$(jq -r '.target_id' <<<"$cell")"
              engine="$(jq -r '.engine' <<<"$cell")"
              manifest="$output/control/capture-manifests/$repetition-$target--$engine.json"
              retention="$input/retention/$repetition/$target--$engine.json"
              test -s "$manifest"
              test -s "$retention"
              locator="$(jq -r '.locator' "$retention")"
              policy="$(jq -r '.retention' "$retention")"
              cell_accepted=false
              for attempt in 1 2 3; do
                bundle="$SCA_ACCURACY_RAW_RETENTION_ROOT/${GITHUB_RUN_ID:-local}/${GITHUB_RUN_ATTEMPT:-1}/$repetition/$target--$engine/attempt-$attempt"
                record="$output/records/$repetition-$target--$engine-attempt-$attempt.json"
                mkdir -p "$(dirname "$bundle")"
                set +e
                make sca-accuracy-cell SCA_ACCURACY_REPOSITORY_ROOT="$input/repository" SCA_ACCURACY_PLAN="$input/plan.json" SCA_ACCURACY_SOURCE_FREEZE="$input/source-freeze.json" SCA_ACCURACY_ORACLE_CANDIDATE="$output/control/oracle-candidate.json" SCA_ACCURACY_CROSS_CHECK="$output/control/cross-check.json" SCA_ACCURACY_ADJUDICATION="$output/control/adjudication.json" SCA_ACCURACY_ACCOUNTABLE_REVIEW="$input/accountable-review.json" SCA_ACCURACY_FINAL_ORACLE_FREEZE="$output/control/final-oracle-freeze.json" SCA_ACCURACY_CATALOG="$input/catalog.json" SCA_ACCURACY_CAPTURE_MANIFEST="$manifest" SCA_ACCURACY_NATIVE_EVIDENCE="$output/control/native-evidence.json" SCA_ACCURACY_CAPTURE_RECORD_OUTPUT="$record" SCA_ACCURACY_OUTPUT="$bundle" SCA_ACCURACY_REPETITION="$repetition" SCA_ACCURACY_RETENTION_LOCATOR="$locator" SCA_ACCURACY_RETENTION_POLICY="$policy"
                exit_code=$?
                set -e
                case "$exit_code" in
                  0)
                    test -s "$record"
                    records+=("-capture-record" "$record")
                    jq --argjson repetition "$repetition" --arg target "$target" --arg engine "$engine" --argjson attempt "$attempt" '.bundles += [{repetition:$repetition, target_id:$target, engine:$engine, attempt:$attempt}]' "$accepted_bundles" > "$accepted_bundles.next"
                    mv "$accepted_bundles.next" "$accepted_bundles"
                    cell_accepted=true
                    accepted_slots=$((accepted_slots + 1))
                    break
                    ;;
                  2)
                    # Exit 2 means a validated post-dispatch failed attempt was
                    # retained. Keep both its protected bundle and auditable record
                    # before retrying; it must never become an observation result.
                    test -s "$record"
                    test -d "$bundle"
                    records+=("-capture-record" "$record")
                    retained_failed_attempts=$((retained_failed_attempts + 1))
                    ;;
                  *)
                    jq --argjson planned_slots "$planned_slots" --argjson accepted_slots "$accepted_slots" --argjson retained_failed_attempts "$retained_failed_attempts" '.status = "pre_dispatch_failure" | .phase = "capture_failed" | .planned_slots = $planned_slots | .accepted_slots = $accepted_slots | .retained_failed_attempts = $retained_failed_attempts' "$status" > "$status.next"
                    mv "$status.next" "$status"
                    echo "pre-dispatch or input-invalid capture failure for $repetition/$target/$engine" >&2
                    exit 1
                    ;;
                esac
              done
              if [ "$cell_accepted" != true ]; then
                all_slots_accepted=false
              fi
              planned_slots=$((planned_slots + 1))
            done < <(jq -rc '.cells[] | @base64' "$input/plan.json")
          done
          repetitions="$(jq -r '.repetitions' "$input/plan.json")"
          cells_per_repetition="$(jq '.cells | length' "$input/plan.json")"
          expected_slots=$((repetitions * cells_per_repetition))
          per_repetition_dispatches="$(jq '[.cells[] | .scanner_dispatches] | add' "$input/plan.json")"
          per_repetition_unsupported="$(jq '[.cells[] | select(.expected_state == "unsupported" and .scanner_dispatches == 0)] | length' "$input/plan.json")"
          expected_dispatches=$((repetitions * per_repetition_dispatches))
          expected_unsupported=$((repetitions * per_repetition_unsupported))
          test "$planned_slots" = "$expected_slots"
          test "$expected_slots" = 16
          jq --arg status "retained_failure" --argjson planned_slots "$planned_slots" --argjson accepted_slots "$accepted_slots" --argjson retained_failed_attempts "$retained_failed_attempts" '.status = $status | .phase = "capture_complete" | .planned_slots = $planned_slots | .accepted_slots = $accepted_slots | .retained_failed_attempts = $retained_failed_attempts' "$status" > "$status.next"
          mv "$status.next" "$status"
          if [ "$all_slots_accepted" = true ]; then
            test "$accepted_slots" = "$expected_slots"
            test "$accepted_slots" = 16
            actual_dispatches="$(jq -s '[.[] | select(.outcome == "accepted" and .observation_state == "complete") | .scanner_dispatches] | add' "$output"/records/*.json)"
            actual_unsupported="$(jq -s '[.[] | select(.outcome == "accepted" and .observation_state == "unsupported" and .scanner_dispatches == 0)] | length' "$output"/records/*.json)"
            test "$actual_dispatches" = "$expected_dispatches"
            test "$actual_unsupported" = "$expected_unsupported"
            test "$expected_dispatches" = 14
            test "$expected_unsupported" = 2
            test "$(jq '.bundles | length' "$accepted_bundles")" = 16
            jq '.status = "accepted"' "$status" > "$status.next"
            mv "$status.next" "$status"
            go run ./cmd/synapse-sca-cycle -mode ledger -plan "$input/plan.json" -ledger-output "$output/control/cycle-ledger.json" "${records[@]}"
            echo "accepted=true" >> "$GITHUB_OUTPUT"
          else
            echo "accepted=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload audited capture controls before verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: engine-accuracy-attempt-controls-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.changes.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/sca-accuracy-candidate/control
            ${{ runner.temp }}/sca-accuracy-candidate/records
            ${{ runner.temp }}/sca-accuracy-candidate/capture-status.json
          if-no-files-found: error
          retention-days: 3
      - name: Finalize comparisons, falsifiers, reduction, ratchet, and report
        if: ${{ steps.capture.outputs.accepted == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          input="$SCA_ACCURACY_TRUSTED_INPUT_ROOT"
          output="$RUNNER_TEMP/sca-accuracy-candidate"
          accepted_bundles="$output/control/accepted-bundles.json"
          test "$(jq '.bundles | length' "$accepted_bundles")" = 16
          comparison_pairs=()
          observations=()
          for repetition in 1 2; do
            while IFS= read -r encoded; do
              cell="$(printf '%s' "$encoded" | base64 --decode)"
              target="$(jq -r '.target_id' <<<"$cell")"
              engine="$(jq -r '.engine' <<<"$cell")"
              attempt="$(jq -er --argjson repetition "$repetition" --arg target "$target" --arg engine "$engine" '[.bundles[] | select(.repetition == $repetition and .target_id == $target and .engine == $engine)] | if length == 1 then .[0].attempt else error("missing or ambiguous accepted bundle") end' "$accepted_bundles")"
              case "$attempt" in 1|2|3) ;; *) echo "accepted bundle attempt is out of bounds" >&2; exit 1 ;; esac
              bundle="$SCA_ACCURACY_RAW_RETENTION_ROOT/${GITHUB_RUN_ID:-local}/${GITHUB_RUN_ATTEMPT:-1}/$repetition/$target--$engine/attempt-$attempt"
              test -s "$bundle/observation.json"
              observations+=("$bundle/observation.json")
              if [ "$repetition" = 1 ]; then
                second_attempt="$(jq -er --arg target "$target" --arg engine "$engine" '[.bundles[] | select(.repetition == 2 and .target_id == $target and .engine == $engine)] | if length == 1 then .[0].attempt else error("missing or ambiguous accepted bundle") end' "$accepted_bundles")"
                case "$second_attempt" in 1|2|3) ;; *) echo "accepted comparison bundle attempt is out of bounds" >&2; exit 1 ;; esac
                second_bundle="$SCA_ACCURACY_RAW_RETENTION_ROOT/${GITHUB_RUN_ID:-local}/${GITHUB_RUN_ATTEMPT:-1}/2/$target--$engine/attempt-$second_attempt"
                test -s "$second_bundle/observation.json"
                comparison_pairs+=("$engine,$bundle,$second_bundle")
              fi
            done < <(jq -rc '.cells[] | @base64' "$input/plan.json")
          done
          test "${#observations[@]}" = 16
          test "${#comparison_pairs[@]}" = 8
          make sca-accuracy-finalize SCA_ACCURACY_PLAN="$input/plan.json" SCA_ACCURACY_LEDGER="$output/control/cycle-ledger.json" SCA_ACCURACY_CATALOG="$input/catalog.json" SCA_ACCURACY_ORACLE="$input/oracle.json" SCA_ACCURACY_RATCHET="$input/ratchet.json" SCA_ACCURACY_RESULT_OUTPUT="$output/result.json" SCA_ACCURACY_REPORT_OUTPUT="$output/report.md" SCA_ACCURACY_COMPARISON_OUTPUT="$output/comparisons.json" SCA_ACCURACY_FALSIFIER_OUTPUT="$output/falsifiers.json" SCA_ACCURACY_FALSIFIER_SPEC="$input/falsifier-spec.json" SCA_ACCURACY_OBSERVATIONS="${observations[*]}" SCA_ACCURACY_COMPARISON_PAIRS="${comparison_pairs[*]}"
          test -s "$output/result.json"
          test -s "$output/report.md"
          test -s "$output/comparisons.json"
          test -s "$output/falsifiers.json"
      - name: Bind actual final artifacts into publication evidence
        if: ${{ steps.capture.outputs.accepted == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          input="$SCA_ACCURACY_TRUSTED_INPUT_ROOT"
          output="$RUNNER_TEMP/sca-accuracy-candidate"
          make sca-accuracy-publication SCA_ACCURACY_PLAN="$input/plan.json" SCA_ACCURACY_LEDGER="$output/control/cycle-ledger.json" SCA_ACCURACY_PUBLICATION_CONTROL="$input/publication-control.json" SCA_ACCURACY_PUBLICATION_OUTPUT="$output/control/publication-manifest.json" SCA_ACCURACY_ACCOUNTABLE_REVIEW="$input/accountable-review.json" SCA_ACCURACY_SOURCE_CASE_EVIDENCE="$output/control/source-case-evidence.json" SCA_ACCURACY_NATIVE_EVIDENCE="$output/control/native-evidence.json" SCA_ACCURACY_ORACLE_CANDIDATE="$output/control/oracle-candidate.json" SCA_ACCURACY_CROSS_CHECK="$output/control/cross-check.json" SCA_ACCURACY_ADJUDICATION="$output/control/adjudication.json" SCA_ACCURACY_FINAL_ORACLE_FREEZE="$output/control/final-oracle-freeze.json" SCA_ACCURACY_RATCHET="$input/ratchet.json" SCA_ACCURACY_COMPARISON_OUTPUT="$output/comparisons.json" SCA_ACCURACY_FALSIFIER_OUTPUT="$output/falsifiers.json" SCA_ACCURACY_RESULT_OUTPUT="$output/result.json" SCA_ACCURACY_REPORT_OUTPUT="$output/report.md" SCA_ACCURACY_EVIDENCE_SUMMARY_OUTPUT="$output/candidate-evidence-summary.json"
          test -s "$output/control/publication-manifest.json"
          test -s "$output/candidate-evidence-summary.json"
      - name: Write capability and status evidence
        if: ${{ steps.capture.outputs.accepted == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/sca-accuracy-candidate"
          jq -n --arg implementation_commit "${{ needs.changes.outputs.source_sha }}" --arg plan "$(sha256sum "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/plan.json" | cut -d' ' -f1)" '{schema_version:"synapse-sca-benchmark-cycle-status-v1", implementation_commit:$implementation_commit, planned_slots:16, scanner_dispatches:14, unsupported_records:2, plan_sha256:$plan, sandbox:{linux:true,bubblewrap:true,seccomp:true,cgroup_v2:true}, status:"complete"}' > "$output/capability-status.json"
          cp "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/source-freeze.json" "$output/control/source-freeze.json"
          cp "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/source-evidence-plan.json" "$output/control/source-evidence-plan.json"
          cp "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/accountable-review.json" "$output/control/accountable-review.json"
          cp "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/oracle.json" "$output/control/oracle.json"
          cp "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/catalog.json" "$output/control/catalog.json"
          cp "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/ratchet.json" "$output/control/ratchet.json"
          cp "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/falsifier-spec.json" "$output/control/falsifier-spec.json"
          cp "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/publication-control.json" "$output/control/publication-control.json"
          cp "$SCA_ACCURACY_TRUSTED_INPUT_ROOT/plan.json" "$output/control/plan.json"
          printf '## Trusted SCA accuracy cycle\n\n- 16 retained slots: 14 dispatched scans and 2 designated SLES/OSV unsupported records.\n- Scanner-free source/native evidence, candidate, cross-check, adjudication, accountable review, final oracle freeze, ledger, comparison, falsifier, result, report, and summary were produced.\n- Raw bundles remain only in the protected retention root and are not uploaded.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Assert complete candidate artifact set
        if: ${{ steps.capture.outputs.accepted == 'true' }}
        id: complete
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/sca-accuracy-candidate"
          for required in capability-status.json capture-status.json candidate-evidence-summary.json comparisons.json falsifiers.json result.json report.md control/source-freeze.json control/source-evidence-plan.json control/source-case-evidence.json control/native-evidence.json control/accountable-review.json control/oracle.json control/catalog.json control/ratchet.json control/falsifier-spec.json control/publication-control.json control/plan.json control/oracle-candidate.json control/cross-check.json control/adjudication.json control/final-oracle-freeze.json control/cycle-ledger.json control/publication-manifest.json; do
            test -s "$output/$required"
          done
          echo "artifacts=produced" >> "$GITHUB_OUTPUT"
      - name: Upload bounded candidate controls and results
        if: ${{ steps.capture.outputs.accepted == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: engine-accuracy-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.changes.outputs.source_sha }}
          path: ${{ runner.temp }}/sca-accuracy-candidate
          if-no-files-found: error
          retention-days: 3
      - name: Fail after audited retained-attempt upload
        if: ${{ always() && steps.capture.outputs.accepted != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.capture.outputs.accepted }}" = true

  aggregate:
    name: Aggregate evidence-cycle status
    needs: [changes, smoke, offline-verify, trusted-full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable outcome and full artifact production
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          TRUSTED_ENABLED: ${{ vars.ENGINE_ACCURACY_TRUSTED_ENABLED }}
          TRUSTED_REQUESTED: ${{ needs.changes.outputs.trusted_requested }}
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }} smoke=${{ needs.smoke.result }} offline=${{ needs.offline-verify.result }} full=${{ needs.trusted-full.result }} artifacts=${{ needs.trusted-full.outputs.artifacts }}"
          test "${{ needs.changes.result }}" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "${{ needs.smoke.result }}" = success
            test "${{ needs.offline-verify.result }}" = success
            test "${{ needs.trusted-full.result }}" = skipped
          elif [ "${{ needs.changes.outputs.evidence_only }}" = true ]; then
            test "${{ needs.offline-verify.result }}" = success
            test "${{ needs.trusted-full.result }}" = skipped
          elif [ "$TRUSTED_REQUESTED" != true ]; then
            # A disabled runner or a non-authorized branch is an explicit
            # non-evaluation mode, never a substitute for fresh evidence.
            test "${{ needs.trusted-full.result }}" = skipped
            if [ "$TRUSTED_ENABLED" = true ]; then
              echo "trusted evidence cycle not requested for non-authorized ref $WORKFLOW_REF"
            else
              echo "trusted evidence cycle disabled by ENGINE_ACCURACY_TRUSTED_ENABLED"
            fi
          else
            test "${{ needs.trusted-full.result }}" = success
            test "${{ needs.trusted-full.outputs.artifacts }}" = produced
            test "${{ needs.offline-verify.result }}" = skipped
          fi
