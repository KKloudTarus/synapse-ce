name: Patch 630 lint baselines

on:
  push:
    branches:
      - feat/630-rulepack-lifecycle
    paths:
      - .github/workflows/patch-630.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/630-rulepack-lifecycle
          fetch-depth: 0

      - name: Apply exact lint fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "internal/infrastructure/spool/spool.go",
              "\tdefer f.Close()\n\tframe := make([]byte, ref.length)",
              "\tdefer func() { _ = f.Close() }()\n\tframe := make([]byte, ref.length)",
          )

          replace_once(
              "internal/usecase/sca/service.go",
              "\tgo s.runScanJob(shared.WithTenant(context.Background(), tenantID), actor, engagementID, now, req, opts, job)\n",
              "\tgo func() {\n\t\t_ = s.runScanJob(shared.WithTenant(context.Background(), tenantID), actor, engagementID, now, req, opts, job)\n\t}()\n",
          )

      - name: Commit fixes and remove patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-630.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/infrastructure/spool/spool.go internal/usecase/sca/service.go
          git commit -m "fix(ci): clear remaining baseline lint failures"
          git push origin HEAD:feat/630-rulepack-lifecycle
