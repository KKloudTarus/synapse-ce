name: Marketplace action smoke

# Proves the published Marketplace listing's own snippet works end to end, by both references a user can copy:
# the release tag the listing shows, and the major tag the README and docs show. Each downloads the
# checksum-verified binary, gates on real findings and writes SARIF. Runs on this branch only.
on:
  push:
    branches:
      - test/marketplace-action

permissions:
  contents: read

jobs:
  smoke:
    name: scan this repository with the released action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Exactly the snippet the Marketplace listing hands a new user, pinned to the released tag, and left on
      # the default version input: resolving "latest" is the path that failed with curl exit 23 on v0.2.0.
      - name: Synapse SCA scan (release tag)
        uses: KKloudTarus/synapse-ce@v0.2.1
        with:
          path: deploy
          fail-on: critical
          sarif: "true"

      # The reference the README and docs tell people to write. It resolved to nothing until the release
      # workflow started maintaining the major tag.
      - name: Synapse SCA scan (documented major tag)
        uses: KKloudTarus/synapse-ce@v1
        with:
          path: api
          fail-on: critical
          sarif: "true"
          sarif-output: synapse-v1.sarif

      - name: Show the SARIF the action produced
        if: always()
        run: |
          set -euo pipefail
          test -s synapse.sarif
          test -s synapse-v1.sarif
          python3 - <<'PY'
          import json
          for name in ("synapse.sarif", "synapse-v1.sarif"):
              d = json.load(open(name))
              run = d["runs"][0]
              driver = run["tool"]["driver"]
              print(f"{name}: sarif {d.get('version')} tool {driver['name']} {driver.get('version', '-')} "
                    f"rules {len(driver.get('rules', []))} results {len(run.get('results', []))}")
          PY
