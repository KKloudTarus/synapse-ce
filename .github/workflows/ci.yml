name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{ github.run_id }}
      POSTGRES_DB: synapse
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synapse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure Postgres integration database
        run: echo "SYNAPSE_TEST_DB_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}?sslmode=disable" >> "$GITHUB_ENV"

      - name: Require Postgres integration database
        run: |
          if [ -z "${SYNAPSE_TEST_DB_DSN:-}" ]; then
            echo "SYNAPSE_TEST_DB_DSN is required in CI; refusing to silently skip Postgres integration tests"
            exit 1
          fi

      - name: Check AWS staging security and data-governance invariants
        run: bash deploy/aws/staging/tests/static.sh

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # Postgres integration packages share the configured database and reset schemas in
        # their fixtures. Serialize packages so one fixture cannot invalidate another mid-test.
        run: go test -p 1 -count=1 ./...

      - name: Test Postgres suite again on the same database
        run: go test -count=1 ./internal/infrastructure/persistence/postgres

      - name: Build (CGO disabled – distroless parity)
        run: CGO_ENABLED=0 go build ./cmd/...

  backend-windows:
    name: Backend (Go, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # golang/go#81238: on go1.27.0 windows/amd64, exception recovery can write below a goroutine
      # stack and corrupt the Go heap. It fires on part of the GitHub-hosted Windows pool and has
      # taken five of the last twelve runs on main with it, always as a corrupted process rather
      # than a failed assertion: an access violation at an unknown pc, "found pointer to free
      # object", or a panic value that has been overwritten. A process whose heap is corrupt cannot
      # report a trustworthy result either way, so that shape of failure is measured again. A
      # failure with no crash signature is a real failure and stays red on the first run.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          first="$RUNNER_TEMP/go-test-1.log"
          if go test -p 1 -count=1 ./... 2>&1 | tee "$first"; then
            exit 0
          fi
          if ! grep -qE 'fatal error:|Exception 0x[0-9a-f]|unexpected fault address|panic called with nil argument' "$first"; then
            echo "::error::the Windows suite failed without a runtime crash signature; not retried"
            exit 1
          fi
          echo "::warning::runtime heap corruption (golang/go#81238); measuring the suite again"
          go test -p 1 -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/go-test-2.log"

  frontend:
    name: Frontend (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # vite 8 requires ^20.19 || >=22.12, and vitest's forks pool needs
          # worker_threads.markAsUncloneable. Node 20 resolved to a build without it, so every web test
          # failed to start its worker — a red suite that said nothing about the code. Pinned to the
          # 22 LTS line, which satisfies both, and recorded in web/package.json engines so the
          # requirement lives with the package rather than only in this file.
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 9

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm build
