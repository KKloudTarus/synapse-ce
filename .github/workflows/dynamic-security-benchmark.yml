name: Dynamic security benchmark

# Owned-engine accuracy for the dynamic dimensions: passive DAST evaluation and CSPM posture evaluation.
#
# Both corpora are local labeled fixtures: the DAST corpus is a set of recorded observations (headers,
# cookies, artifact paths, body markers) and the CSPM corpus is a fixture inventory of normalized provider
# resources. Nothing here reaches a live target or a cloud account, so the workflow is PR-safe and cannot
# mutate anything. A CSPM resource whose state is unknown stays NotAssessed and produces no finding, so
# inaccessible evidence is never scored as compliant.
#
# An authorized live evaluation (a real DAST target or a cloud read) is deliberately NOT run here. Per the
# benchmark lifecycle contract it would need a trusted ref, a protected environment, short-lived identity,
# and rate bounds, so it belongs in a separately authorized lane rather than on a PR-safe workflow.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-security-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Bind benchmark source revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source revision is not a full lower-case SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  accuracy:
    name: Owned dynamic accuracy
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.route.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact checkout revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.route.outputs.source_sha }}"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Passive DAST accuracy over the labeled observation corpus
        shell: bash
        run: bash scripts/require-go-tests.sh TestDASTOwnedAccuracy "$RUNNER_TEMP/dast-accuracy.jsonl" pass ./internal/infrastructure/dastchecks/ -run '^TestDASTOwnedAccuracy$'
      - name: CSPM posture accuracy over the fixture inventory
        shell: bash
        run: bash scripts/require-go-tests.sh TestCSPMOwnedAccuracy "$RUNNER_TEMP/cspm-accuracy.jsonl" pass ./internal/domain/cloudposture/ -run '^TestCSPMOwnedAccuracy$'

  aggregate:
    name: Aggregate dynamic benchmark status
    needs: [route, accuracy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          ROUTE: ${{ needs.route.result }}
          ACCURACY: ${{ needs.accuracy.result }}
        run: |
          set -euo pipefail
          test "$ROUTE" = success
          test "$ACCURACY" = success
