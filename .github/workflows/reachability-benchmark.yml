name: Reachability benchmark

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reachability-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Authorize trusted benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      trusted: ${{ steps.trust.outputs.trusted }}
      route: ${{ steps.trust.outputs.route }}
    steps:
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source revision is not a full lower-case SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - id: trust
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ steps.source.outputs.sha }}
          ENABLED: ${{ vars.REACHABILITY_BENCHMARK_TRUSTED_ENABLED }}
          TRUSTED_REF: ${{ vars.REACHABILITY_BENCHMARK_TRUSTED_REF }}
          TRUSTED_SHA: ${{ vars.REACHABILITY_BENCHMARK_TRUSTED_SHA }}
          BASELINE_HARNESS_SHA: ${{ vars.REACHABILITY_BENCHMARK_BASELINE_HARNESS_SHA }}
        run: |
          set -euo pipefail
          if [ -n "$TRUSTED_SHA" ] && [[ ! "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "configured trusted revision is not a full lower-case SHA" >&2
            exit 1
          fi
          if [ -n "$BASELINE_HARNESS_SHA" ] && [[ ! "$BASELINE_HARNESS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "configured baseline harness revision is not a full lower-case SHA" >&2
            exit 1
          fi
          route=candidate
          if [ -n "$BASELINE_HARNESS_SHA" ] && [ "$SHA" = "$BASELINE_HARNESS_SHA" ]; then
            route=baseline
          fi
          trusted=false
          if [ "$EVENT_NAME" != pull_request ] && [ "$ENABLED" = true ] && [ -n "$TRUSTED_REF" ] && [ -n "$TRUSTED_SHA" ] && [ "$REF" = "$TRUSTED_REF" ] && [ "$SHA" = "$TRUSTED_SHA" ]; then
            trusted=true
          fi
          echo "route=$route" >> "$GITHUB_OUTPUT"
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

  benchmark:
    name: Trusted fixed benchmark
    needs: route
    if: ${{ needs.route.outputs.trusted == 'true' }}
    runs-on: [self-hosted, linux, reachability-accuracy-trusted]
    timeout-minutes: 90
    env:
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_COUNT: "0"
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Prepare fresh trusted checkout
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:-}"
          runner_temp="${RUNNER_TEMP:-}"
          if [ -z "$workspace" ] || [ -z "$runner_temp" ] || [ "${workspace#/}" = "$workspace" ] || [ "${runner_temp#/}" = "$runner_temp" ] || [ "$workspace" = / ] || [ "$runner_temp" = / ]; then
            echo "checkout and runner temporary paths must be non-root absolute paths" >&2
            exit 1
          fi
          case "$workspace$runner_temp" in
            *$'\n'*|*$'\r'*)
              echo "checkout and runner temporary paths must not contain line breaks" >&2
              exit 1
              ;;
          esac
          test -d "$runner_temp"
          test ! -L "$runner_temp"
          cd "$RUNNER_TEMP"
          runner_temp="$(pwd -P)"
          if [ "$runner_temp" != "$RUNNER_TEMP" ]; then
            echo "runner temporary path must be canonical" >&2
            exit 1
          fi
          workspace_canonical="$(realpath -m -- "$workspace")"
          if [ "$workspace_canonical" != "$workspace" ] || [ "$workspace_canonical" = / ]; then
            echo "checkout path must be canonical, absolute, and non-root" >&2
            exit 1
          fi
          workspace="$workspace_canonical"
          case "$workspace" in
            "$runner_temp"|"$runner_temp"/*)
              echo "checkout path must remain outside runner temporary storage" >&2
              exit 1
              ;;
          esac
          case "$runner_temp" in
            "$workspace"|"$workspace"/*)
              echo "runner temporary path must remain outside the checkout" >&2
              exit 1
              ;;
          esac
          workspace_parent="$(dirname -- "$workspace")"
          test -d "$workspace_parent"
          test ! -L "$workspace_parent"
          test "$GIT_CONFIG_NOSYSTEM" = 1
          test "$GIT_CONFIG_COUNT" = 0
          git_config="$runner_temp/synapse-reachability-gitconfig"
          for name in "${!GIT_CONFIG_@}"; do
            case "$name" in
              GIT_CONFIG_NOSYSTEM|GIT_CONFIG_COUNT) ;;
              *) unset "$name" ;;
            esac
          done
          rm -f -- "$git_config"
          install -m 0600 /dev/null "$git_config"
          test -f "$git_config"
          test ! -L "$git_config"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$git_config" >> "$GITHUB_ENV"
          rm -rf -- "$workspace"
          install -d -m 0700 -- "$workspace"
          test -d "$workspace"
          test ! -L "$workspace"
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.route.outputs.source_sha }}
          persist-credentials: false
          clean: true
          set-safe-directory: false
          fetch-depth: 1
      - name: Assert fresh checkout and protected reference head
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.route.outputs.source_sha }}
          TRUSTED_REF: ${{ vars.REACHABILITY_BENCHMARK_TRUSTED_REF }}
          TRUSTED_SHA: ${{ vars.REACHABILITY_BENCHMARK_TRUSTED_SHA }}
        run: |
          set -euo pipefail
          case "$TRUSTED_REF" in
            refs/heads/*) branch="${TRUSTED_REF#refs/heads/}" ;;
            *) echo "trusted ref must name a protected branch" >&2; exit 1 ;;
          esac
          if ! git check-ref-format --branch "$branch" >/dev/null; then
            echo "trusted protected branch is unsafe" >&2
            exit 1
          fi
          workspace="$(pwd -P)"
          git_dir="$(git rev-parse --absolute-git-dir)"
          test "$git_dir" = "$workspace/.git"
          test -d "$git_dir"
          test ! -L "$git_dir"
          test -f "$git_dir/HEAD"
          test ! -e "$git_dir/objects/info/alternates"
          if git for-each-ref --format='%(refname)' refs/replace | grep -q .; then
            echo "checkout contains Git replace refs" >&2
            exit 1
          fi
          if git config --global --list | grep -q .; then
            echo "isolated global Git config is not empty" >&2
            exit 1
          fi
          if git config --local --get-regexp '^(include|includeif\..*)\.path$' >/dev/null; then
            echo "checkout local Git config contains an include" >&2
            exit 1
          fi
          if git config --local --get core.hooksPath >/dev/null; then
            echo "checkout local Git config contains a hooks path" >&2
            exit 1
          fi
          git reset --hard "$SOURCE_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          source_tree="$(git rev-parse "$SOURCE_SHA^{tree}")"
          test "$(git rev-parse HEAD^{tree})" = "$source_tree"
          test "$GITHUB_REF" = "$TRUSTED_REF"
          test "$SOURCE_SHA" = "$TRUSTED_SHA"
          git fetch --no-tags --depth=1 origin "$TRUSTED_REF:refs/remotes/origin/$branch"
          test "$(git rev-parse "refs/remotes/origin/$branch")" = "$SOURCE_SHA"
          if [ -n "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)" ]; then
            echo "trusted checkout contains tracked, untracked, or ignored residue" >&2
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Assert runner and toolchain prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(go env GOOS)" = linux
          test "$(go env GOARCH)" = amd64
          required_go="$(awk '$1 == "go" { print "go" $2; exit }' go.mod)"
          test -n "$required_go"
          test "$(go env GOVERSION)" = "$required_go"
          test "$(dotnet --version)" = 8.0.100
          assert_jdk_21() {
            tool="$1"
            if ! output="$("$tool" -version 2>&1)"; then
              echo "$tool version command failed" >&2
              return 1
            fi
            if ! printf '%s\n' "$output" | grep -Eq '(^|[^[:digit:]])21\.0\.5([^[:digit:]]|$)'; then
              echo "$tool is not version 21.0.5" >&2
              return 1
            fi
          }
          assert_jdk_21 java
          assert_jdk_21 javac
          assert_jdk_21 jar
      - name: Stage controller-owned input
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.route.outputs.source_sha }}
          ROUTE: ${{ needs.route.outputs.route }}
          CONTROLLER_SOURCE_ROOT: ${{ vars.REACHABILITY_BENCHMARK_CONTROLLER_ROOT }}
        run: |
          set -euo pipefail
          test -n "$CONTROLLER_SOURCE_ROOT"
          test -d "$CONTROLLER_SOURCE_ROOT"
          test ! -L "$CONTROLLER_SOURCE_ROOT"
          controller_root="$(realpath -e -- "$CONTROLLER_SOURCE_ROOT")"
          workspace_root="$(realpath -e -- "$GITHUB_WORKSPACE")"
          case "$controller_root" in
            "$workspace_root"|"$workspace_root"/*)
              echo "controller source root must remain outside the checkout" >&2
              exit 1
              ;;
          esac
          case "$ROUTE" in
            baseline|candidate) envelope_name="${ROUTE}-${SOURCE_SHA}.json" ;;
            *) echo "unknown closed route" >&2; exit 1 ;;
          esac
          bundle_source="$controller_root/trusted-bundle"
          envelope_root="$controller_root/envelopes"
          envelope_source="$envelope_root/$envelope_name"
          for path in "$bundle_source" "$envelope_root" "$envelope_source"; do
            test -e "$path"
            test ! -L "$path"
          done
          test -d "$bundle_source"
          test -d "$envelope_root"
          test -f "$envelope_source"
          if find -P "$controller_root" -xdev -type l -print -quit | grep -q . || find -P "$controller_root" -xdev ! -type d ! -type f -print -quit | grep -q .; then
            echo "controller source contains a symlink or non-regular entry" >&2
            exit 1
          fi
          stage_root="$RUNNER_TEMP/synapse-reachability-controller"
          if [ -e "$stage_root" ] || [ -L "$stage_root" ]; then
            echo "controller staging root already exists" >&2
            exit 1
          fi
          install -d -m 0700 -- "$stage_root/trusted-bundle" "$stage_root/envelopes"
          while IFS= read -r -d '' source; do
            relative="${source#"$bundle_source"/}"
            install -D -m 0600 -- "$source" "$stage_root/trusted-bundle/$relative"
          done < <(find -P "$bundle_source" -xdev -type f -print0 | sort -z)
          install -m 0600 -- "$envelope_source" "$stage_root/envelopes/$envelope_name"
          test -f "$stage_root/envelopes/$envelope_name"
          test ! -L "$stage_root/envelopes/$envelope_name"
      - name: Build trusted helpers
        shell: bash
        run: |
          set -euo pipefail
          tools_root="$RUNNER_TEMP/synapse-reachability-tools"
          install -d -m 0700 -- "$tools_root"
          if [ -n "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)" ]; then
            echo "trusted checkout contains tracked, untracked, or ignored residue" >&2
            exit 1
          fi
          go build -o "$tools_root/synapse-callgraph" ./cmd/synapse-callgraph
          go build -o "$tools_root/synapse-ast" ./cmd/synapse-ast
          test -x "$tools_root/synapse-callgraph"
          test -x "$tools_root/synapse-ast"
      - name: Run trusted benchmark
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.route.outputs.source_sha }}
          ROUTE: ${{ needs.route.outputs.route }}
          SYNAPSE_JVM_REACH_TIER2_POINTS_TO_ENABLED: "true"
          SYNAPSE_JSREACH_TIER2_ENABLED: "true"
        run: |
          set -euo pipefail
          case "$ROUTE" in
            baseline|candidate) envelope_name="${ROUTE}-${SOURCE_SHA}.json" ;;
            *) echo "unknown closed route" >&2; exit 1 ;;
          esac
          export TMPDIR="$RUNNER_TEMP"
          export SYNAPSE_REACHABILITY_CONTROLLER_ENVELOPE="$RUNNER_TEMP/synapse-reachability-controller/envelopes/$envelope_name"
          export SYNAPSE_TAINT_CALLGRAPH_BIN="$RUNNER_TEMP/synapse-reachability-tools/synapse-callgraph"
          export SYNAPSE_AST_BIN="$RUNNER_TEMP/synapse-reachability-tools/synapse-ast"
          if [ -n "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)" ]; then
            echo "trusted checkout contains tracked, untracked, or ignored residue" >&2
            exit 1
          fi
          make reachability-benchmark
      - name: Upload sanitized result
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reachability-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.route.outputs.source_sha }}
          path: ${{ runner.temp }}/synapse-reachability/published/github-${{ github.run_id }}/attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
      - name: Teardown trusted benchmark workspace
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/synapse-reachability-controller" "$RUNNER_TEMP/synapse-reachability-tools" "$RUNNER_TEMP/synapse-reachability/private" "$RUNNER_TEMP/synapse-reachability/published" "$RUNNER_TEMP/synapse-reachability-gitconfig" "$RUNNER_TEMP/synapse-reachability-prior-checkout"

  aggregate:
    name: Aggregate benchmark status
    needs: [route, benchmark]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          TRUSTED: ${{ needs.route.outputs.trusted }}
          ROUTE: ${{ needs.route.result }}
          BENCHMARK: ${{ needs.benchmark.result }}
          ARTIFACT: ${{ needs.benchmark.outputs.artifact }}
        run: |
          set -euo pipefail
          test "$ROUTE" = success
          if [ "$TRUSTED" = true ]; then
            test "$BENCHMARK" = success
            test -n "$ARTIFACT"
          else
            test "$BENCHMARK" = skipped
          fi
