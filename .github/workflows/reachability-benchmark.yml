name: Reachability benchmark

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "29 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reachability-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Bind source revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  lifecycle:
    name: Hosted reachability lifecycle
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.route.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-sdk-8.0.100
        with:
          dotnet-version: "8.0.100"
      - name: Set up exact JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21.0.5"
      - name: Assert pinned lifecycle toolchains
        shell: bash
        run: |
          set -euo pipefail
          test "$DOTNET_ROOT" = "$RUNNER_TEMP/dotnet-sdk-8.0.100"
          test "$(dotnet --version)" = "8.0.100"
          assert_jdk_21() {
            tool="$1"
            version_arg=-version
            if [ "$tool" = jar ]; then
              version_arg=--version
            fi
            if ! output="$("$tool" "$version_arg" 2>&1)"; then
              echo "$tool version command failed" >&2
              return 1
            fi
            if ! printf '%s\n' "$output" | grep -Eq '(^|[^[:digit:]])21\.0\.5([^[:digit:]]|$)'; then
              echo "$tool is not version 21.0.5" >&2
              return 1
            fi
          }
          assert_jdk_21 java
          assert_jdk_21 javac
          assert_jdk_21 jar
      - name: Run current candidate lifecycle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.route.outputs.source_sha }}"
          export TMPDIR="$RUNNER_TEMP"
          make reachability-benchmark
      - name: Upload SHA-bound lifecycle evidence
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reachability-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.route.outputs.source_sha }}
          path: ${{ runner.temp }}/synapse-reachability/published/github-${{ github.run_id }}/attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  go-oss-baselines:
    name: Go corpus vs frozen OSV and pinned Semgrep CE
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEMGREP_IMAGE: semgrep/semgrep@sha256:d39aa8d8cdb7fd9e5ec14f0825e2356f902129778c9617217856295e553254d5
      REACHBENCH_DIR: internal/infrastructure/tools/ssacallgraph/testdata/reachbench
      REACHBENCH_REPORT_DIR: ${{ github.workspace }}/reachbench-scorecards/go
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.route.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Replay frozen OSV-Scanner Go call analysis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REACHBENCH_REPORT_DIR"
          expected="$(jq -r '.capture_file_sha256' internal/usecase/reachbench/corpus/baselines/osv-go.provenance.json)"
          actual="sha256:$(sha256sum internal/usecase/reachbench/corpus/baselines/osv-go.raw.json | cut -d ' ' -f 1)"
          test "$actual" = "$expected"
          go run ./cmd/synapse-bench -mode reachability-osv -language go \
            -input internal/usecase/reachbench/corpus/baselines/osv-go.raw.json \
            -output "$REACHBENCH_REPORT_DIR/osv-scanner.json"
          test -s "$REACHBENCH_REPORT_DIR/osv-scanner.json"
      - name: Run Semgrep CE direct-call baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e SEMGREP_ENABLE_VERSION_CHECK=0 -e EIO_BACKEND=posix \
            -v "$GITHUB_WORKSPACE:/src:ro" -w /src --entrypoint semgrep "$SEMGREP_IMAGE" \
            scan --oss-only --metrics off --jobs 1 --config internal/usecase/reachbench/corpus/semgrep-ce.yml --json --no-git-ignore "$REACHBENCH_DIR"/*/main.go > "$RUNNER_TEMP/semgrep-go.raw.json"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            exit "$status"
          fi
          jq -e '(.errors | type) == "array" and (.errors | length) == 0 and (.results | type) == "array" and (.results | length) > 0' "$RUNNER_TEMP/semgrep-go.raw.json" > /dev/null
          go run ./cmd/synapse-bench -mode reachability-semgrep-ce -language go -input "$RUNNER_TEMP/semgrep-go.raw.json" -output "$REACHBENCH_REPORT_DIR/semgrep-ce.json"
      - name: Gate owned engine recall and parity
        env:
          SYNAPSE_REACHBENCH_OWNED_REPORT: ${{ github.workspace }}/reachbench-scorecards/go/synapse-owned.json
          SYNAPSE_REACHBENCH_BASELINE_REPORTS: osv-scanner=${{ github.workspace }}/reachbench-scorecards/go/osv-scanner.json,semgrep-ce=${{ github.workspace }}/reachbench-scorecards/go/semgrep-ce.json
        run: bash scripts/require-go-tests.sh TestGoReachabilityCorpus "$REACHBENCH_REPORT_DIR/owned-test.jsonl" pass ./internal/infrastructure/tools/ssacallgraph -run '^TestGoReachabilityCorpus$'
      - name: Upload Go scorecards
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reachability-go-scorecards-${{ needs.route.outputs.source_sha }}
          path: ${{ github.workspace }}/reachbench-scorecards/go
          if-no-files-found: error
          retention-days: 14

  python-oss-baselines:
    name: Python corpus vs Semgrep CE
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEMGREP_IMAGE: semgrep/semgrep@sha256:d39aa8d8cdb7fd9e5ec14f0825e2356f902129778c9617217856295e553254d5
      REACHBENCH_DIR: internal/infrastructure/tools/astwalk/testdata/reachbench
      REACHBENCH_REPORT_DIR: ${{ github.workspace }}/reachbench-scorecards/python
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.route.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Semgrep CE Python direct-sink baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REACHBENCH_REPORT_DIR"
          set +e
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e SEMGREP_ENABLE_VERSION_CHECK=0 -e EIO_BACKEND=posix \
            -v "$GITHUB_WORKSPACE:/src:ro" -w /src --entrypoint semgrep "$SEMGREP_IMAGE" \
            scan --oss-only --metrics off --jobs 1 --config internal/usecase/reachbench/corpus/semgrep-ce.yml --json --no-git-ignore "$REACHBENCH_DIR"/py_*/*.py > "$RUNNER_TEMP/semgrep-python.raw.json"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            exit "$status"
          fi
          jq -e '(.errors | type) == "array" and (.errors | length) == 0 and (.results | type) == "array" and (.results | length) > 0' "$RUNNER_TEMP/semgrep-python.raw.json" > /dev/null
          go run ./cmd/synapse-bench -mode reachability-semgrep-ce -language python -input "$RUNNER_TEMP/semgrep-python.raw.json" -output "$REACHBENCH_REPORT_DIR/semgrep-ce.py.json"
      - name: Gate owned Python engine recall and parity
        env:
          CGO_ENABLED: '1'
          SYNAPSE_REACHBENCH_OWNED_REPORT: ${{ github.workspace }}/reachbench-scorecards/python/synapse-owned.py.json
          SYNAPSE_REACHBENCH_BASELINE_REPORTS: semgrep-ce=${{ github.workspace }}/reachbench-scorecards/python/semgrep-ce.py.json
        run: bash scripts/require-go-tests.sh TestPythonReachabilityCorpus "$REACHBENCH_REPORT_DIR/owned-test.jsonl" pass ./internal/infrastructure/tools/astwalk -run '^TestPythonReachabilityCorpus$'
      - name: Upload Python scorecards
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reachability-python-scorecards-${{ needs.route.outputs.source_sha }}
          path: ${{ github.workspace }}/reachbench-scorecards/python
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Aggregate reachability benchmark status
    needs: [route, lifecycle, go-oss-baselines, python-oss-baselines]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all hosted measurements and artifacts
        shell: bash
        env:
          ROUTE: ${{ needs.route.result }}
          LIFECYCLE: ${{ needs.lifecycle.result }}
          LIFECYCLE_ARTIFACT: ${{ needs.lifecycle.outputs.artifact }}
          GO_BASELINE: ${{ needs.go-oss-baselines.result }}
          GO_ARTIFACT: ${{ needs.go-oss-baselines.outputs.artifact }}
          PYTHON_BASELINE: ${{ needs.python-oss-baselines.result }}
          PYTHON_ARTIFACT: ${{ needs.python-oss-baselines.outputs.artifact }}
        run: |
          set -euo pipefail
          test "$ROUTE" = success
          test "$LIFECYCLE" = success
          test -n "$LIFECYCLE_ARTIFACT"
          test "$GO_BASELINE" = success
          test -n "$GO_ARTIFACT"
          test "$PYTHON_BASELINE" = success
          test -n "$PYTHON_ARTIFACT"
