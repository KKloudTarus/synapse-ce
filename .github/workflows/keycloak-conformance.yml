name: Keycloak conformance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  conformance:
    name: Protocol and admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test real Keycloak and PostgreSQL admission
        run: make keycloak-integration
