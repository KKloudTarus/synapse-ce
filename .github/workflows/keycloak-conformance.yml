name: Keycloak conformance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  conformance:
    name: Protocol and admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test real Keycloak and PostgreSQL admission
        run: make keycloak-integration
