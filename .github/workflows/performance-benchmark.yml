name: Performance benchmark

# Repeatable throughput, latency, and memory measurement for the owned scan target classes: pinned source,
# pinned SBOM, small image, and large image.
#
# Each gate ratchets on MEDIAN BYTES ALLOCATED against its committed baseline under docs/benchmarks/, with a
# documented tolerance. Allocation is deterministic for a given Go toolchain and input, so it is a stable
# regression signal on a shared runner. Wall-clock latency (p50/p95) and peak memory are recorded in the
# baseline and compared only within the same environment digest, so this workflow never claims cross-hardware
# comparability. A missing or malformed baseline fails the gate rather than disabling it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "53 4 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Bind benchmark source revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source revision is not a full lower-case SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  measure:
    name: Owned performance gates
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.route.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact checkout revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.route.outputs.source_sha }}"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Image extraction perf gates (small and large target classes)
        shell: bash
        run: bash scripts/require-go-tests.sh TestImageExtractPerfGate,TestImageExtractLargeImagePerfGate "$RUNNER_TEMP/performance-baselines/measurements/image-extraction.jsonl" measurement ./internal/infrastructure/acquire/ -run '^TestImageExtract(PerfGate|LargeImagePerfGate)$'
      - name: Owned SBOM producer perf gate (pinned source class)
        shell: bash
        run: bash scripts/require-go-tests.sh TestOwnsbomPerfGate "$RUNNER_TEMP/performance-baselines/measurements/owned-sbom.jsonl" measurement ./internal/infrastructure/tools/ownsbom/ -run '^TestOwnsbomPerfGate$'
      - name: OS package catalog perf gate
        shell: bash
        run: bash scripts/require-go-tests.sh TestOSPkgCatalogPerfGate "$RUNNER_TEMP/performance-baselines/measurements/os-package-catalog.jsonl" measurement ./internal/infrastructure/tools/ospkg/ -run '^TestOSPkgCatalogPerfGate$'
      - name: SBOM import perf gate (pinned SBOM class)
        shell: bash
        run: bash scripts/require-go-tests.sh TestSBOMImportPerfGate "$RUNNER_TEMP/performance-baselines/measurements/sbom-import.jsonl" measurement ./internal/usecase/sca/ -run '^TestSBOMImportPerfGate$'
      - name: Secret scan perf gate
        shell: bash
        run: bash scripts/require-go-tests.sh TestSecretScanPerfGate "$RUNNER_TEMP/performance-baselines/measurements/secret-scan.jsonl" measurement ./internal/infrastructure/tools/secretscan/ -run '^TestSecretScanPerfGate$'
      - name: Publish committed baselines with measured results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/performance-baselines"
          cp docs/benchmarks/*perf*.json "$RUNNER_TEMP/performance-baselines/"
          printf '%s\n' '${{ needs.route.outputs.source_sha }}' > "$RUNNER_TEMP/performance-baselines/source-sha.txt"
          test "$(find "$RUNNER_TEMP/performance-baselines/measurements" -name '*.jsonl' -type f | wc -l)" -eq 5
          ls -1 "$RUNNER_TEMP/performance-baselines"
      - name: Upload performance baselines
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-baselines-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.route.outputs.source_sha }}
          path: ${{ runner.temp }}/performance-baselines
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate performance status
    needs: [route, measure]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          ROUTE: ${{ needs.route.result }}
          MEASURE: ${{ needs.measure.result }}
          ARTIFACT: ${{ needs.measure.outputs.artifact }}
        run: |
          set -euo pipefail
          test "$ROUTE" = success
          test "$MEASURE" = success
          test -n "$ARTIFACT"
