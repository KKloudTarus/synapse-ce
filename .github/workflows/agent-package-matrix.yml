name: Agent Package Matrix

# #412 test requirement 1: a CI matrix job per supported platform that INSTALLS the native package,
# STARTS the service, proves ONE successful HEARTBEAT, and UNINSTALLS cleanly.
#
# The heartbeat is against a REAL control plane, not a stub. `synapse-api` with no SYNAPSE_DB_DSN runs
# on in-memory stores, so the job exercises the actual enrol -> heartbeat path including certificate
# issue and the version-skew fields. A stub would have proved that the stub answers, which is not the
# failure mode this requirement exists to catch: the field failure was a package that installed
# cleanly and then crash-looped at first start.
#
# Every row of the support matrix in docs/guide/fleet-agent-packaging.md needs a row here. A platform
# with no row is not supported, and saying so is the point.

on:
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "cmd/synapse-agent/**"
      - "cmd/synapse-api/**"
      - "internal/infrastructure/fleet**"
      - "internal/domain/fleet**"
      - ".github/workflows/agent-package-matrix.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "cmd/synapse-agent/**"
      - "cmd/synapse-api/**"
      - "internal/infrastructure/fleet**"
      - "internal/domain/fleet**"
      - ".github/workflows/agent-package-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The libc floor the packages declare and the preinstall script re-checks. RHEL 8 / Debian 10.
  SYNAPSE_LIBC_FLOOR: "2.28"
  SYNAPSE_VERSION: "0.0.0-ci"
  SYNAPSE_ARCH: "amd64"

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deb (Debian 12)
            image: debian:12
            format: deb
            install: dpkg -i
            remove: dpkg --purge synapse-agent
          - name: deb (Ubuntu 22.04)
            image: ubuntu:22.04
            format: deb
            install: dpkg -i
            remove: dpkg --purge synapse-agent
          - name: rpm (Rocky 9 / RHEL 9)
            image: rockylinux:9
            format: rpm
            install: rpm -i
            remove: rpm -e synapse-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the agent and the control plane
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -o dist/synapse-agent ./cmd/synapse-agent
          CGO_ENABLED=0 go build -trimpath -o dist/synapse-api   ./cmd/synapse-api
          test -x dist/synapse-agent
          test -x dist/synapse-api

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build the ${{ matrix.format }} package
        run: |
          set -euo pipefail
          mkdir -p out
          "$(go env GOPATH)/bin/nfpm" package -f packaging/nfpm.yaml -p "${{ matrix.format }}" -t out/
          ls -l out/

      # The control plane runs on the RUNNER (not in the container) so the container can reach it on
      # the docker bridge. No DSN -> in-memory stores; fleet features on; a signer key long enough for
      # worksign.New, which fails startup closed on a short key.
      - name: Start the control plane
        run: |
          set -euo pipefail
          SYNAPSE_FLEET_ENABLED=true \
          SYNAPSE_FLEET_ASSETS_ENABLED=true \
          SYNAPSE_FLEET_HOST_INGEST_ENABLED=true \
          SYNAPSE_FLEET_SIGNER_KEY="ci-fleet-signer-key-that-is-long-enough-32b" \
          SYNAPSE_API_TOKEN="ci-admin-token" \
          SYNAPSE_ENV=dev \
          nohup ./dist/synapse-api >/tmp/control-plane.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "control plane is up"; exit 0
            fi
            sleep 1
          done
          echo "control plane did not become healthy"; cat /tmp/control-plane.log; exit 1

      # ADR-0008: no protected route serves until the acceptable-use policy is accepted. A fresh
      # machine has not accepted it, so the fleet cannot be enrolled without an operator saying so
      # first — the gate is correct, and the job has to pass through it explicitly rather than around
      # it. This is what a real first run looks like.
      - name: Accept the acceptable-use policy
        run: |
          set -euo pipefail
          version="$(curl -fsS http://127.0.0.1:8080/api/v1/aup \
            -H 'Authorization: Bearer ci-admin-token' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          test -n "${version}"
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/aup/accept \
            -H 'Authorization: Bearer ci-admin-token' \
            -H 'Content-Type: application/json' \
            -d "{\"version\":\"${version}\"}" >/dev/null
          echo "accepted acceptable-use policy ${version}"

      - name: Mint an enrolment token
        id: enrol
        run: |
          set -euo pipefail
          # The route takes ttl_seconds and returns the credential once, as "enrolment_token".
          token="$(curl -fsS -X POST http://127.0.0.1:8080/api/v1/agents/enrolment-tokens \
            -H 'Authorization: Bearer ci-admin-token' \
            -H 'Content-Type: application/json' \
            -d '{"ttl_seconds":900}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["enrolment_token"])')"
          test -n "${token}"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      # The container talks to the control plane over the docker bridge gateway. --network=host would
      # hide a whole class of packaging bug (a unit that only works when the network is the runner's).
      - name: Install, start, heartbeat and uninstall inside ${{ matrix.image }}
        env:
          ENROL_TOKEN: ${{ steps.enrol.outputs.token }}
        run: |
          set -euo pipefail
          pkg="$(ls out/*.${{ matrix.format }})"

          # NETWORK CHOICE, stated because it is a real limitation of this test.
          #
          # The agent refuses a cleartext control-plane URL unless the host is loopback — the bearer
          # credential must not traverse plaintext (fleetclient.ValidateControlPlaneURL). That control
          # is correct and the job must not weaken it, so the container shares the runner's network
          # namespace and reaches the control plane at 127.0.0.1, which is the loopback exception the
          # code explicitly sanctions for local testing.
          #
          # The cost: this row does NOT exercise TLS, because synapse-api terminates no TLS in
          # process. What it does exercise is what the requirement asks for — that the PACKAGE
          # installs, that what it shipped runs, enrols and heartbeats, and that removal is clean.
          # TLS belongs to the deployment in front of the control plane and is out of this job's
          # scope; saying so is better than a green tick that implies otherwise.
          #
          # The package is mounted at a FIXED path so the in-container script needs no interpolated
          # basename inside nested quoting.
          docker run --rm \
            --network=host \
            -e SYNAPSE_FLEET_URL="http://127.0.0.1:8080" \
            -e SYNAPSE_FLEET_ENROL_TOKEN="${ENROL_TOKEN}" \
            -e SYNAPSE_LIBC_FLOOR="${SYNAPSE_LIBC_FLOOR}" \
            -e INSTALL_CMD="${{ matrix.install }}" \
            -e REMOVE_CMD="${{ matrix.remove }}" \
            -v "${PWD}/${pkg}:/tmp/synapse-agent-package" \
            -v "${PWD}/.github/scripts/agent-package-smoke.sh:/tmp/smoke.sh:ro" \
            "${{ matrix.image }}" /bin/sh -eu /tmp/smoke.sh

      - name: Control plane log
        if: always()
        run: cat /tmp/control-plane.log || true

  # Requirement 3, Windows: the MSI installs the agent as a real SERVICE, the service starts, the
  # PACKAGED binary completes one enrol + heartbeat, and uninstall removes the service and its files.
  #
  # The service is the part worth testing rather than assuming. A plain binary registered with
  # `sc create` fails to start — "the service did not respond in a timely fashion" — because it never
  # answers the SCM's status protocol, and that failure looks like a broken agent rather than a missing
  # handshake. This row is what proves the handshake works.
  #
  # It does NOT sign the MSI: Authenticode needs a certificate from a CA Windows already trusts, and
  # the release pipeline refuses to publish an unsigned Windows artifact. So this row proves the
  # package installs and runs; publishing it is blocked on a certificate, not on code.
  windows:
    name: msi (Windows Server)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the agent and the control plane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -o dist/synapse-agent.exe ./cmd/synapse-agent
          CGO_ENABLED=0 go build -trimpath -o dist/synapse-api.exe   ./cmd/synapse-api
          test -f dist/synapse-agent.exe
          test -f dist/synapse-api.exe

      - name: Install the WiX toolset
        run: dotnet tool install --global wix --version 5.0.2

      - name: Add the WiX util extension
        run: wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Build the MSI
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # -arch x64 is REQUIRED, not cosmetic: wix defaults to x86, and a 32-bit package puts the
          # amd64 agent under "Program Files (x86)" and its registry key under WOW6432Node -- a 64-bit
          # binary in the 32-bit half of the machine, where nothing looking for it will look.
          wix build packaging/windows/synapse-agent.wxs `
            -arch x64 `
            -ext WixToolset.Util.wixext `
            -d Version=0.0.1 `
            -d BinPath=dist/synapse-agent.exe `
            -o out/synapse-agent.msi
          if (-not (Test-Path out/synapse-agent.msi)) { throw "the MSI was not produced" }

      - name: Start the control plane
        shell: bash
        run: |
          set -euo pipefail
          SYNAPSE_FLEET_ENABLED=true \
          SYNAPSE_FLEET_ASSETS_ENABLED=true \
          SYNAPSE_FLEET_SIGNER_KEY="ci-fleet-signer-key-that-is-long-enough-32b" \
          SYNAPSE_API_TOKEN="ci-admin-token" \
          SYNAPSE_ENV=dev \
          ./dist/synapse-api.exe > control-plane.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "control plane is up"; exit 0
            fi
            sleep 1
          done
          echo "control plane did not become healthy"; cat control-plane.log; exit 1

      - name: Accept the acceptable-use policy and mint an enrolment token
        id: enrol
        shell: bash
        run: |
          set -euo pipefail
          version="$(curl -fsS http://127.0.0.1:8080/api/v1/aup \
            -H 'Authorization: Bearer ci-admin-token' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/aup/accept \
            -H 'Authorization: Bearer ci-admin-token' -H 'Content-Type: application/json' \
            -d "{\"version\":\"${version}\"}" >/dev/null
          token="$(curl -fsS -X POST http://127.0.0.1:8080/api/v1/agents/enrolment-tokens \
            -H 'Authorization: Bearer ci-admin-token' -H 'Content-Type: application/json' \
            -d '{"ttl_seconds":900}' | python -c 'import json,sys; print(json.load(sys.stdin)["enrolment_token"])')"
          test -n "${token}"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Install the MSI and assert what it placed
        run: |
          $p = Start-Process msiexec -ArgumentList '/i','out\synapse-agent.msi','/quiet','/norestart','/l*v','install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            # A verbose MSI log ends with a property dump, so the tail is the LEAST informative part of
            # it — that is how a launch-condition failure first read here as an unexplained 1603. Print
            # the lines that actually name a cause, and keep the whole log as an artifact.
            Write-Host "--- lines naming a cause ---"
            Select-String -Path install.log -Pattern 'Action ended.*: 3\.','returned actual error','Error [0-9]+\.','MainEngineThread is returning','condition','Product: .* -- ' |
              ForEach-Object { $_.Line.Trim() }
            Write-Host "--- OS version as msiexec sees it (it reads through the compatibility shim) ---"
            Select-String -Path install.log -Pattern 'Property\(C\): (VersionNT|WindowsBuild|VersionNT64) =' |
              ForEach-Object { $_.Line.Trim() }
            throw "msiexec failed with $($p.ExitCode)"
          }

          # The 64-bit location specifically. An amd64 binary landing under "Program Files (x86)" means
          # the package was built 32-bit, and the assertion says WHERE it looked and what it found
          # instead -- a bare "not installed" cost a round trip once already.
          $exe = "$env:ProgramFiles\Synapse Agent\synapse-agent.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "--- where synapse-agent.exe actually landed ---"
            Get-ChildItem 'C:\Program Files','C:\Program Files (x86)' -Recurse -Filter 'synapse-agent.exe' `
              -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            throw "the agent binary was not installed at $exe"
          }

          # The service must EXIST as a service, configured to run as LocalService rather than
          # LocalSystem: an agent on every host should hold the least privilege that still works.
          $svc = Get-CimInstance Win32_Service -Filter "Name='synapse-agent'"
          if (-not $svc) { throw "the service was not installed" }
          if ($svc.StartName -ne 'NT AUTHORITY\LocalService') { throw "service runs as $($svc.StartName), want LocalService" }
          Write-Host "service installed, running as $($svc.StartName)"

      # Kept whether the install passed or failed: on a failure it is the only record of why, and a
      # future 1603 should not need a second run to become diagnosable.
      - name: Keep the installer log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msi-install-log
          path: install.log
          if-no-files-found: warn

      - name: The service must start and answer the SCM
        env:
          ENROL_TOKEN: ${{ steps.enrol.outputs.token }}
        run: |
          # The service needs its control-plane URL and one-time token before it can do anything. They
          # go in the machine environment, which is where a real deployment puts them.
          [Environment]::SetEnvironmentVariable('SYNAPSE_FLEET_URL','http://127.0.0.1:8080','Machine')
          [Environment]::SetEnvironmentVariable('SYNAPSE_FLEET_ENROL_TOKEN',$env:ENROL_TOKEN,'Machine')
          [Environment]::SetEnvironmentVariable('SYNAPSE_AGENT_STATE_DIR',"$env:ProgramData\SynapseAgent",'Machine')

          Start-Service synapse-agent
          # Reaching Running at all is the assertion: a binary that does not answer the SCM's status
          # protocol never gets here, it fails with "did not respond in a timely fashion".
          $svc = Get-Service synapse-agent
          $svc.WaitForStatus('Running','00:00:30')
          Write-Host "service reached Running — the SCM handshake works"

          # And it must complete a real enrol: the credential on disk is the evidence, not the fact
          # that a process is alive.
          $state = "$env:ProgramData\SynapseAgent"
          $ok = $false
          foreach ($i in 1..30) {
            if (Test-Path $state) {
              if ((Get-ChildItem $state -File -ErrorAction SilentlyContinue).Count -gt 0) { $ok = $true; break }
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { throw "the service left no credential — enrolment did not complete" }
          Write-Host "enrol + heartbeat completed; credential persisted"

      - name: Stop, uninstall, and assert nothing is left behind
        run: |
          Stop-Service synapse-agent -Force
          (Get-Service synapse-agent).WaitForStatus('Stopped','00:00:30')

          $p = Start-Process msiexec -ArgumentList '/x','out\synapse-agent.msi','/quiet','/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed with $($p.ExitCode)" }

          if (Get-CimInstance Win32_Service -Filter "Name='synapse-agent'") { throw "uninstall left the service behind" }
          if (Test-Path "$env:ProgramFiles\Synapse Agent\synapse-agent.exe") { throw "uninstall left the binary behind" }
          # The state directory is deliberately KEPT, exactly as the deb and rpm do: the credential is
          # the operator's to inspect or remove, not the installer's to delete.
          if (-not (Test-Path "$env:ProgramData\SynapseAgent")) { throw "the documented state directory was removed" }
          Write-Host "clean uninstall; state directory preserved"

      - name: Control plane log
        if: always()
        shell: bash
        run: cat control-plane.log || true

  # Requirement 2, second enforcement: a runtime older than the build floor must be REFUSED at install
  # time with a readable message and leave nothing behind. This is the field failure the requirement
  # was written from — the package installed and the service crash-looped at first start.
  libc-floor-refusal:
    name: install below the libc floor is refused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the agent
        run: CGO_ENABLED=0 go build -trimpath -o dist/synapse-agent ./cmd/synapse-agent
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Build a package whose floor is far above any runtime
        env:
          SYNAPSE_LIBC_FLOOR: "99.99"
        run: |
          set -euo pipefail
          mkdir -p out
          "$(go env GOPATH)/bin/nfpm" package -f packaging/nfpm.yaml -p deb -t out/
      - name: The install must FAIL and leave nothing behind
        run: |
          set -euo pipefail
          pkg="$(ls out/*.deb)"
          docker run --rm -e SYNAPSE_LIBC_FLOOR=99.99 \
            -v "${PWD}/${pkg}:/tmp/pkg.deb" debian:12 /bin/sh -eu -c '
              if dpkg -i /tmp/pkg.deb >/tmp/install.log 2>&1; then
                echo "install SUCCEEDED below the libc floor — the preinstall guard did not fire"
                cat /tmp/install.log
                exit 1
              fi
              grep -q "older than the build floor" /tmp/install.log || {
                echo "refusal message is not readable:"; cat /tmp/install.log; exit 1; }
              test ! -x /usr/bin/synapse-agent || { echo "a refused install left the binary behind"; exit 1; }
              echo "refused at install time, nothing left behind"
            '
