name: "Synapse SCA scan"
description: "Run a Synapse SCA + SAST + secret + IaC-misconfig scan and gate CI on findings."
author: "KKloudTarus"
branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "Path to scan. A source directory, or — with image: true — a container image reference or a local `docker save` tarball (.tar/.tar.gz)."
    required: false
    default: "."
  image:
    description: "When true, scan `path` as a container image (registry ref or local docker-save tarball) instead of a source tree. Runs SCA + OS-package CVE + secret + misconfig; source SAST is skipped for images."
    required: false
    default: "false"
  fail-on:
    description: "Minimum severity that fails the build: critical | high | medium | low | info."
    required: false
    default: "high"
  sarif:
    description: "When true, write a SARIF 2.1.0 report and expose its path as the `sarif-file` output."
    required: false
    default: "false"
  offline:
    description: "When true, run without network egress (offline databases only)."
    required: false
    default: "false"
  version:
    description: 'synapse-cli release to use, e.g. "v0.1.0", or "latest".'
    required: false
    default: "latest"
  sarif-output:
    description: "Path for the SARIF report when `sarif` is true."
    required: false
    default: "synapse.sarif"
  server:
    description: "Synapse API base URL, e.g. https://synapse.example.com. When set, the scan result is recorded on the server as the project's next analysis, so the console's history, trend and managed quality gate pick it up. Requires `project` and `api-token`."
    required: false
    default: ""
  project:
    description: "Server-owned project key the result belongs to. Required when `server` is set."
    required: false
    default: ""
  api-token:
    description: "Synapse API token with the operate permission. Pass a secret, never a literal. Required when `server` is set."
    required: false
    default: ""
  args:
    description: "Extra flags appended to `synapse-cli scan`, for example `--require-complete --min-confidence high` or `--json`. The value is split on whitespace (spaces, tabs, newlines, so a multi-line block works) into separate words and nothing else is interpreted: no quoting or escaping, and `$`, backticks, `;`, `&&`, `*` and quotes are ordinary characters of a word, so a value containing a space cannot be passed. A flag that has its own input (`--fail-on`, `--image`, `--offline`, `--server`, `--project`, `--sarif`, `--sarif-out`) is rejected: set it through that input. `--json` or `--sbom` combines with `sarif: true`, because the action writes the SARIF to a file; with a `version` older than `--sarif-out` the step fails before the scan runs. Default: no extra flags."
    required: false
    default: ""
  install-grype:
    description: "When true (the default), install Grype and point `SYNAPSE_GRYPE_BIN` at it. Set to false to skip the install when no scan selects Grype: it joins a scan only when `SYNAPSE_DETECTION_SOURCES` lists `grype`, which the default does not. If a scan lists it and it is not installed, Grype contributes nothing and the scan continues with the other sources, unless `SYNAPSE_GRYPE_BIN` already points at a Grype you provide."
    required: false
    default: "true"

outputs:
  sarif-file:
    description: "Path to the generated SARIF report (only when `sarif` is true)."
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Install synapse-cli
      shell: bash
      # No GITHUB_TOKEN is exposed here on purpose: the release lookup hits a PUBLIC endpoint, and
      # keeping the token out of this step means nothing it runs can exfiltrate it (the `curl | sh`
      # grype installer is in its own step below, with no token either). Pin `version` to a tag to
      # skip the unauthenticated API call entirely.
      env:
        SYNAPSE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        REPO="KKloudTarus/synapse-ce"
        BIN_DIR="${RUNNER_TEMP}/synapse-bin"
        mkdir -p "${BIN_DIR}"

        # Resolve the release tag (accept "latest" or an explicit vX.Y.Z). Public repo → no auth needed.
        tag="${SYNAPSE_VERSION}"
        if [ "${tag}" = "latest" ] || [ -z "${tag}" ]; then
          # Written to a file before parsing. Piping into `grep -m1` closes the read end as soon as the first
          # match is found, so curl can take EPIPE and exit 23 while the response is still being written; with
          # pipefail that failed the whole step, and it did on a GitHub runner with the default version input.
          # Whether it happens depends on the response size and timing, which is why it passed locally.
          curl -fsSL -o "${BIN_DIR}/latest.json" "https://api.github.com/repos/${REPO}/releases/latest"
          tag="$(grep -m1 '"tag_name"' "${BIN_DIR}/latest.json" | cut -d '"' -f4)"
          rm -f "${BIN_DIR}/latest.json"
        fi
        # Only a strict vX.Y.Z[-suffix] tag is allowed, so a crafted `version` input cannot walk the
        # download path to an arbitrary artifact. The case guard rejects any stray character over the
        # WHOLE value (empty, newline, slash) that a line-oriented grep would miss; the regex fixes shape.
        case "${tag}" in
          ""|*[!A-Za-z0-9.+-]*)
            echo "::error::invalid release tag '${tag}' (input version='${SYNAPSE_VERSION}')" >&2; exit 1 ;;
        esac
        if ! printf '%s' "${tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'; then
          echo "::error::refusing non-semver release tag '${tag}' (input version='${SYNAPSE_VERSION}')" >&2
          exit 1
        fi
        ver="${tag#v}" # goreleaser archive names drop the leading 'v'

        # Map the runner to goreleaser's OS/arch archive naming.
        case "${RUNNER_OS}" in
          Linux) os="linux" ;;
          macOS) os="darwin" ;;
          Windows) os="windows" ;;
          *) echo "::error::unsupported runner OS ${RUNNER_OS}" >&2; exit 1 ;;
        esac
        case "${RUNNER_ARCH}" in
          X64) arch="amd64" ;;
          ARM64) arch="arm64" ;;
          *) echo "::error::unsupported runner arch ${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        ext="tar.gz"; [ "${os}" = "windows" ] && ext="zip"
        asset="synapse-ce_${ver}_${os}_${arch}.${ext}"
        base="https://github.com/${REPO}/releases/download/${tag}"

        # Download the archive AND the release checksums, then verify BEFORE extracting/executing.
        curl -fsSL -o "${BIN_DIR}/${asset}" "${base}/${asset}"
        curl -fsSL -o "${BIN_DIR}/checksums.txt" "${base}/checksums.txt"
        want="$(awk -v f="${asset}" '$2 == f {print $1}' "${BIN_DIR}/checksums.txt")"
        if [ -z "${want}" ]; then
          echo "::error::no checksum for ${asset} in checksums.txt" >&2; exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          got="$(sha256sum "${BIN_DIR}/${asset}" | awk '{print $1}')"
        else
          got="$(shasum -a 256 "${BIN_DIR}/${asset}" | awk '{print $1}')" # macOS runners
        fi
        if [ "${want}" != "${got}" ]; then
          echo "::error::checksum mismatch for ${asset} (want ${want}, got ${got})" >&2; exit 1
        fi

        if [ "${ext}" = "zip" ]; then
          unzip -o "${BIN_DIR}/${asset}" -d "${BIN_DIR}" >/dev/null
        else
          tar -xzf "${BIN_DIR}/${asset}" -C "${BIN_DIR}" synapse-cli
        fi
        chmod +x "${BIN_DIR}/synapse-cli" 2>/dev/null || true

        # SBOM generation is the OWNED engine (pure Go, in-process), so syft is not installed: it was a
        # `curl | sh` in every consumer's CI for a tool nothing on the default path calls.
        echo "${BIN_DIR}" >> "${GITHUB_PATH}"

    - name: Install grype
      # Skipped only by an explicit `install-grype: false`, so a workflow that does not set the input
      # installs it as before. A step of its own, rather than a branch inside the one above, so the
      # run log shows it skipped instead of saying nothing.
      if: inputs.install-grype != 'false'
      shell: bash
      # No env block: this step runs a `curl | sh` installer, so nothing from the workflow is passed in.
      run: |
        set -euo pipefail

        # Kept at the version the release container image builds. This downloads anchore's published
        # binary, which carries anchore's own dependency versions; the container image instead rebuilds
        # grype from this tag with a patched golang.org/x/net and brotli.
        GRYPE_VERSION="v0.121.2"
        BIN_DIR="${RUNNER_TEMP}/synapse-bin"
        mkdir -p "${BIN_DIR}"

        # grype stays as an OPT-IN vulnerability source and nothing selects it by default. Without a synced
        # advisory store it is the only way a scan can match OS-package CVEs, and a scan that has neither says
        # so rather than reporting a clean result. The installer is pinned to the tool version tag (not the
        # moving main branch) so the script itself is fixed, and it checksum-verifies the binary it fetches.
        curl -fsSL "https://raw.githubusercontent.com/anchore/grype/${GRYPE_VERSION}/install.sh" | sh -s -- -b "${BIN_DIR}" "${GRYPE_VERSION}"

        echo "SYNAPSE_GRYPE_BIN=${BIN_DIR}/grype" >> "${GITHUB_ENV}"

    - name: Run scan
      id: scan
      shell: bash
      env:
        SYNAPSE_PATH: ${{ inputs.path }}
        SYNAPSE_IMAGE: ${{ inputs.image }}
        SYNAPSE_FAIL_ON: ${{ inputs.fail-on }}
        SYNAPSE_SARIF: ${{ inputs.sarif }}
        SYNAPSE_OFFLINE: ${{ inputs.offline }}
        SYNAPSE_SARIF_OUT: ${{ inputs.sarif-output }}
        SYNAPSE_SERVER: ${{ inputs.server }}
        SYNAPSE_PROJECT: ${{ inputs.project }}
        SYNAPSE_API_TOKEN: ${{ inputs.api-token }}
        # Reaches the script only through this variable. Writing the `inputs.args` expression inside `run:`
        # would paste the caller's text into the script before bash parses it, which is a script-injection hole.
        SYNAPSE_ARGS: ${{ inputs.args }}
      run: |
        # Not `-e`: the scan's non-zero exit IS the gate result, propagated deliberately at the end so
        # the SARIF output is still recorded when the gate fails (an `if: always()` upload keeps working).
        set -uo pipefail
        args=(scan "${SYNAPSE_PATH}" --fail-on "${SYNAPSE_FAIL_ON}")
        if [ "${SYNAPSE_IMAGE}" = "true" ]; then
          args+=(--image)
        fi
        if [ "${SYNAPSE_OFFLINE}" = "true" ]; then
          args+=(--offline)
        fi
        if [ -n "${SYNAPSE_SERVER}" ]; then
          # Record the result on the server as the project's next analysis. synapse-cli reads the
          # branch, run id, run URL and actor from the GITHUB_* variables, so nothing else is passed.
          args+=(--server "${SYNAPSE_SERVER}" --project "${SYNAPSE_PROJECT}")
        fi
        # Extra flags from the `args` input. They are split into words with `read`, which performs no
        # expansion, globbing or quote handling, and passed as separate argv entries below, so `; id` or
        # `$(id)` is just text the CLI rejects as an unknown option and never a command. `-d ''` makes read
        # take the whole value rather than its first line, so a multi-line block is not silently cut short
        # (that would drop a gate flag without a word); `|| true` absorbs the non-zero status read returns
        # at end of input. The array is declared first and its length tested before it is expanded, because
        # an empty array expanded under `set -u` is an error on bash older than 4.4.
        extra=()
        if [ -n "${SYNAPSE_ARGS}" ]; then
          IFS=$' \t\r\n' read -r -d '' -a extra <<< "${SYNAPSE_ARGS}" || true
        fi
        if [ "${#extra[@]}" -gt 0 ]; then
          for word in "${extra[@]}"; do
            case "${word}" in
              # A flag with its own input has one place to be set, so a second copy here cannot change what
              # the workflow's `with:` block says (the CLI keeps the last copy of a repeated flag).
              --fail-on|--image|--offline|--server|--project|--sarif|--sarif-out)
                echo "::error::args must not contain ${word}; set it through the matching input of this action" >&2
                exit 2 ;;
              # `sarif: true` adds --sarif-out below, which writes a file and combines with --json or --sbom.
              # A pinned binary older than --sarif-out takes --sarif on stdout instead, which cannot share
              # stdout; say which input conflicts rather than leaving the CLI's wording to explain it.
              --json|--sbom)
                # Probed by the usage wording that announces the combination: releases that had --sarif-out
                # before it could combine reject the pair, so the flag's mere presence is not enough. The help
                # text is read whole first, so an early-exiting grep cannot SIGPIPE the CLI under pipefail.
                usage_text="$(synapse-cli scan --help 2>/dev/null || true)"
                if [ "${SYNAPSE_SARIF}" = "true" ] && [[ "${usage_text}" != *"combines with --json or --sbom"* ]]; then
                  echo "::error::args contains ${word}, which this synapse-cli version cannot combine with sarif: true (it has no --sarif-out); pin a newer version or drop one of them" >&2
                  exit 2
                fi ;;
            esac
          done
          args+=("${extra[@]}")
        fi
        rc=0
        if [ "${SYNAPSE_SARIF}" = "true" ]; then
          # --sarif-out puts the SARIF in a file and leaves stdout for the human report, so the job log
          # still shows what was found. --sarif alone takes stdout, so redirecting it to a file left the
          # log with nothing but the gate's exit code. Probed because `version:` may pin an older binary
          # than this action file.
          if synapse-cli scan --help 2>&1 | grep -q -- '--sarif-out'; then
            synapse-cli "${args[@]}" --sarif-out "${SYNAPSE_SARIF_OUT}" || rc=$?
          else
            synapse-cli "${args[@]}" --sarif > "${SYNAPSE_SARIF_OUT}" || rc=$?
          fi
          echo "sarif-file=${SYNAPSE_SARIF_OUT}" >> "${GITHUB_OUTPUT}"
        else
          synapse-cli "${args[@]}" || rc=$?
        fi
        exit "${rc}"
