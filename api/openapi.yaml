            required: [advisory_id, revision, changed_at]
            properties:
              advisory_id: {type: string}
              revision: {type: integer, minimum: 1}
              changed_at: {type: string, format: date-time}
        affected_revisions_truncated: {type: boolean}
        checkpoint: {type: object, additionalProperties: true}
        counts: {$ref: '#/components/schemas/VulnerabilitySyncCounts'}
        error_samples: {type: array, maxItems: 32, items: {type: string}}
        state: {$ref: '#/components/schemas/VulnerabilitySyncState'}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    VulnerabilitySyncRunPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/VulnerabilitySyncRun'}}
        next: {$ref: '#/components/schemas/VulnerabilityCursor'}

    VulnerabilityAction:
      type: object
      required: [id, engagement_id, occurrence_id, finding_id, transition_id, type, status, title, reason_codes, created_at, updated_at]
      properties:
