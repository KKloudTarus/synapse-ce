openapi: 3.1.0
info:
  title: Synapse API
  version: 0.1.0
  description: >
    Security & pentest operations – software composition analysis core.
    Authorized security testing only: every scan is gated by an engagement's
    scope and authorization window, enforced server-side.

    Auth: all endpoints except `/healthz` and `/readyz` require a bearer token
    (`Authorization: Bearer <SYNAPSE_API_TOKEN>`). After authentication, every
    endpoint except the AUP endpoints also requires that the current Acceptable
    Use Policy has been accepted, else `403`.

    Note: legacy response objects may use PascalCase where they are serialized
    directly from domain structs. Endpoints with explicit response schemas,
    including the rule catalog API, use the field names documented below.

servers:
- url: http://localhost:8080
  description: Local API

security:
- bearerAuth: []

tags:
- name: health
- name: aup
- name: engagements
- name: findings
- name: sca
- name: export
- name: projects
  description: Long-lived code-quality Projects and immutable analysis read models
- name: rules
  description: Built-in code-quality and security rule catalog
- name: assets
  description: Business-level Asset Management and security posture
- name: dashboard
  description: Tenant-scoped security operations summaries
- name: vulnerability-intelligence
  description: Tenant-scoped vulnerability feeds, exposure correlation, risk transitions, and durable operations
- name: remediation-sla
  description: Risk-based remediation deadlines, immutable assessments, policy versions, and human-owned lifecycle governance
- name: fleet
  description: Enrolled-agent transport and operator fleet administration

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  service: {type: string, example: synapse-api}

  /readyz:
    get:
      tags: [health]
      summary: Dependency readiness probe
      description: Checks PostgreSQL, embedded migration state, and the object store when configured.
      security: []
      responses:
        "200":
          description: Every configured dependency is ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}
        "503":
          description: One or more configured dependencies failed or timed out
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}

  /api/v1/aup:
    get:
      tags: [aup]
      summary: Current Acceptable Use Policy + acceptance state
      responses:
        "200":
          description: The active AUP
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AupStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/aup/accept:
    post:
      tags: [aup]
      summary: Accept the current AUP (recorded with actor + version + timestamp)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: string, example: "1.0"}
      responses:
        "200": {description: Accepted}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/engagements:
    get:
      tags: [engagements]
      summary: List engagements
      responses:
        "200":
          description: Engagements
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Engagement"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [engagements]
      summary: Create an engagement
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateEngagementRequest"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Engagement"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/engagements/{id}/cspm/runs:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    post:
      tags: [engagements, findings, assets]
      summary: Run a bounded read-only live cloud posture scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items:
                    type: object
                    required: [provider, root, credential_ref]
                    properties:
                      provider: {type: string, enum: [aws, azure, gcp]}
                      root: {type: string, minLength: 1}
                      credential_ref: {type: string, minLength: 1, description: Vault reference; never credential material}
      responses:
        "202":
          description: Durable CSPM run accepted for isolated worker execution
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CSPMRun"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/engagements/{id}/cspm/runs/{rid}:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    - name: rid
      in: path
      required: true
      schema: {type: string}
    get:
      tags: [engagements, findings, assets]
      summary: Get a durable CSPM run
      responses:
        "200": {description: CSPM run status, content: {application/json: {schema: {$ref: "#/components/schemas/CSPMRun"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/engagements/{id}/findings:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    get:
      tags: [findings]
      summary: List an engagement's findings (highest risk first)
      description: Ordered by CISA KEV, then EPSS x CVSS, then severity – never raw
        CVSS.
      responses:
        "200":
          description: Findings
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Finding"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [findings]
      summary: Create a manual finding
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateManualFindingRequest"}
      responses:
        "201":
          description: Created finding
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Finding"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/engagements/{id}/findings/{fid}:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    - name: fid
      in: path
      required: true
      schema: {type: string}
    patch:
      tags: [findings]
      summary: Change a finding's triage status (audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, triage, confirmed, false_positive, remediated]
                note: {type: string}
      responses:
        "200":
          description: The updated finding
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Finding"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/engagements/{id}/sarif:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    post:
      tags: [findings]
      summary: Import a third-party SARIF report
      parameters:
      - name: asset_id
        in: query
        schema: {type: string}
        description: Authoritative asset ID; required and validated when fleet asset attribution is configured.
      requestBody:
        required: true
        content:
          application/sarif+json:
            schema: {type: object}
      responses:
        "200": {description: Ingest summary}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/engagements/{id}/export/sarif:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    get:
      tags: [export]
      summary: Export findings as SARIF 2.1.0
      responses:
        "200":
          description: SARIF document
          content:
            application/sarif+json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/engagements/{id}/export/openvex:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    get:
      tags: [export]
      summary: Export findings as OpenVEX 0.2
      responses:
        "200":
          description: OpenVEX document
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/engagements/{id}/report.pdf:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    get:
      tags: [export]
      summary: Deterministic PDF report, SHA-256 sealed
      description: Templated from stored data (no LLM). The body's SHA-256 is returned
        in `X-Report-SHA256`.
      responses:
        "200":
          description: PDF report
          headers:
            X-Report-SHA256:
              description: Hex SHA-256 of the PDF bytes (integrity seal)
              schema: {type: string}
          content:
            application/pdf:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/sca/scans:
    post:
      tags: [sca]
      summary: Run an SCA scan against an in-scope target
      description: >
        Scope + authorization window are enforced before any tool runs; an
        out-of-scope or expired target is rejected with 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScanRequest"}
      responses:
        "200":
          description: Scan result (SBOM, vulnerabilities, licenses, findings, provenance)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScanResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/sca/scans/{id}:
    get:
      tags: [sca]
      summary: Read one asynchronous scan job by its own id
      description: >
        Reads a specific scan job rather than the engagement's latest, so a
        concurrent scan on the same engagement cannot mask this job's status. The
        job is resolved first, then its engagement is checked against the caller's
        tenant; an unknown or cross-tenant job is 404 and reveals nothing.
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: Scan job id returned when the scan was accepted
      responses:
        "200":
          description: Scan job status, stage, and progress
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScanJob"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/attack-paths:
    get:
      tags: [findings]
      summary: List bounded, tenant-scoped derived attack paths
      description: >
        Non-empty target, entrypoint, and finding filters compose with AND. Unknown
        or cross-tenant filter IDs return an empty result to avoid disclosure.
      parameters:
      - name: target
        in: query
        schema: {type: string}
        description: Asset ID that a returned path must contain
      - name: entrypoint
        in: query
        schema: {type: string}
        description: Starting exposure asset ID
      - name: finding
        in: query
        schema: {type: string}
        description: Finding ID at the path endpoint; without finding_kind, matches either target kind
      - name: finding_kind
        in: query
        schema: {type: string, enum: [canonical, imported]}
        description: Optional endpoint kind; requires finding and selects its typed target
      responses:
        "200":
          description: Deterministically ordered paths and the applied traversal bounds
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AttackPathResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /api/v1/projects/{key}:
    parameters:
    - $ref: '#/components/parameters/ProjectKey'
    delete:
      tags: [projects]
      summary: Delete a Project and its retained source artifacts
      operationId: deleteProject
      responses:
        "204": {description: Project deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /api/v1/projects/{key}/analyses/{id}/source:
    parameters:
    - $ref: '#/components/parameters/ProjectKey'
    - $ref: '#/components/parameters/AnalysisId'
    post:
      tags: [projects]
      summary: Publish an immutable source snapshot for one server-owned Project analysis
      operationId: publishProjectAnalysisSource
      description: >
        Authenticated CI contribution path for Code Quality source. The server derives tenant
        and actor from the bearer token, re-resolves the analysis under that tenant/project,
        applies configured source-capture policy and limits, and creates the snapshot once.
      parameters:
      - name: X-Synapse-Tool-Version
        in: header
        required: true
        schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: {type: string, format: binary}
      responses:
        "201":
          description: Source snapshot published and attached to the immutable analysis
          content:
            application/json:
              schema:
                type: object
                required: [files, writer, digest]
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      required: [path, bytes, lines, generated, available]
                      properties:
                        path: {type: string, minLength: 1}
                        digest: {type: string}
                        bytes: {type: integer, format: int64, minimum: 0}
                        lines: {type: integer, minimum: 0}
                        generated: {type: boolean}
                        available: {type: boolean}
                        reason: {type: string}
                  truncated: {type: boolean}
                  writer:
                    type: object
                    required: [actor, tool_version, published_at]
                    properties:
                      actor: {type: string, minLength: 1}
                      tool_version: {type: string, minLength: 1}
                      published_at: {type: string, format: date-time}
                  digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Analysis already has source or source artifact state conflicts}
        "413": {description: Source archive exceeds the transport upload limit}
        "415": {description: Content-Type is not application/x-tar}
        "500": {$ref: "#/components/responses/InternalServerError"}
        "503": {description: Source artifact storage is temporarily unavailable}

  /api/v1/projects/{key}/analyses/{id}/code/files:
    parameters:
    - $ref: '#/components/parameters/ProjectKey'
    - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [projects]
      summary: List immutable source files for one Project analysis
      operationId: listProjectCodeFiles
      parameters:
      - name: include_generated
        in: query
        schema: {type: boolean, default: false}
      - name: changed
        in: query
        schema: {type: boolean}
      - name: has_findings
        in: query
        schema: {type: boolean}
      - name: prefix
        in: query
        schema: {type: string, maxLength: 256}
      - name: status
        in: query
        schema: {type: string, enum: [unchanged, added, modified, deleted, renamed, copied, mode_only]}
      responses:
        "200":
          description: Immutable analysis source inventory and capabilities
          headers:
            ETag:
              description: Immutable file-index entity tag
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectCodeFilesResponse"}
        "304": {description: File index is unchanged}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /api/v1/projects/{key}/analyses/{id}/code/diff:
    parameters:
    - $ref: '#/components/parameters/ProjectKey'
    - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [projects]
      summary: Read a persisted immutable Git diff for one Project analysis
      operationId: getProjectCodeDiff
      parameters:
      - name: path
        in: query
        required: true
        schema: {type: string, minLength: 1}
      - name: view
        in: query
        schema: {type: string, enum: [unified, split], default: unified}
      - name: context
        in: query
        schema: {type: integer, minimum: 0, maximum: 100}
      responses:
        "200":
          description: Persisted immutable diff representation
          headers:
            ETag:
              description: Immutable diff entity tag
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectCodeDiffResponse"}
        "304": {description: Diff is unchanged}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Source artifact integrity mismatch}
        "410": {description: Comparison data was not retained or is unavailable}
        "413": {description: Diff content exceeds retained limits}
        "415": {description: Binary or unsupported diff content}
        "503": {description: Source artifact storage is temporarily unavailable}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /api/v1/projects/{key}/analyses/{id}/code/file:
    parameters:
    - $ref: '#/components/parameters/ProjectKey'
    - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [projects]
      summary: Read a bounded immutable source window for one Project analysis
      operationId: getProjectCodeFile
      parameters:
      - name: path
        in: query
        required: true
        schema: {type: string, minLength: 1}
      - name: from_line
        in: query
        schema: {type: integer, minimum: 1, default: 1}
      - name: to_line
        in: query
        schema: {type: integer, minimum: 1, maximum: 1000}
      responses:
        "200":
          description: Immutable source window
          headers:
            ETag:
              description: Immutable source-window entity tag
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectCodeFileResponse"}
        "304": {description: Source window is unchanged}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Source artifact integrity mismatch}
        "410": {description: Source was not retained for this analysis}
        "413": {description: Source content exceeds retained limits}
        "415": {description: Binary or unsupported source content}
        "503": {description: Source artifact storage is temporarily unavailable}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /api/v1/projects/{key}/overview:
    parameters:
    - name: key
      in: path
      required: true
      schema: {type: string}
      example: payments-api
    get:
      tags: [projects]
      summary: Get the latest Project quality overview
      operationId: getProjectOverview
      description: >
        Returns the latest immutable Project analysis overview without loading the
        full scan-result blob. Existing Projects without an analysis return
        `state=not_analyzed` with explicit unavailable metric values.
      responses:
        "200":
          description: Project overview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectOverview"}
              examples:
                analyzed:
                  value:
                    state: analyzed
                    project: {key: payments-api, name: Payments API}
                    latest_analysis:
                      id: analysis-42
                      created_at: "2026-07-17T10:00:00Z"
                      source_ref: main
                      source_commit: abc123
                      new_code:
                        first_analysis: false
                        has_baseline: true
                        baseline_analysis_id: analysis-41
                    gate:
                      status: failed
                      key: synapse-way
                      name: Synapse way
                      source: managed
                      failed_conditions:
                      - {metric: new_high, operator: "<=", threshold: 0, actual: 2}
                    issue_summary:
                      new_code_total: {availability: available, value: 4, unavailable_reason: null}
                      accepted_overall_total: {availability: unavailable, value: null,
                        unavailable_reason: issue_lifecycle_not_available}
                    lenses:
                      overall:
                        security: {availability: available, grade: B, unavailable_reason: null}
                        reliability: {availability: available, grade: A, unavailable_reason: null}
                        maintainability: {availability: available, grade: C, unavailable_reason: null}
                        security_hotspots_reviewed: {availability: unavailable, value: null,
                          unavailable_reason: security_hotspots_not_available}
                        coverage: {availability: available, value: 72.349, unavailable_reason: null}
                        duplications: {availability: available, value: 4.25, unavailable_reason: null}
                      new_code:
                        security: {availability: available, grade: A, unavailable_reason: null}
                        reliability: {availability: available, grade: B, unavailable_reason: null}
                        maintainability: {availability: unavailable, grade: null,
                          unavailable_reason: changed_line_metrics_not_available}
                        security_hotspots_reviewed: {availability: unavailable, value: null,
                          unavailable_reason: security_hotspots_not_available}
                        coverage: {availability: unavailable, value: null, unavailable_reason: changed_line_metrics_not_available}
                        duplications: {availability: unavailable, value: null, unavailable_reason: changed_line_metrics_not_available}
                notAnalyzed:
                  value:
                    state: not_analyzed
                    project: {key: payments-api, name: Payments API}
                    latest_analysis:
                    gate:
                    issue_summary:
                      new_code_total: {availability: unavailable, value: null, unavailable_reason: no_analysis}
                      accepted_overall_total: {availability: unavailable, value: null,
                        unavailable_reason: no_analysis}
                    lenses:
                      overall:
                        security: {availability: unavailable, grade: null, unavailable_reason: no_analysis}
                        reliability: {availability: unavailable, grade: null, unavailable_reason: no_analysis}
                        maintainability: {availability: unavailable, grade: null,
                          unavailable_reason: no_analysis}
                        security_hotspots_reviewed: {availability: unavailable, value: null,
                          unavailable_reason: no_analysis}
                        coverage: {availability: unavailable, value: null, unavailable_reason: no_analysis}
                        duplications: {availability: unavailable, value: null, unavailable_reason: no_analysis}
                      new_code:
                        security: {availability: unavailable, grade: null, unavailable_reason: no_analysis}
                        reliability: {availability: unavailable, grade: null, unavailable_reason: no_analysis}
                        maintainability: {availability: unavailable, grade: null,
                          unavailable_reason: no_analysis}
                        security_hotspots_reviewed: {availability: unavailable, value: null,
                          unavailable_reason: no_analysis}
                        coverage: {availability: unavailable, value: null, unavailable_reason: no_analysis}
                        duplications: {availability: unavailable, value: null, unavailable_reason: no_analysis}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /api/v1/projects/{key}/hotspots:
    parameters:
    - name: key
      in: path
      required: true
      schema: {type: string}
    get:
      tags: [projects]
      summary: List Project Security Hotspot projections
      operationId: listProjectHotspots
      description: >
        Returns catalog-classified Project Security Hotspots without loading a full
        scan-result blob.
      parameters:
      - name: status
        in: query
        schema: {$ref: "#/components/schemas/ProjectHotspotStatus"}
      - name: rule
        in: query
        schema: {type: string, maxLength: 256}
      - name: severity
        in: query
        schema: {$ref: "#/components/schemas/ProjectHotspotSeverity"}
      - name: search
        in: query
        schema: {type: string, maxLength: 256}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 25}
