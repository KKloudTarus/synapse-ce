        job_id: {type: string}
        scope: {type: string, enum: [tenant, advisory]}
        advisory_id: {type: string}
        state: {type: string, enum: [queued, running, succeeded, failed]}
        created: {type: boolean}

    VulnerabilityReconcileRun:
      type: object
      additionalProperties: true
      required: [tenant_id, id, scope, dry_run, durable_job_id, checkpoint, counts, state, snapshot_at, created_at, updated_at]
      properties:
        tenant_id: {type: string}
        id: {type: string}
        scope: {type: string, enum: [tenant, advisory]}
        advisory_id: {type: string}
        dry_run: {type: boolean, description: Pinned when the run is enqueued and unchanged across retries or rollout configuration changes}
        durable_job_id: {type: string}
        checkpoint: {type: object, additionalProperties: true}
        counts:
          $ref: '#/components/schemas/VulnerabilityReconcileCounts'
        state: {type: string, enum: [queued, running, succeeded, failed]}
        snapshot_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    VulnerabilityReconcileCounts:
      type: object
      required: [processed, added, updated, unchanged, unmatchable, retired]
      description: For dry-run runs, counts are derived from persisted difference rows and remain idempotent across retries.
      properties:
        processed: {type: integer, minimum: 0, description: Total difference rows across all mismatch classes}
        added: {type: integer, minimum: 0, description: "missing_occurrence rows"}
        updated: {type: integer, minimum: 0, description: "changed_occurrence rows"}
        unchanged: {type: integer, minimum: 0, description: "in_sync rows"}
        unmatchable: {type: integer, minimum: 0, description: "unmatchable_input rows"}
        retired: {type: integer, minimum: 0, description: "stale_occurrence rows"}

    VulnerabilityReconcileDiffClass:
      type: string
      enum: [missing_occurrence, changed_occurrence, in_sync, stale_occurrence, unmatchable_input]

    VulnerabilityReconcileDiff:
