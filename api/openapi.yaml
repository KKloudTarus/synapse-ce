        '200': {description: Asset page, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessAssetPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [assets]
      operationId: createBusinessAsset
      summary: Create a business Asset
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateBusinessAssetRequest'}}}}
      responses:
        '201': {description: Created Asset, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessAsset'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Tenant key conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /api/v1/appsec/assets/{assetID}:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: getBusinessAsset
      summary: Get a business Asset
      responses:
        '200': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessAsset'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [assets]
      operationId: updateBusinessAsset
      summary: Update metadata or advance Asset lifecycle with optimistic versioning
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateBusinessAssetRequest'}}}}
      responses:
        '200': {description: Updated Asset, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessAsset'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Version conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /api/v1/appsec/assets/{assetID}/projects:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: listBusinessAssetProjects
      responses: {'200': {description: Project memberships, content: {application/json: {schema: {$ref: '#/components/schemas/AssetMemberships'}}}}}
    put:
      tags: [assets]
      operationId: replaceBusinessAssetProjects
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssetMemberships'}}}}
      responses: {'204': {description: Memberships replaced}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}}

  /api/v1/appsec/assets/{assetID}/technical-assets:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: listBusinessAssetTechnicalAssets
      responses: {'200': {description: Technical Asset memberships, content: {application/json: {schema: {$ref: '#/components/schemas/AssetMemberships'}}}}}
    put:
      tags: [assets]
      operationId: replaceBusinessAssetTechnicalAssets
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssetMemberships'}}}}
      responses: {'204': {description: Memberships replaced}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}}

  /api/v1/appsec/assets/{assetID}/engagements:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: listBusinessAssetEngagements
      responses: {'200': {description: Assigned Engagements, content: {application/json: {schema: {type: array, items: {type: object}}}}}, '404': {$ref: '#/components/responses/NotFound'}}

  /api/v1/appsec/assets/{assetID}/findings:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: listBusinessAssetFindings
      responses:
        '200':
          description: First-party and imported Findings resolved through assigned Engagements
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BusinessAssetFinding'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/appsec/assets/{assetID}/coverage:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: getBusinessAssetCoverage
      responses: {'200': {description: Coverage and freshness projection, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessAssetCoverage'}}}}, '404': {$ref: '#/components/responses/NotFound'}}

  /api/v1/appsec/assets/{assetID}/posture:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: getBusinessAssetPosture
      responses: {'200': {description: Deterministic posture projection, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessAssetPosture'}}}}, '404': {$ref: '#/components/responses/NotFound'}}

  /api/v1/appsec/assets/{assetID}/history:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: getBusinessAssetHistory
      responses: {'200': {description: Assessment history, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BusinessAssetHistoryItem'}}}}}, '404': {$ref: '#/components/responses/NotFound'}}

  /api/v1/engagements/{id}/asset:
    parameters: [{$ref: '#/components/parameters/EngagementId'}]
    put:
      tags: [assets, engagements]
      operationId: assignEngagementBusinessAsset
      summary: Assign or clear an Engagement's primary business Asset
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [asset_id], properties: {asset_id: {type: string, description: Empty string clears assignment}}}}}}
      responses: {'204': {description: Assignment updated}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}}

  /api/v1/ai-triage/reviews:
    get:
      tags: [ai-triage]
      operationId: listAITriageReviews
      summary: List the tenant's durable human-review queue
      parameters:
      - {name: severity, in: query, schema: {type: string, enum: [critical, high, medium, low, info, unknown]}}
      - {name: cwe, in: query, schema: {type: string}}
      - {name: project, in: query, schema: {type: string}}
      - {name: state, in: query, schema: {type: string, enum: [pending, accepted, rejected]}}
      responses:
        '200':
          description: Review queue
          content:
            application/json:
              schema:
                type: object
                required: [reviews]
                properties:
                  reviews: {type: array, items: {$ref: '#/components/schemas/AITriageReview'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/ai-triage/reviews/{rid}/claim:
    parameters: [{$ref: '#/components/parameters/AITriageReviewId'}]
    post:
      tags: [ai-triage]
      operationId: claimAITriageReview
      summary: Assign an unowned review to the authenticated reviewer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AITriageReviewClaimRequest'}
      responses:
        '200': {description: Claimed review, content: {application/json: {schema: {$ref: '#/components/schemas/AITriageReview'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Version or ownership conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /api/v1/ai-triage/reviews/{rid}/decision:
    parameters: [{$ref: '#/components/parameters/AITriageReviewId'}]
    post:
      tags: [ai-triage]
      operationId: decideAITriageReview
      summary: Accept or reject an owned AI false-positive recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AITriageReviewDecisionRequest'}
      responses:
        '200': {description: Decided review, content: {application/json: {schema: {$ref: '#/components/schemas/AITriageReview'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Version, state, or ownership conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    EngagementId:
      name: id
      in: path
      required: true
      schema: {type: string}
    BusinessAssetId:
      name: assetID
      in: path
      required: true
      schema: {type: string, minLength: 1}
    AITriageReviewId:
      name: rid
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ProjectKey:
      name: key
      in: path
      required: true
      description: Unique identifier of the project
      schema:
        type: string
        pattern: ^[a-z0-9_-]+$
    AnalysisId:
      name: id
      in: path
      required: true
      description: Immutable Project analysis identifier
      schema: {type: string, minLength: 1}
    LensParam:
      name: lens
      in: query
      description: Filter by lens (overall or new-code)
      schema:
        type: string
        enum:
        - overall
        - new-code

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: AUP not accepted, or target outside scope / authorization window
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      properties:
        error: {type: string}

    AITriageReview:
      type: object
      required: [id, tenant_id, engagement_id, finding_id, dedup_key, title, severity, state, verdict, driver, confidence, suspected_fp, proposer_model, prompt_version, verified, policy_version, policy_reason, shadow, would_gate_exempt, gate_exempt, review_required, evidence_ref, created_at, updated_at, version]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        engagement_id: {type: string}
        project_id: {type: string}
        finding_id: {type: string}
        dedup_key: {type: string}
        title: {type: string}
        severity: {type: string, enum: [critical, high, medium, low, info, unknown]}
        cwe: {type: string}
        owner: {type: string}
        state: {type: string, enum: [pending, accepted, rejected]}
        verdict: {type: string}
        driver: {type: string}
        confidence: {type: integer, minimum: 0, maximum: 100}
        suspected_fp: {type: boolean}
        proposer_model: {type: string}
        verifier_model: {type: string}
        prompt_version: {type: string}
        verified: {type: boolean}
        verifier_verdict: {type: string}
        verifier_driver: {type: string}
        verifier_confidence: {type: integer, minimum: 0, maximum: 100}
        policy_version: {type: string}
        policy_reason: {type: string}
        shadow: {type: boolean}
        would_gate_exempt: {type: boolean}
        gate_exempt: {type: boolean}
        review_required: {type: boolean}
        evidence_ref: {type: string}
        decided_by: {type: string}
        decision_rationale: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
    AITriageReviewClaimRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: {type: integer, minimum: 1}
    AITriageReviewDecisionRequest:
      type: object
      required: [decision, rationale, version]
      additionalProperties: false
      properties:
        decision: {type: string, enum: [accept, reject]}
        rationale: {type: string, minLength: 3, maxLength: 4000}
        version: {type: integer, minimum: 1}

    BusinessAsset:
      type: object
      required: [ID, TenantID, Key, Name, Type, Criticality, Lifecycle, Owner, Version, Audit]
      properties:
        ID: {type: string}
        TenantID: {type: string}
        Key: {type: string, maxLength: 128}
        Name: {type: string, maxLength: 256}
        Description: {type: string, maxLength: 4000}
        Type: {type: string, enum: [product, application, system, business_service]}
        Criticality: {type: string, enum: [critical, high, medium, low]}
        Lifecycle: {type: string, enum: [draft, active, decommissioning, retired]}
        Owner: {type: string, maxLength: 256}
        Metadata: {type: object, additionalProperties: {type: string}}
        Version: {type: integer, minimum: 1}
        Audit: {type: object}
    CreateBusinessAssetRequest:
      type: object
      required: [key, name, type, criticality, owner]
      properties:
        key: {type: string, minLength: 1, maxLength: 128}
        name: {type: string, minLength: 1, maxLength: 256}
        description: {type: string, maxLength: 4000}
        type: {type: string, enum: [product, application, system, business_service]}
        criticality: {type: string, enum: [critical, high, medium, low]}
        owner: {type: string, minLength: 1, maxLength: 256}
        metadata: {type: object, maxProperties: 32, additionalProperties: {type: string, maxLength: 512}}
    UpdateBusinessAssetRequest:
      allOf:
      - {$ref: '#/components/schemas/CreateBusinessAssetRequest'}
      - type: object
        required: [version]
        properties:
          version: {type: integer, minimum: 1}
          lifecycle: {type: string, enum: [draft, active, decommissioning, retired]}
    BusinessAssetPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/BusinessAsset'}}
        total: {type: integer, minimum: 0}
        limit: {type: integer}
        offset: {type: integer}
    AssetMembership:
      type: object
      required: [id, role, provenance]
      properties:
        id: {type: string}
        role: {type: string, enum: [primary, supporting, dependency]}
        provenance: {type: string, maxLength: 256}
    AssetMemberships:
      type: object
      required: [items]
      properties:
        items: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/AssetMembership'}}
    BusinessAssetReachabilityEvidence:
      type: object
      required: [judgment_id, state, tier, confidence, status, observed_at]
      properties:
        judgment_id: {type: string}
        state: {type: string, enum: [reachable, not_reachable, unknown]}
        tier: {type: string, enum: [tier-0, tier-1, tier-1.5, tier-2]}
        confidence: {type: integer, minimum: 0, maximum: 100}
        path: {type: array, items: {type: string}}
        status: {type: string}
        observed_at: {type: string, format: date-time}
    BusinessAssetReachability:
      type: object
      required: [state, tier, confidence, source, history]
      properties:
        state: {type: string, enum: [reachable, not_reachable, unknown]}
        tier: {type: string, enum: [tier-0, tier-1, tier-1.5, tier-2]}
        confidence: {type: integer, minimum: 0, maximum: 100}
        path: {type: array, items: {type: string}}
        status: {type: string}
        source: {type: string, enum: [none, finding_metadata, judgment, external]}
        history: {type: array, items: {$ref: '#/components/schemas/BusinessAssetReachabilityEvidence'}}
    BusinessAssetFindingProvenance:
      type: object
      required: [ToolName, ToolVersion, RuleID, SourceDigest, IngestedBy, IngestedAt]
      properties:
        ToolName: {type: string}
        ToolVersion: {type: string}
        RuleID: {type: string}
        SourceDigest: {type: string}
        IngestedBy: {type: string}
        IngestedAt: {type: string, format: date-time}
    BusinessAssetFinding:
      type: object
      required: [finding, external, suppressed_by_tool, reachability, engagement_id, engagement_name]
      properties:
        finding: {$ref: '#/components/schemas/Finding'}
        external: {type: boolean}
        can_self_promote: {type: boolean, description: Present for imported findings and always false}
        suppressed_by_tool: {type: boolean}
        provenance: {$ref: '#/components/schemas/BusinessAssetFindingProvenance'}
        reachability: {$ref: '#/components/schemas/BusinessAssetReachability'}
        engagement_id: {type: string}
        engagement_name: {type: string}
    BusinessAssetCoverage:
      type: object
      required: [rows, counts, freshness_target_days]
      properties:
        rows: {type: array, items: {type: object}}
        counts: {type: object, additionalProperties: {type: integer}}
        freshness_target_days: {type: integer, minimum: 1}
    BusinessAssetPosture:
      type: object
      required: [rating, explanation, finding_counts, coverage_counts]
      properties:
        rating: {type: string, enum: [good, attention, high_risk, critical, unknown]}
        explanation: {type: string}
        finding_counts: {type: object, additionalProperties: {type: integer}}
        coverage_counts: {type: object, additionalProperties: {type: integer}}
    BusinessAssetHistoryItem:
      type: object
      required: [engagement_id, name, status, scope_count, finding_count, retest_count, updated_at]
      properties:
        engagement_id: {type: string}
        name: {type: string}
        status: {type: string}
        authorized_from: {type: [string, 'null'], format: date-time}
        authorized_to: {type: [string, 'null'], format: date-time}
        scope_count: {type: integer, minimum: 0}
        finding_count: {type: integer, minimum: 0}
        retest_count: {type: integer, minimum: 0}
        updated_at: {type: string, format: date-time}

    ProjectCodeCapability:
      type: object
      required: [available]
      properties:
        available: {type: boolean}
        reason:
          type: string
          enum: [not_retained, capture_failed, first_analysis, no_comparable_base, unsupported_target, limit_exceeded, binary, non_utf8]

    ProjectCodeCapabilities:
      type: object
      required: [source, comparison, unified_diff, split_diff, highlighting]
      properties:
        source: {$ref: '#/components/schemas/ProjectCodeCapability'}
        comparison: {$ref: '#/components/schemas/ProjectCodeCapability'}
        unified_diff: {$ref: '#/components/schemas/ProjectCodeCapability'}
        split_diff: {$ref: '#/components/schemas/ProjectCodeCapability'}
        highlighting: {$ref: '#/components/schemas/ProjectCodeCapability'}

    ProjectCodeRevision:
      type: object
      required: [artifact_digest]
      properties:
        ref: {type: string}
        commit: {type: string}
        artifact_digest: {type: string, description: Immutable manifest SHA-256 identity}

    ProjectCodeSourceFile:
      type: object
      required: [path, bytes, lines, generated, available]
      properties:
        path: {type: string}
        digest: {type: string}
        bytes: {type: integer, minimum: 0}
        lines: {type: integer, minimum: 0}
        generated: {type: boolean}
        available: {type: boolean}
        reason: {type: string}

    ProjectCodeLineRange:
      type: object
      required: [start, end]
      properties:
        start: {type: integer, minimum: 1}
        end: {type: integer, minimum: 1}

    ProjectCodeDiffRow:
      type: object
      required: [kind, text]
      properties:
        kind: {type: string, enum: [context, added, removed]}
        old_line: {type: integer, minimum: 1}
        new_line: {type: integer, minimum: 1}
        text: {type: string}
        no_final_newline: {type: boolean}

    ProjectCodeDiffHunk:
      type: object
      required: [old_start, old_lines, new_start, new_lines, rows]
      properties:
        old_start: {type: integer, minimum: 0}
        old_lines: {type: integer, minimum: 0}
        new_start: {type: integer, minimum: 0}
        new_lines: {type: integer, minimum: 0}
        rows:
          type: array
          items: {$ref: '#/components/schemas/ProjectCodeDiffRow'}

    ProjectCodeFileChange:
      type: object
      required: [status, binary]
      properties:
        status: {type: string, enum: [added, modified, deleted, renamed, copied, mode_only]}
        old_path: {type: string}
        new_path: {type: string}
        binary: {type: boolean}
        mode_old: {type: string}
        mode_new: {type: string}
        added:
          type: array
          items: {$ref: '#/components/schemas/ProjectCodeLineRange'}
        removed:
          type: array
          items: {$ref: '#/components/schemas/ProjectCodeLineRange'}
        modified:
          type: array
          items: {$ref: '#/components/schemas/ProjectCodeLineRange'}
        hunks:
          type: array
          items: {$ref: '#/components/schemas/ProjectCodeDiffHunk'}

    ProjectCodeFile:
      type: object
      required: [path, status, lines, finding_count, changed_line_count, binary, generated, source_available]
      properties:
        path: {type: string}
        old_path: {type: string}
        status: {type: string, enum: [unchanged, added, modified, deleted, renamed, copied, mode_only]}
        language: {type: string}
        lines: {type: integer, minimum: 0}
        finding_count: {type: integer, minimum: 0}
        changed_line_count: {type: integer, minimum: 0}
        binary: {type: boolean}
        generated: {type: boolean}
        source_available: {type: boolean}
        source_reason: {type: string}

    ProjectCodeFilesResponse:
      type: object
      required: [analysis_id, head, capabilities, files]
      properties:
        analysis_id: {type: string}
        base: {$ref: '#/components/schemas/ProjectCodeRevision'}
        head: {$ref: '#/components/schemas/ProjectCodeRevision'}
        capabilities: {$ref: '#/components/schemas/ProjectCodeHTTPMetadata'}
        files:
          type: array
          items: {$ref: '#/components/schemas/ProjectCodeFile'}

    ProjectCodeFinding:
      type: object
      required: [id, kind, severity, detection_status, location, new]
      properties:
        id: {type: string}
        kind: {type: string, enum: [issue, hotspot]}
        rule_key: {type: string}
        rule_name: {type: string}
        type: {type: string, enum: [bug, vulnerability, code_smell, security_hotspot]}
        severity: {type: string}
        detection_status: {type: string}
        current_status: {type: string, description: Current mutable issue or hotspot triage state}
        message: {type: string}
        new: {type: boolean}
        location:
          type: object
          required: [file, start_line, end_line]
          properties:
            file: {type: string}
            start_line: {type: integer, minimum: 1}
            end_line: {type: integer, minimum: 1}
            start_column: {type: integer, minimum: 0, description: UTF-16 display column}
            end_column: {type: integer, minimum: 0, description: UTF-16 display column, end-exclusive}

    ProjectCodeLine:
      type: object
      required: [number, content, change, duplicated, coverage]
      properties:
        number: {type: integer, minimum: 1}
        content: {type: string}
        change: {type: string, enum: [unchanged, addition]}
        duplicated: {type: boolean}
        coverage: {type: [string, 'null'], enum: [covered, uncovered, partial, null]}

    ProjectCodeFileView:
      type: object
      required: [analysis_id, head, file, from_line, to_line, total_lines, lines, findings]
      properties:
        analysis_id: {type: string}
        base: {$ref: '#/components/schemas/ProjectCodeRevision'}
        head: {$ref: '#/components/schemas/ProjectCodeRevision'}
        file: {$ref: '#/components/schemas/ProjectCodeFile'}
        from_line: {type: integer, minimum: 1}
        to_line: {type: integer, minimum: 0}
        total_lines: {type: integer, minimum: 0}
        lines:
          type: array
          items: {$ref: '#/components/schemas/ProjectCodeLine'}
        findings:
          type: array
          items: {$ref: '#/components/schemas/ProjectCodeFinding'}

    ProjectCodeFileResponse:
      allOf:
      - $ref: '#/components/schemas/ProjectCodeFileView'
      - type: object
        required: [capabilities]
        properties:
          capabilities: {$ref: '#/components/schemas/ProjectCodeHTTPMetadata'}

    ProjectCodeHTTPMetadata:
      type: object
      required: [source, unified_diff, split_diff, line_coverage]
      properties:
        source: {type: boolean}
        unified_diff: {type: boolean}
        split_diff: {type: boolean}
        line_coverage: {type: boolean}

    ProjectCodeDiffView:
      type: object
      required: [analysis_id, head, path, view, context_truncated, change]
      properties:
        analysis_id: {type: string}
        base: {$ref: '#/components/schemas/ProjectCodeRevision'}
        head: {$ref: '#/components/schemas/ProjectCodeRevision'}
        path: {type: string}
        view: {type: string, enum: [unified, split]}
        context_truncated: {type: boolean, description: True when unchanged context outside the requested window was omitted}
        change: {$ref: '#/components/schemas/ProjectCodeFileChange'}
        base_file: {$ref: '#/components/schemas/ProjectCodeSourceFile'}
        source_file: {$ref: '#/components/schemas/ProjectCodeSourceFile'}

    ProjectCodeDiffResponse:
      type: object
      required: [capabilities, diff]
      properties:
        capabilities: {$ref: '#/components/schemas/ProjectCodeCapabilities'}
        diff: {$ref: '#/components/schemas/ProjectCodeDiffView'}

    AupStatus:
      type: object
      properties:
        version: {type: string}
        text: {type: string}
        accepted: {type: boolean}

    ScopeTargetRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [repo, domain, host, url, image, cidr]
        value: {type: string}

    CreateEngagementRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, example: acme-q3-2026}
        client: {type: string, example: Acme Corp}
        in_scope:
          type: array
          items: {$ref: "#/components/schemas/ScopeTargetRequest"}
        out_of_scope:
          type: array
          items: {$ref: "#/components/schemas/ScopeTargetRequest"}

    Engagement:
      type: object
      description: Serialized from the domain struct (PascalCase keys).
      properties:
        ID: {type: string}
        Name: {type: string}
        Client: {type: string}
        Status: {type: string, enum: [draft, active, completed, archived]}
        Scope:
          type: object
          properties:
            InScope:
              type: array
              items:
                type: object
                properties:
                  Kind: {type: string}
                  Value: {type: string}
            OutOfScope:
              type: array
              items:
                type: object
                properties:
                  Kind: {type: string}
                  Value: {type: string}
        AuthorizedFrom: {type: [string, "null"], format: date-time}
        AuthorizedTo: {type: [string, "null"], format: date-time}

    CreateManualFindingRequest:
      type: object
      required: [title, severity]
      properties:
        title: {type: string}
        description: {type: string}
        severity: {type: string, enum: [critical, high, medium, low, info, unknown]}
        cvss_vector: {type: string}
        cwe: {type: string}
        asset_id:
          type: string
          description: Authoritative asset ID; when supplied it is validated and creates an observed manual attribution.

    AgentProposeFindingInput:
      type: object
      required: [title, description, severity]
      properties:
        title: {type: string}
        description: {type: string}
        severity: {type: string, enum: [critical, high, medium, low, info]}
        cvss_vector: {type: string}
        cwe: {type: string}
        asset_id: {type: string, description: Required and validated when attribution is configured; optional for legacy deployments.}

    AgentProposeHypothesisInput:
      type: object
      required: [title, description, constituent_ids]
      properties:
        title: {type: string}
        description: {type: string}
        constituent_ids: {type: array, minItems: 2, items: {type: string}}
        severity: {type: string, enum: [critical, high, medium, low, info]}
        asset_id: {type: string, description: Explicit authoritative asset ID; otherwise a configured attributor requires one unambiguous shared constituent binding.}

    AgentProposeJudgmentClaimInput:
      type: object
      properties:
        asset_id: {type: string, description: Explicit asset attribution for standalone threat claims or SAST claims; subject-finding SAST claims inherit their binding when attribution is configured.}
      description: Applies to agent proposal claims. Manual, SARIF, exploitation/hypothesis, and judgment proposals never infer an arbitrary asset from prose.

    AttackPathResult:
      type: object
      required: [paths, bounds]
      properties:
        paths:
          type: array
          items: {$ref: "#/components/schemas/AttackPath"}
        bounds: {$ref: "#/components/schemas/AttackPathBounds"}

    AttackPathBounds:
      type: object
      required: [maxLength, maxPaths, maxDuration, truncated, lengthHit, pathsHit, targetPathsHit, findingPathsHit, wallClockHit]
      properties:
        maxLength: {type: integer, minimum: 1}
        maxPaths: {type: integer, minimum: 1}
        maxDuration: {type: integer, description: Go duration serialized as nanoseconds}
        truncated: {type: boolean}
        lengthHit: {type: boolean}
        pathsHit: {type: boolean}
        targetPathsHit: {type: boolean}
        findingPathsHit: {type: boolean}
        wallClockHit: {type: boolean}

    AttackPath:
      type: object
      required: [id, nodes, steps, edges, uncertainties, confident]
      properties:
        id: {type: string, description: Stable SHA-256 identity of the path inputs}
        nodes:
          type: array
          items: {$ref: "#/components/schemas/AttackPathNode"}
        steps:
          type: array
          items: {$ref: "#/components/schemas/AttackPathStep"}
        edges:
          type: array
          items: {$ref: "#/components/schemas/AttackPathLogicalEdge"}
        uncertainties:
          type: array
          items: {$ref: "#/components/schemas/AttackPathUncertainty"}
        confident: {type: boolean}

    AttackPathNode:
      type: object
      description: Exactly one of asset or finding is present.
      properties:
        asset:
          type: object
          required: [asset]
          properties:
            asset: {$ref: "#/components/schemas/AttackPathAsset"}
        finding:
          type: object
          required: [input]
          properties:
            input: {$ref: "#/components/schemas/AttackPathFindingInput"}

    AttackPathAsset:
      type: object
      required: [ID, TenantID, Kind, Key, Name]
      properties:
        ID: {type: string}
        TenantID: {type: string}
        Kind: {type: string, enum: [host, workload, image, cloud_account, storage, exposure, identity, namespace, cluster, repository]}
        Key: {type: string}
        Name: {type: string}
        Attributes: {type: object, additionalProperties: {type: string}}

    AttackPathFindingInput:
      type: object
      required: [target, finding, reachability, tier, provenance, confirmed, external]
      properties:
        target:
          type: object
          required: [ID, Kind]
          properties:
            ID: {type: string}
            Kind: {type: string, enum: [canonical, imported]}
        finding: {$ref: "#/components/schemas/Finding"}
        reachability: {type: string, enum: ["", reachable, not_reachable, unknown]}
        tier: {type: string, enum: ["", tier-0, tier-1, tier-1.5, tier-2]}
        provenance: {type: string}
        confirmed: {type: boolean}
        external: {type: boolean, description: True only for an immutable imported finding; the embedded finding retains only shared risk comparison fields.}
        importedProvenance:
          $ref: "#/components/schemas/AttackPathImportedFindingProvenance"
      description: The embedded finding's KEV, RiskScore, CVSSVector, and Severity are the existing comparison components; no weighted path score is emitted.

    AttackPathImportedFindingProvenance:
      type: object
      required: [ToolName, ToolVersion, RuleID, SourceDigest, IngestedBy, IngestedAt]
      description: Immutable provenance for an external imported finding. Present only when target.Kind is imported.
      properties:
        ToolName: {type: string}
        ToolVersion: {type: string}
        RuleID: {type: string}
        SourceDigest: {type: string}
        IngestedBy: {type: string}
        IngestedAt: {type: string, format: date-time}

    AttackPathLogicalEdge:
      type: object
      required: [from, to, kind, evidence, observed, finding]
      properties:
        from: {type: string}
        to: {type: string}
        toTargetKind: {type: string, enum: [canonical, imported], description: Finding source table when finding is true.}
        kind: {type: string, enum: [runs, exposes, depends_on, can_assume, reaches, affected_by, mounts, member_of]}
        evidence:
          type: array
          items: {$ref: "#/components/schemas/AttackPathEvidence"}
        observed: {type: boolean}
        finding: {type: boolean}

    AttackPathStep:
      type: object
      required: [from, to, kind, evidence, observed, toFinding]
      properties:
        from: {type: string}
        to: {type: string}
        toTargetKind: {type: string, enum: [canonical, imported], description: Finding source table when finding is true.}
        kind: {type: string, enum: [runs, exposes, depends_on, can_assume, reaches, affected_by, mounts, member_of]}
        evidence:
          type: array
          items: {$ref: "#/components/schemas/AttackPathEvidence"}
        observed: {type: boolean}
        toFinding: {type: boolean}

    AttackPathEvidence:
      type: object
      required: [producer, provenance, confidence]
      properties:
        producer: {type: string, description: Binding producer; empty only for base fleet-edge evidence.}
        provenance: {type: string, description: Immutable evidence provenance.}
        confidence: {type: string, enum: [observed, inferred], description: Required producer-supplied evidence confidence; omitted confidence is invalid.}

    AttackPathUncertainty:
      type: string
      description: inferred_edge is suffixed with its one-based step index.
      pattern: '^(inferred_edge:[1-9][0-9]*|missing_reachability|unknown_reachability|unconfirmed_reachability)$'

    AttackPathScoreComponents:
      type: object
      description: Existing flat finding risk components used for path comparison; no weighted path score is emitted.
      properties:
        Severity: {type: string, enum: [critical, high, medium, low, info, unknown]}
        CVSSVector: {type: string}
        KEV: {type: boolean}
        RiskScore: {type: number}

    Finding:
      allOf:
      - $ref: "#/components/schemas/AttackPathScoreComponents"
      - type: object
        description: Serialized from the domain struct (PascalCase keys).
        properties:
          ID: {type: string}
          EngagementID: {type: string}
          Title: {type: string}
          Description: {type: string}
          CWE: {type: string}
          Status: {type: string, enum: [open, triage, confirmed, false_positive, remediated]}
          DedupKey: {type: string}
          EvidenceScore: {type: integer}
          Kind: {type: string, enum: [sca, recon, exploitation, manual, sast, secret, misconfig, dast, threat, hypothesis, quality, reliability]}
          RuleKey: {type: string}
          SourceLocation:
            type: [object, "null"]
            properties:
              File: {type: string}
              StartLine: {type: integer}
              EndLine: {type: integer}
          Assignee: {type: string}
          Version: {type: integer}
          Sources: {type: array, items: {type: string}}
          Confidence: {type: string}
          Class: {type: string}
          Scope: {type: string}
          Reachability: {type: string}
          Impact: {type: string}
          Priority: {type: integer}
          ClassReachability: {type: string}
          ProposedBy: {type: string}
          Audit:
            type: object
            properties:
              CreatedAt: {type: string, format: date-time}
              UpdatedAt: {type: string, format: date-time}
              CreatedBy: {type: string}
              UpdatedBy: {type: string}

    ScanRequest:
      type: object
      required: [engagement_id, target]
      properties:
        engagement_id: {type: string}
        target: {type: string, description: path / git URL / archive / image ref}
        kind:
          type: string
          enum: [local, git, archive, image]
          default: local

    ScanResult:
      type: object
      properties:
        target: {type: string}
        languages:
          type: array
          items: {type: object}
        sbom:
          type: object
          description: SBOM with Components and Dependencies (PascalCase keys).
        vulnerabilities:
          type: array
          items: {type: object}
        licenses:
          type: array
          items: {type: object}
        findings:
          type: array
          items: {$ref: "#/components/schemas/Finding"}
        tool_versions:
          type: object
          additionalProperties: {type: string}
        vuln_db_snapshot: {type: string}

    ProjectOverviewState:
      type: string
      enum: [not_analyzed, analyzed]

    ProjectOverviewMetricAvailability:
      type: string
      enum: [available, unavailable, not_supplied, not_applicable]

    ProjectOverviewUnavailableReason:
      type: string
      enum:
      - no_analysis
      - rating_not_available
      - issue_lifecycle_not_available
      - security_hotspots_not_available
      - changed_line_metrics_not_available
      - coverage_not_supplied
      - no_executable_lines
      - duplication_not_available

    ProjectOverviewGrade:
      type: string
      enum: [A, B, C, D, E]

    ProjectOverviewGateStatus:
      type: string
      enum: [passed, failed, incomplete]

    ProjectOverviewGateOperator:
      type: string
      enum: ["<=", ">=", "==", "<", ">"]

    ProjectOverviewGateSource:
      type: string
      description: >
        Supported immutable gate policy sources currently produced by the
        application. Legacy empty source values are represented as null.
      enum: [default, repository, managed]

    ProjectOverviewGateMetric:
      type: string
      enum:
      - new_critical
      - new_high
      - new_medium
      - new_secret
      - new_vulnerability
      - new_issues
      - total_critical
      - duplication_density
      - coverage
      - security_rating
      - reliability_rating
      - maintainability_rating

      - security_hotspots_reviewed
      - new_security_hotspots_reviewed
    ProjectOverview:
      oneOf:
      - $ref: "#/components/schemas/ProjectOverviewNotAnalyzed"
      - $ref: "#/components/schemas/ProjectOverviewAnalyzed"

    ProjectOverviewNotAnalyzed:
      type: object
      required: [state, project, latest_analysis, gate, issue_summary, lenses]
      properties:
        state:
          type: string
          enum: [not_analyzed]
        project: {$ref: "#/components/schemas/ProjectOverviewProject"}
        latest_analysis:
          type: "null"
        gate:
          type: "null"
        issue_summary: {$ref: "#/components/schemas/ProjectOverviewIssueSummary"}
        lenses: {$ref: "#/components/schemas/ProjectOverviewLenses"}

    ProjectOverviewAnalyzed:
      type: object
      required: [state, project, latest_analysis, gate, issue_summary, lenses]
      properties:
        state:
          type: string
          enum: [analyzed]
        project: {$ref: "#/components/schemas/ProjectOverviewProject"}
        latest_analysis: {$ref: "#/components/schemas/ProjectOverviewAnalysis"}
        gate: {$ref: "#/components/schemas/ProjectOverviewGate"}
        issue_summary: {$ref: "#/components/schemas/ProjectOverviewIssueSummary"}
        lenses: {$ref: "#/components/schemas/ProjectOverviewLenses"}

    ProjectOverviewProject:
      type: object
      required: [key, name]
      properties:
        key: {type: string, minLength: 1}
        name: {type: string, minLength: 1}

    ProjectOverviewAnalysis:
      type: object
      required: [id, created_at, source_ref, source_commit, new_code]
      properties:
        id: {type: string, minLength: 1}
        created_at: {type: string, format: date-time}
        source_ref: {type: string}
        source_commit: {type: string}
        new_code: {$ref: "#/components/schemas/ProjectOverviewNewCodePeriod"}

    ProjectOverviewNewCodePeriod:
      oneOf:
      - type: object
        required: [first_analysis, has_baseline, baseline_analysis_id]
        properties:
          first_analysis:
            type: boolean
            const: true
          has_baseline:
            type: boolean
            const: false
          baseline_analysis_id:
            type: "null"
      - type: object
        required: [first_analysis, has_baseline, baseline_analysis_id]
        properties:
          first_analysis:
            type: boolean
            const: false
          has_baseline:
            type: boolean
            const: true
          baseline_analysis_id:
            type: string
            minLength: 1

    ProjectOverviewGate:
      type: object
      required: [status, key, name, source, failed_conditions]
      properties:
        status: {$ref: "#/components/schemas/ProjectOverviewGateStatus"}
        key:
          type: [string, "null"]
        name:
          type: [string, "null"]
        source:
          anyOf:
          - $ref: "#/components/schemas/ProjectOverviewGateSource"
          - type: "null"
        failed_conditions:
          type: array
          items: {$ref: "#/components/schemas/ProjectOverviewGateCondition"}

    ProjectOverviewGateCondition:
      type: object
      required: [metric, operator, threshold, actual]
      properties:
        metric: {$ref: "#/components/schemas/ProjectOverviewGateMetric"}
        operator: {$ref: "#/components/schemas/ProjectOverviewGateOperator"}
        threshold: {type: number}
        actual: {type: number}

    ProjectOverviewIssueSummary:
      type: object
      required: [new_code_total, accepted_overall_total]
      properties:
        new_code_total:
          description: Total findings newly introduced in the immutable New Code snapshot.
          $ref: "#/components/schemas/ProjectOverviewCountMetric"
        accepted_overall_total:
          description: Total accepted findings across the whole project. Unavailable
            until issue lifecycle data lands.
          $ref: "#/components/schemas/ProjectOverviewCountMetric"

    ProjectOverviewLenses:
      type: object
      required: [overall, new_code]
      properties:
        overall: {$ref: "#/components/schemas/ProjectOverviewLens"}
        new_code: {$ref: "#/components/schemas/ProjectOverviewLens"}

    ProjectOverviewLens:
      type: object
      required: [security, reliability, maintainability, security_hotspots_reviewed,
        coverage, duplications]
      properties:
        security: {$ref: "#/components/schemas/ProjectOverviewRatingMetric"}
        reliability: {$ref: "#/components/schemas/ProjectOverviewRatingMetric"}
        maintainability: {$ref: "#/components/schemas/ProjectOverviewRatingMetric"}
        security_hotspots_reviewed: {$ref: "#/components/schemas/ProjectOverviewPercentageMetric"}
        coverage: {$ref: "#/components/schemas/ProjectOverviewPercentageMetric"}
        duplications: {$ref: "#/components/schemas/ProjectOverviewPercentageMetric"}

    ProjectOverviewRatingMetric:
      type: object
      required: [availability, grade, unavailable_reason]
      properties:
        availability: {$ref: "#/components/schemas/ProjectOverviewMetricAvailability"}
        grade:
          anyOf:
          - $ref: "#/components/schemas/ProjectOverviewGrade"
          - type: "null"
        unavailable_reason:
          anyOf:
          - $ref: "#/components/schemas/ProjectOverviewUnavailableReason"
          - type: "null"

    ProjectOverviewPercentageMetric:
      type: object
      required: [availability, value, unavailable_reason]
      properties:
        availability: {$ref: "#/components/schemas/ProjectOverviewMetricAvailability"}
        value:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        unavailable_reason:
          anyOf:
          - $ref: "#/components/schemas/ProjectOverviewUnavailableReason"
          - type: "null"

        grade:
          type: string
    ProjectOverviewCountMetric:
      type: object
      required: [availability, value, unavailable_reason]
      properties:
        availability: {$ref: "#/components/schemas/ProjectOverviewMetricAvailability"}
        value:
          type: [integer, "null"]
          minimum: 0
        unavailable_reason:
          anyOf:
          - $ref: "#/components/schemas/ProjectOverviewUnavailableReason"
          - type: "null"

    ProjectHotspotStatus:
      type: string
      enum: [to_review, acknowledged, fixed, safe]

    ProjectHotspotSeverity:
      type: string
      enum: [unknown, info, low, medium, high, critical]

    ProjectHotspot:
      type: object
      required:
      - id
      - rule_key
      - rule_name
      - title
      - description
      - severity
      - finding_kind
      - cwe
      - location
      - status
      - version
      - first_seen_analysis_id
      - last_seen_analysis_id
      - first_seen_at
      - last_seen_at
      properties:
        id: {type: string}
        rule_key: {type: string}
        rule_name: {type: string}
        title: {type: string}
        description: {type: string}
        severity: {$ref: "#/components/schemas/ProjectHotspotSeverity"}
        finding_kind: {type: string}
        cwe: {type: string}
        location: {type: string}
        status: {$ref: "#/components/schemas/ProjectHotspotStatus"}
        version: {type: integer, minimum: 1}
        first_seen_analysis_id: {type: string}
        last_seen_analysis_id: {type: string}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}

    ProjectHotspotCursor:
