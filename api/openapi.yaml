      required: [source, unified_diff, split_diff, line_coverage]
      properties:
        source: {type: boolean}
        unified_diff: {type: boolean}
        split_diff: {type: boolean}
        line_coverage: {type: boolean}

    ProjectCodeDiffView:
      type: object
      required: [analysis_id, head, path, view, context_truncated, change]
      properties:
        analysis_id: {type: string}
        base: {$ref: '#/components/schemas/ProjectCodeRevision'}
        head: {$ref: '#/components/schemas/ProjectCodeRevision'}
        path: {type: string}
        view: {type: string, enum: [unified, split]}
        context_truncated: {type: boolean, description: True when unchanged context outside the requested window was omitted}
        change: {$ref: '#/components/schemas/ProjectCodeFileChange'}
        base_file: {$ref: '#/components/schemas/ProjectCodeSourceFile'}
        source_file: {$ref: '#/components/schemas/ProjectCodeSourceFile'}

    ProjectCodeDiffResponse:
      type: object
      required: [capabilities, diff]
      properties:
        capabilities: {$ref: '#/components/schemas/ProjectCodeCapabilities'}
        diff: {$ref: '#/components/schemas/ProjectCodeDiffView'}

    AupStatus:
      type: object
      properties:
        version: {type: string}
        text: {type: string}
        accepted: {type: boolean}

    ScopeTargetRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [repo, domain, host, url, image, cidr, cloud_account]
        value: {type: string}

    CreateEngagementRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, example: acme-q3-2026}
        client: {type: string, example: Acme Corp}
        in_scope:
          type: array
          items: {$ref: "#/components/schemas/ScopeTargetRequest"}
        out_of_scope:
          type: array
          items: {$ref: "#/components/schemas/ScopeTargetRequest"}

    Engagement:
      type: object
      description: Serialized from the domain struct (PascalCase keys).
      properties:
        ID: {type: string}
        Name: {type: string}
        Client: {type: string}
        Status: {type: string, enum: [draft, active, completed, archived]}
        Scope:
          type: object
          properties:
            InScope:
              type: array
              items:
                type: object
                properties:
                  Kind: {type: string}
                  Value: {type: string}
            OutOfScope:
              type: array
              items:
                type: object
                properties:
                  Kind: {type: string}
                  Value: {type: string}
        AuthorizedFrom: {type: [string, "null"], format: date-time}
        AuthorizedTo: {type: [string, "null"], format: date-time}

    CreateManualFindingRequest:
      type: object
      required: [title, severity]
      properties:
        title: {type: string}
        description: {type: string}
        severity: {type: string, enum: [critical, high, medium, low, info, unknown]}
        cvss_vector: {type: string}
        cwe: {type: string}
        asset_id:
          type: string
          description: Authoritative asset ID; when supplied it is validated and creates an observed manual attribution.

    AgentProposeFindingInput:
      type: object
      required: [title, description, severity]
      properties:
        title: {type: string}
        description: {type: string}
        severity: {type: string, enum: [critical, high, medium, low, info]}
        cvss_vector: {type: string}
        cwe: {type: string}
        asset_id: {type: string, description: Required and validated when attribution is configured; optional for legacy deployments.}

    AgentProposeHypothesisInput:
      type: object
      required: [title, description, constituent_ids]
      properties:
        title: {type: string}
        description: {type: string}
        constituent_ids: {type: array, minItems: 2, items: {type: string}}
        severity: {type: string, enum: [critical, high, medium, low, info]}
        asset_id: {type: string, description: Explicit authoritative asset ID; otherwise a configured attributor requires one unambiguous shared constituent binding.}

    AgentProposeJudgmentClaimInput:
      type: object
      properties:
        asset_id: {type: string, description: Explicit asset attribution for standalone threat claims or SAST claims; subject-finding SAST claims inherit their binding when attribution is configured.}
      description: Applies to agent proposal claims. Manual, SARIF, exploitation/hypothesis, and judgment proposals never infer an arbitrary asset from prose.

    AttackPathResult:
      type: object
      required: [paths, bounds]
      properties:
        paths:
          type: array
          items: {$ref: "#/components/schemas/AttackPath"}
        bounds: {$ref: "#/components/schemas/AttackPathBounds"}

    AttackPathBounds:
      type: object
      required: [maxLength, maxPaths, maxDuration, truncated, lengthHit, pathsHit, targetPathsHit, findingPathsHit, wallClockHit]
      properties:
        maxLength: {type: integer, minimum: 1}
        maxPaths: {type: integer, minimum: 1}
        maxDuration: {type: integer, description: Go duration serialized as nanoseconds}
        truncated: {type: boolean}
        lengthHit: {type: boolean}
        pathsHit: {type: boolean}
        targetPathsHit: {type: boolean}
        findingPathsHit: {type: boolean}
        wallClockHit: {type: boolean}

    AttackPath:
      type: object
      required: [id, nodes, steps, edges, uncertainties, confident]
      properties:
        id: {type: string, description: Stable SHA-256 identity of the path inputs}
        nodes:
          type: array
          items: {$ref: "#/components/schemas/AttackPathNode"}
        steps:
          type: array
          items: {$ref: "#/components/schemas/AttackPathStep"}
        edges:
          type: array
          items: {$ref: "#/components/schemas/AttackPathLogicalEdge"}
        uncertainties:
          type: array
          items: {$ref: "#/components/schemas/AttackPathUncertainty"}
        confident: {type: boolean}

    AttackPathNode:
      type: object
      description: Exactly one of asset or finding is present.
      properties:
        asset:
          type: object
          required: [asset]
          properties:
            asset: {$ref: "#/components/schemas/AttackPathAsset"}
        finding:
          type: object
          required: [input]
          properties:
            input: {$ref: "#/components/schemas/AttackPathFindingInput"}

    AttackPathAsset:
      type: object
      required: [ID, TenantID, Kind, Key, Name]
      properties:
        ID: {type: string}
        TenantID: {type: string}
        Kind: {type: string, enum: [host, workload, image, cloud_account, storage, exposure, identity, namespace, cluster, repository]}
        Key: {type: string}
        Name: {type: string}
        Attributes: {type: object, additionalProperties: {type: string}}

    AttackPathFindingInput:
      type: object
      required: [target, finding, reachability, tier, provenance, confirmed, external]
      properties:
        target:
          type: object
          required: [ID, Kind]
          properties:
            ID: {type: string}
            Kind: {type: string, enum: [canonical, imported]}
        finding: {$ref: "#/components/schemas/Finding"}
        reachability: {type: string, enum: ["", reachable, not_reachable, unknown]}
        tier: {type: string, enum: ["", tier-0, tier-1, tier-1.5, tier-2]}
        provenance: {type: string}
        confirmed: {type: boolean}
        external: {type: boolean, description: True only for an immutable imported finding; the embedded finding retains only shared risk comparison fields.}
        importedProvenance:
          $ref: "#/components/schemas/AttackPathImportedFindingProvenance"
      description: The embedded finding's KEV, RiskScore, CVSSVector, and Severity are the existing comparison components; no weighted path score is emitted.

    AttackPathImportedFindingProvenance:
      type: object
      required: [ToolName, ToolVersion, RuleID, SourceDigest, IngestedBy, IngestedAt]
      description: Immutable provenance for an external imported finding. Present only when target.Kind is imported.
      properties:
        ToolName: {type: string}
        ToolVersion: {type: string}
        RuleID: {type: string}
        SourceDigest: {type: string}
        IngestedBy: {type: string}
        IngestedAt: {type: string, format: date-time}

    AttackPathLogicalEdge:
      type: object
      required: [from, to, kind, evidence, observed, finding]
      properties:
        from: {type: string}
        to: {type: string}
        toTargetKind: {type: string, enum: [canonical, imported], description: Finding source table when finding is true.}
        kind: {type: string, enum: [runs, exposes, depends_on, can_assume, reaches, affected_by, mounts, member_of]}
        evidence:
          type: array
          items: {$ref: "#/components/schemas/AttackPathEvidence"}
        observed: {type: boolean}
        finding: {type: boolean}

    AttackPathStep:
      type: object
      required: [from, to, kind, evidence, observed, toFinding]
      properties:
        from: {type: string}
        to: {type: string}
        toTargetKind: {type: string, enum: [canonical, imported], description: Finding source table when finding is true.}
        kind: {type: string, enum: [runs, exposes, depends_on, can_assume, reaches, affected_by, mounts, member_of]}
        evidence:
          type: array
          items: {$ref: "#/components/schemas/AttackPathEvidence"}
        observed: {type: boolean}
        toFinding: {type: boolean}

    AttackPathEvidence:
      type: object
      required: [producer, provenance, confidence]
      properties:
        producer: {type: string, description: Binding producer; empty only for base fleet-edge evidence.}
        provenance: {type: string, description: Immutable evidence provenance.}
        confidence: {type: string, enum: [observed, inferred], description: Required producer-supplied evidence confidence; omitted confidence is invalid.}

    AttackPathUncertainty:
      type: string
      description: inferred_edge is suffixed with its one-based step index.
      pattern: '^(inferred_edge:[1-9][0-9]*|missing_reachability|unknown_reachability|unconfirmed_reachability)$'

    AttackPathScoreComponents:
      type: object
      description: Existing flat finding risk components used for path comparison; no weighted path score is emitted.
      properties:
        Severity: {type: string, enum: [critical, high, medium, low, info, unknown]}
        CVSSVector: {type: string}
        KEV: {type: boolean}
        RiskScore: {type: number}

    Finding:
      allOf:
      - $ref: "#/components/schemas/AttackPathScoreComponents"
      - type: object
        description: Serialized from the domain struct (PascalCase keys).
        properties:
          ID: {type: string}
          EngagementID: {type: string}
          Title: {type: string}
          Description: {type: string}
          CWE: {type: string}
          Status: {type: string, enum: [open, triage, confirmed, false_positive, remediated]}
          DedupKey: {type: string}
          EvidenceScore: {type: integer}
          Kind: {type: string, enum: [sca, recon, exploitation, manual, sast, secret, misconfig, cloud_posture, dast, threat, hypothesis, quality, reliability]}
          RuleKey: {type: string}
          SourceLocation:
            type: [object, "null"]
            properties:
              File: {type: string}
              StartLine: {type: integer}
              EndLine: {type: integer}
          Assignee: {type: string}
          Version: {type: integer}
          Sources: {type: array, items: {type: string}}
          Confidence: {type: string}
          Class: {type: string}
          Scope: {type: string}
          Reachability: {type: string}
          Impact: {type: string}
          Priority: {type: integer}
          ClassReachability: {type: string}
          ProposedBy: {type: string}
          Audit:
            type: object
            properties:
              CreatedAt: {type: string, format: date-time}
              UpdatedAt: {type: string, format: date-time}
              CreatedBy: {type: string}
              UpdatedBy: {type: string}

    ScanRequest:
      type: object
      required: [engagement_id, target]
      properties:
        engagement_id: {type: string}
        target: {type: string, description: path / git URL / archive / image ref}
        kind:
          type: string
          enum: [local, git, archive, image]
          default: local

    ScanJob:
      type: object
      description: >
        Progress of one asynchronous scan. Debug events carry only metadata and
        counts: never raw tool output, environment values, or unredacted commands.
      properties:
        id: {type: string}
        engagement_id: {type: string}
        target: {type: string}
        kind: {type: string}
        status:
          type: string
          enum: [running, succeeded, failed]
        stage: {type: string}
        progress: {type: integer, minimum: 0, maximum: 100}
        error: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        debug_events:
          type: array
          items: {type: object}

    ScanResult:
      type: object
      properties:
        target: {type: string}
        languages:
          type: array
          items: {type: object}
        sbom:
          type: object
          description: SBOM with Components and Dependencies (PascalCase keys).
        vulnerabilities:
          type: array
          items: {type: object}
        licenses:
          type: array
          items: {type: object}
        findings:
          type: array
          items: {$ref: "#/components/schemas/Finding"}
        tool_versions:
          type: object
          additionalProperties: {type: string}
        vuln_db_snapshot: {type: string}

    ProjectOverviewState:
      type: string
      enum: [not_analyzed, analyzed]

    ProjectOverviewMetricAvailability:
      type: string
      enum: [available, unavailable, not_supplied, not_applicable]

    ProjectOverviewUnavailableReason:
      type: string
      enum:
      - no_analysis
      - rating_not_available
      - issue_lifecycle_not_available
      - security_hotspots_not_available
      - changed_line_metrics_not_available
      - coverage_not_supplied
      - no_executable_lines
      - duplication_not_available

    ProjectOverviewGrade:
      type: string
      enum: [A, B, C, D, E]

    ProjectOverviewGateStatus:
      type: string
      enum: [passed, failed, incomplete]

    ProjectOverviewGateOperator:
      type: string
      enum: ["<=", ">=", "==", "<", ">"]

    ProjectOverviewGateSource:
      type: string
      description: >
        Supported immutable gate policy sources currently produced by the
        application. Legacy empty source values are represented as null.
      enum: [default, repository, managed]

    ProjectOverviewGateMetric:
      type: string
      enum:
      - new_critical
      - new_high
      - new_medium
      - new_secret
      - new_vulnerability
      - new_issues
      - total_critical
      - duplication_density
      - coverage
      - security_rating
      - reliability_rating
      - maintainability_rating

      - security_hotspots_reviewed
      - new_security_hotspots_reviewed
    ProjectOverview:
      oneOf:
      - $ref: "#/components/schemas/ProjectOverviewNotAnalyzed"
      - $ref: "#/components/schemas/ProjectOverviewAnalyzed"

    ProjectOverviewNotAnalyzed:
      type: object
      required: [state, project, latest_analysis, gate, issue_summary, lenses]
      properties:
        state:
          type: string
          enum: [not_analyzed]
        project: {$ref: "#/components/schemas/ProjectOverviewProject"}
        latest_analysis:
          type: "null"
        gate:
          type: "null"
        issue_summary: {$ref: "#/components/schemas/ProjectOverviewIssueSummary"}
        lenses: {$ref: "#/components/schemas/ProjectOverviewLenses"}

    ProjectOverviewAnalyzed:
      type: object
      required: [state, project, latest_analysis, gate, issue_summary, lenses]
      properties:
        state:
          type: string
          enum: [analyzed]
        project: {$ref: "#/components/schemas/ProjectOverviewProject"}
        latest_analysis: {$ref: "#/components/schemas/ProjectOverviewAnalysis"}
        gate: {$ref: "#/components/schemas/ProjectOverviewGate"}
        issue_summary: {$ref: "#/components/schemas/ProjectOverviewIssueSummary"}
        lenses: {$ref: "#/components/schemas/ProjectOverviewLenses"}

    ProjectOverviewProject:
      type: object
      required: [key, name]
      properties:
        key: {type: string, minLength: 1}
        name: {type: string, minLength: 1}

    ProjectOverviewAnalysis:
      type: object
      required: [id, created_at, source_ref, source_commit, new_code]
      properties:
        id: {type: string, minLength: 1}
        created_at: {type: string, format: date-time}
        source_ref: {type: string}
        source_commit: {type: string}
        new_code: {$ref: "#/components/schemas/ProjectOverviewNewCodePeriod"}

    ProjectOverviewNewCodePeriod:
      oneOf:
      - type: object
        required: [first_analysis, has_baseline, baseline_analysis_id]
        properties:
          first_analysis:
            type: boolean
            const: true
          has_baseline:
            type: boolean
            const: false
          baseline_analysis_id:
            type: "null"
      - type: object
        required: [first_analysis, has_baseline, baseline_analysis_id]
        properties:
          first_analysis:
            type: boolean
            const: false
          has_baseline:
            type: boolean
            const: true
          baseline_analysis_id:
            type: string
            minLength: 1

    ProjectOverviewGate:
      type: object
      required: [status, key, name, source, failed_conditions]
      properties:
        status: {$ref: "#/components/schemas/ProjectOverviewGateStatus"}
        key:
          type: [string, "null"]
        name:
          type: [string, "null"]
        source:
          anyOf:
          - $ref: "#/components/schemas/ProjectOverviewGateSource"
          - type: "null"
        failed_conditions:
          type: array
          items: {$ref: "#/components/schemas/ProjectOverviewGateCondition"}

    ProjectOverviewGateCondition:
      type: object
      required: [metric, operator, threshold, actual]
      properties:
        metric: {$ref: "#/components/schemas/ProjectOverviewGateMetric"}
        operator: {$ref: "#/components/schemas/ProjectOverviewGateOperator"}
        threshold: {type: number}
        actual: {type: number}

    ProjectOverviewIssueSummary:
      type: object
      required: [new_code_total, accepted_overall_total]
      properties:
        new_code_total:
          description: Total findings newly introduced in the immutable New Code snapshot.
          $ref: "#/components/schemas/ProjectOverviewCountMetric"
        accepted_overall_total:
          description: Total accepted findings across the whole project. Unavailable
            until issue lifecycle data lands.
          $ref: "#/components/schemas/ProjectOverviewCountMetric"

    ProjectOverviewLenses:
      type: object
      required: [overall, new_code]
      properties:
        overall: {$ref: "#/components/schemas/ProjectOverviewLens"}
        new_code: {$ref: "#/components/schemas/ProjectOverviewLens"}

    ProjectOverviewLens:
      type: object
      required: [security, reliability, maintainability, security_hotspots_reviewed,
        coverage, duplications]
      properties:
        security: {$ref: "#/components/schemas/ProjectOverviewRatingMetric"}
        reliability: {$ref: "#/components/schemas/ProjectOverviewRatingMetric"}
        maintainability: {$ref: "#/components/schemas/ProjectOverviewRatingMetric"}
        security_hotspots_reviewed: {$ref: "#/components/schemas/ProjectOverviewPercentageMetric"}
        coverage: {$ref: "#/components/schemas/ProjectOverviewPercentageMetric"}
        duplications: {$ref: "#/components/schemas/ProjectOverviewPercentageMetric"}

    ProjectOverviewRatingMetric:
      type: object
      required: [availability, grade, unavailable_reason]
      properties:
        availability: {$ref: "#/components/schemas/ProjectOverviewMetricAvailability"}
        grade:
          anyOf:
          - $ref: "#/components/schemas/ProjectOverviewGrade"
          - type: "null"
        unavailable_reason:
          anyOf:
          - $ref: "#/components/schemas/ProjectOverviewUnavailableReason"
          - type: "null"

    ProjectOverviewPercentageMetric:
      type: object
      required: [availability, value, unavailable_reason]
      properties:
        availability: {$ref: "#/components/schemas/ProjectOverviewMetricAvailability"}
        value:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        unavailable_reason:
          anyOf:
          - $ref: "#/components/schemas/ProjectOverviewUnavailableReason"
          - type: "null"

        grade:
          type: string
    ProjectOverviewCountMetric:
      type: object
      required: [availability, value, unavailable_reason]
      properties:
        availability: {$ref: "#/components/schemas/ProjectOverviewMetricAvailability"}
        value:
          type: [integer, "null"]
          minimum: 0
        unavailable_reason:
          anyOf:
          - $ref: "#/components/schemas/ProjectOverviewUnavailableReason"
          - type: "null"

    ProjectHotspotStatus:
      type: string
      enum: [to_review, acknowledged, fixed, safe]

    ProjectHotspotSeverity:
      type: string
      enum: [unknown, info, low, medium, high, critical]

    ProjectHotspot:
      type: object
      required:
      - id
      - rule_key
      - rule_name
      - title
      - description
      - severity
      - finding_kind
      - cwe
      - location
      - status
      - version
      - first_seen_analysis_id
      - last_seen_analysis_id
      - first_seen_at
      - last_seen_at
      properties:
        id: {type: string}
        rule_key: {type: string}
        rule_name: {type: string}
        title: {type: string}
        description: {type: string}
        severity: {$ref: "#/components/schemas/ProjectHotspotSeverity"}
        finding_kind: {type: string}
        cwe: {type: string}
        location: {type: string}
        status: {$ref: "#/components/schemas/ProjectHotspotStatus"}
        version: {type: integer, minimum: 1}
        first_seen_analysis_id: {type: string}
        last_seen_analysis_id: {type: string}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}

    ProjectHotspotCursor:
      type: object
      required: [before_last_seen_at, before_id]
      properties:
        before_last_seen_at: {type: string, format: date-time}
        before_id: {type: string}

    ProjectHotspotFacets:
      type: object
      required: [statuses, rule_keys, severities]
      properties:
        statuses: {type: object, additionalProperties: {type: integer, minimum: 0}}
        rule_keys: {type: object, additionalProperties: {type: integer, minimum: 0}}
        severities: {type: object, additionalProperties: {type: integer, minimum: 0}}

    ProjectHotspotPage:
      type: object
      required:
      - items
      - next
      - facets
      - summary
      properties:
        items:
