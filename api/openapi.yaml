openapi: 3.1.0
info:
  title: Synapse API
  version: 0.1.0
  description: >
    Security & pentest operations – software composition analysis core.
    Authorized security testing only: every scan is gated by an engagement's
    scope and authorization window, enforced server-side.

    Auth: human/control-plane endpoints except `/healthz` and `/readyz` require
    the operator bearer token (`Authorization: Bearer <SYNAPSE_API_TOKEN>`).
    Agent-plane `/api/v1/fleet/*` endpoints use the enrolled agent bearer credential
    (or the configured trusted mTLS-proxy certificate path) and pin protocol version 1.
    After operator authentication, every endpoint except the AUP endpoints also
    requires that the current Acceptable Use Policy has been accepted, else `403`.

    Response objects use snake_case. A few endpoints that are still serialized directly from a
    domain struct answer in PascalCase; each is documented with the field names it actually returns.

servers:
- url: http://localhost:8080
  description: Local API

security:
- bearerAuth: []

tags:
- name: users
  description: Operator identities, roles, and API-key lifecycle
- name: platform
  description: Deployment-wide configuration a client needs before it renders navigation
- name: health
- name: aup
- name: engagements
- name: findings
- name: sca
- name: export
- name: projects
  description: Long-lived code-quality Projects and immutable analysis read models
- name: rules
  description: Built-in code-quality and security rule catalog
- name: assets
  description: Business-level Asset Management and security posture
- name: dashboard
  description: Tenant-scoped security operations summaries
- name: vulnerability-intelligence
  description: Tenant-scoped vulnerability feeds, exposure correlation, risk transitions, and durable operations
- name: remediation-sla
  description: Risk-based remediation deadlines, immutable assessments, policy versions, and human-owned lifecycle governance
- name: fleet
  description: Agent-plane fleet telemetry transport

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  service: {type: string, example: synapse-api}

  /readyz:
    get:
      tags: [health]
      summary: Dependency readiness probe
      description: Checks PostgreSQL, embedded migration state, and the object store when configured.
      security: []
      responses:
        "200":
          description: Every configured dependency is ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}
        "503":
          description: One or more configured dependencies failed or timed out
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}

  /api/v1/aup:
    get:
      tags: [aup]
      summary: Current Acceptable Use Policy + acceptance state
      responses:
        "200":
          description: The active AUP
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AupStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/aup/accept:
    post:
      tags: [aup]
      summary: Accept the current AUP (recorded with actor + version + timestamp)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: string, example: "1.0"}
      responses:
        "200": {description: Accepted}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/capabilities:
    get:
      tags: [platform]
      summary: List optional subsystems and whether this deployment enables them
      description: >
        Every optional subsystem registers its routes only when its `SYNAPSE_*` switch is on, so a
        disabled subsystem and a broken one both answer 404. This endpoint reports, per subsystem, a
        stable key, a human name, whether it is enabled, and the environment variable that controls
        it, so a client can render "disabled" rather than a dead link. It returns configuration
        booleans and variable NAMES only, never a configured value, and is gated at the view floor.
      responses:
        "200":
          description: The deployment's capability catalog
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  capabilities:
                    type: array
                    items: {$ref: "#/components/schemas/Capability"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/engagements:
    get:
      tags: [engagements]
      summary: List engagements
      responses:
        "200":
          description: Engagements
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Engagement"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [engagements]
      summary: Create an engagement
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateEngagementRequest"}
          multipart/form-data:
            schema:
              type: object
              required: [metadata, source]
              properties:
                metadata:
                  type: string
                  description: JSON-encoded CreateEngagementRequest.
                source:
                  type: string
                  format: binary
                  description: Source package in .zip, .tar, .tar.gz, or .tgz format; maximum compressed size is 512 MiB.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Engagement"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Engagement already has a different uploaded source package}
        "413": {description: Uploaded source package exceeds 512 MiB}

  /api/v1/engagements/{id}:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    patch:
      tags: [engagements]
      summary: Apply a lifecycle transition to an engagement
      description: >
        Requires the `operate` capability. The legal transitions are draft to active, active to
        completed, and draft, active, or completed to archived; archived is terminal. An illegal
        transition is rejected with `400`. `PUT /api/v1/engagements/{id}/status` applies the same
        change on the status sub-resource.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EngagementTransitionRequest"}
      responses:
        "200":
          description: The transitioned engagement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Engagement"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/engagements/{id}/status:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    put:
      tags: [engagements]
      summary: Set an engagement's lifecycle status
      description: >
        Requires the `operate` capability. Identical in effect to
        `PATCH /api/v1/engagements/{id}`: the same legal transitions, the same authorization gate,
        and the same audit record.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EngagementTransitionRequest"}
      responses:
        "200":
          description: The transitioned engagement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Engagement"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/engagements/{id}/source:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    get:
      tags: [engagements, sca]
      summary: Get the immutable uploaded source package metadata for an engagement
      responses:
        "200":
          description: Uploaded source package metadata
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadedSourcePackage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/engagements/{id}/cspm/runs:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    post:
      tags: [engagements, findings, assets]
      summary: Run a bounded read-only live cloud posture scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items:
                    type: object
                    required: [provider, root, credential_ref]
                    properties:
                      provider: {type: string, enum: [aws, azure, gcp]}
                      root: {type: string, minLength: 1}
                      credential_ref: {type: string, minLength: 1, description: Vault reference; never credential material}
      responses:
        "202":
          description: Durable CSPM run accepted for isolated worker execution
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CSPMRun"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/engagements/{id}/cspm/runs/{rid}:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    - name: rid
      in: path
      required: true
      schema: {type: string}
    get:
      tags: [engagements, findings, assets]
      summary: Get a durable CSPM run
      responses:
        "200": {description: CSPM run status, content: {application/json: {schema: {$ref: "#/components/schemas/CSPMRun"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/engagements/{id}/detection-provenance:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    get:
      tags: [engagements, findings]
      operationId: listDetectionProvenance
      summary: List durable detection-provenance states for an engagement
      description: Returns tenant-scoped custody and health projections independently of the ordinary detection projection.
      responses:
        "200":
          description: Current detection-provenance states
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DetectionProvenanceList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /api/v1/engagements/{id}/detections/{did}/provenance:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    - $ref: "#/components/parameters/DetectionId"
    get:
      tags: [engagements, findings]
      operationId: listDetectionProvenanceTransitions
      summary: List append-only provenance transitions for one detection
      description: Returns the ordered custody history, including causal telemetry references and the sealed evidence identity when available.
      responses:
        "200":
          description: Oldest-to-newest detection-provenance history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DetectionProvenanceTransitionList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /api/v1/engagements/{id}/findings:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    get:
      tags: [findings]
      summary: List an engagement's findings (highest risk first)
      description: Ordered by CISA KEV, then EPSS x CVSS, then severity – never raw
        CVSS.
      responses:
        "200":
          description: Findings
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Finding"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [findings]
      summary: Create a manual finding
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateManualFindingRequest"}
      responses:
        "201":
          description: Created finding
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Finding"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/engagements/{id}/findings/{fid}:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    - name: fid
      in: path
      required: true
      schema: {type: string}
    patch:
      tags: [findings]
      summary: Change a finding's triage status (audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, triage, confirmed, false_positive, remediated]
                note: {type: string}
      responses:
        "200":
          description: The updated finding
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Finding"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/engagements/{id}/sarif:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    post:
      tags: [findings]
      summary: Import a third-party SARIF report
      parameters:
      - name: asset_id
        in: query
        schema: {type: string}
        description: Authoritative asset ID; required and validated when fleet asset attribution is configured.
      requestBody:
        required: true
        content:
          application/sarif+json:
            schema: {type: object}
      responses:
        "200": {description: Ingest summary}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/engagements/{id}/export/sarif:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    get:
      tags: [export]
      summary: Export findings as SARIF 2.1.0
      responses:
        "200":
          description: SARIF document
          content:
            application/sarif+json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/engagements/{id}/export/openvex:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    get:
      tags: [export]
      summary: Export findings as OpenVEX 0.2
      responses:
        "200":
          description: OpenVEX document
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/engagements/{id}/report.pdf:
    parameters:
    - $ref: "#/components/parameters/EngagementId"
    get:
      tags: [export]
      summary: Deterministic PDF report, SHA-256 sealed
      description: Templated from stored data (no LLM). The body's SHA-256 is returned
        in `X-Report-SHA256`.
      responses:
        "200":
          description: PDF report
          headers:
            X-Report-SHA256:
              description: Hex SHA-256 of the PDF bytes (integrity seal)
              schema: {type: string}
          content:
            application/pdf:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/sca/scans:
    post:
      tags: [sca]
      summary: Run an SCA scan against an in-scope target
      description: >
        Scope + authorization window are enforced before any tool runs; an
        out-of-scope or expired target is rejected with 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScanRequest"}
      responses:
        "200":
          description: Scan result (SBOM, vulnerabilities, licenses, findings, provenance)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScanResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/sca/scans/{id}:
    get:
      tags: [sca]
      summary: Read one asynchronous scan job by its own id
      description: >
        Reads a specific scan job rather than the engagement's latest, so a
        concurrent scan on the same engagement cannot mask this job's status. The
        job is resolved first, then its engagement is checked against the caller's
        tenant; an unknown or cross-tenant job is 404 and reveals nothing.
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: Scan job id returned when the scan was accepted
      responses:
        "200":
          description: Scan job status, stage, and progress
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScanJob"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/attack-paths:
    get:
      tags: [findings]
      summary: List bounded, tenant-scoped derived attack paths
      description: >
        Non-empty target, entrypoint, and finding filters compose with AND. Unknown
        or cross-tenant filter IDs return an empty result to avoid disclosure.
      parameters:
      - name: target
        in: query
        schema: {type: string}
        description: Asset ID that a returned path must contain
      - name: entrypoint
        in: query
        schema: {type: string}
        description: Starting exposure asset ID
      - name: finding
        in: query
        schema: {type: string}
        description: Finding ID at the path endpoint; without finding_kind, matches either target kind
      - name: finding_kind
        in: query
        schema: {type: string, enum: [canonical, imported]}
        description: Optional endpoint kind; requires finding and selects its typed target
      responses:
        "200":
          description: Deterministically ordered paths and the applied traversal bounds
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AttackPathResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /api/v1/projects/{key}:
    parameters:
    - $ref: '#/components/parameters/ProjectKey'
    delete:
      tags: [projects]
      summary: Delete a Project and its retained source artifacts
      operationId: deleteProject
      responses:
        "204": {description: Project deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /api/v1/projects/{key}/analyses/import:
    parameters:
    - $ref: '#/components/parameters/ProjectKey'
    post:
      tags: [projects]
      summary: Record a pipeline-produced scan result as the Project's next analysis
      operationId: importProjectAnalysis
      description: >
        The CI path into the console. `synapse-cli scan --server URL --project KEY` runs the scan on
        the pipeline's own checkout and posts the result here. The server records it through the
        same recorder as a server-side analysis, so it takes its place in the project history, moves
        the trend, evaluates the project's managed quality gate, and carries ratings, issues and
        hotspots. The gate in the payload is ignored: the server's managed gate is the policy, and a
        client that could ship its own gate could ship a passing one. The analysis is marked
        `origin: ci` and carries the pipeline's own account of the run, which the server does not
        verify. Requires the operate permission. Body ceiling 64 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              additionalProperties: false
              properties:
                ci:
                  type: object
                  description: The pipeline's own account of the run; every field optional and unverified.
                  additionalProperties: false
                  properties:
                    provider: {type: string, maxLength: 512, description: 'e.g. github-actions, gitlab-ci, jenkins'}
                    run_url: {type: string, format: uri, maxLength: 512}
                    run_id: {type: string, maxLength: 512}
                    branch: {type: string, maxLength: 512}
                    actor: {type: string, maxLength: 512}
                result:
                  type: object
                  description: A synapse-cli scan result, exactly as `synapse-cli scan --json` prints it.
                  additionalProperties: true
      responses:
        "201":
          description: The recorded analysis, in the same shape as the analysis history returns it
          content:
            application/json:
              schema:
                type: object
                required: [id, created_at, origin, gate, gate_info, issues, new_code, measures, rating]
                properties:
                  id: {type: string}
                  created_at: {type: string, format: date-time}
                  origin: {type: string, enum: [server, ci]}
                  ci:
                    type: object
                    properties:
                      provider: {type: string}
                      run_url: {type: string}
                      run_id: {type: string}
                      branch: {type: string}
                      actor: {type: string}
                  source_ref: {type: string}
                  source_commit: {type: string}
                  gate:
                    type: object
                    properties:
                      passed: {type: boolean}
                      results: {type: array, items: {type: object}}
                  gate_info: {type: object}
                  issues: {type: object}
                  new_code: {type: object}
                  delta: {type: object, nullable: true}
                  measures: {type: object, additionalProperties: {type: number}}
                  coverage: {type: object, nullable: true}
                  duplication: {type: object}
                  rating: {type: object}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {description: The scan result exceeds the import size limit}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /api/v1/projects/{key}/analyses/{id}/source:
    parameters:
    - $ref: '#/components/parameters/ProjectKey'
    - $ref: '#/components/parameters/AnalysisId'
    post:
      tags: [projects]
      summary: Publish an immutable source snapshot for one server-owned Project analysis
      operationId: publishProjectAnalysisSource
      description: >
        Authenticated CI contribution path for Code Quality source. The server derives tenant
        and actor from the bearer token, re-resolves the analysis under that tenant/project,
        applies configured source-capture policy and limits, and creates the snapshot once.
      parameters:
      - name: X-Synapse-Tool-Version
        in: header
        required: true
        schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: {type: string, format: binary}
      responses:
        "201":
          description: Source snapshot published and attached to the immutable analysis
          content:
            application/json:
              schema:
                type: object
                required: [files, writer, digest]
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      required: [path, bytes, lines, generated, available]
                      properties:
                        path: {type: string, minLength: 1}
                        digest: {type: string}
                        bytes: {type: integer, format: int64, minimum: 0}
                        lines: {type: integer, minimum: 0}
                        generated: {type: boolean}
                        available: {type: boolean}
                        reason: {type: string}
                  truncated: {type: boolean}
                  writer:
                    type: object
                    required: [actor, tool_version, published_at]
                    properties:
                      actor: {type: string, minLength: 1}
                      tool_version: {type: string, minLength: 1}
                      published_at: {type: string, format: date-time}
                  digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Analysis already has source or source artifact state conflicts}
        "413": {description: Source archive exceeds the transport upload limit}
        "415": {description: Content-Type is not application/x-tar}
        "500": {$ref: "#/components/responses/InternalServerError"}
        "503": {description: Source artifact storage is temporarily unavailable}

  /api/v1/projects/{key}/analyses/{id}/code/files:
    parameters:
    - $ref: '#/components/parameters/ProjectKey'
    - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [projects]
      summary: List immutable source files for one Project analysis
      operationId: listProjectCodeFiles
      parameters:
      - name: include_generated
        in: query
        schema: {type: boolean, default: false}
      - name: changed
