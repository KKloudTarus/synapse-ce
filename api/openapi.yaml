      - key
      - name
      - language
      - type
      - qualities
      - default_severity
      - tags
      - cwe
      - owasp
      - description
      - rationale
      - remediation
      - compliant_example
      - noncompliant_example
      - remediation_effort
      - detection
      properties:
        key: {type: string}
        name: {type: string}
        language: {type: string}
        type: {$ref: "#/components/schemas/RuleType"}
        qualities:
          type: array
          items: {$ref: "#/components/schemas/RuleQuality"}
        default_severity: {$ref: "#/components/schemas/RuleSeverity"}
        tags:
          type: array
          items: {type: string}
        cwe:
          type: array
          items: {type: string}
        owasp:
          type: array
          items: {type: string}
        description: {type: string}
        rationale: {type: string}
        remediation: {type: string}
        compliant_example: {type: string}
        noncompliant_example: {type: string}
        remediation_effort: {type: integer}
        detection: {$ref: "#/components/schemas/RuleDetection"}
    ProjectHotspotTransitionRequest:
