      operationId: listRules
      description: Returns the immutable first-party rule catalog with optional filters.
      parameters:
      - name: q
        in: query
        description: Search term. Max length 256. (Total filter values across all
          dimensions limit is 64).
        schema:
          type: string
          maxLength: 256
      - name: language
        in: query
        style: form
        explode: true
        schema:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 128
      - name: type
        in: query
        style: form
        explode: true
        schema:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/RuleType"
      - name: severity
        in: query
        style: form
        explode: true
        schema:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/RuleSeverity"
      - name: tag
        in: query
        style: form
        explode: true
        schema:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 128
      - name: cwe
        in: query
        style: form
        explode: true
        schema:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 128
      responses:
        "200":
          description: A list of rule summaries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/RuleSummary"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalServerError"}

  /api/v1/rules/{key}:
    parameters:
    - name: key
      in: path
      required: true
      schema:
        type: string
