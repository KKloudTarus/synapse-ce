        '502': {description: No sink acknowledged the alert, content: {application/json: {schema: {$ref: '#/components/schemas/AlertTestResult'}}}}

  /api/v1/assets/hosts:
    get:
      tags: [assets]
      operationId: listHostVulnerabilities
      summary: List fleet host assets with their vulnerability summary
      description: >
        Every Kind=host asset of the tenant, worst first (critical, then high, then total). A host
        that reported OS packages carries the id of its hidden vulnerability context, the size and
        recording time of its active package SBOM, the latest scan job and the finding counts; a host
        that never reported packages has an empty summary and no engagement id. Registered only when
        SYNAPSE_FLEET_HOST_INGEST_ENABLED is set.
      responses:
        '200': {description: Host rows, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/HostVulnerabilitySummary'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/assets/{assetID}/vulnerabilities:
    parameters: [{$ref: '#/components/parameters/HostAssetId'}]
    get:
      tags: [assets, findings]
      operationId: getHostVulnerabilities
      summary: Get one fleet host's recorded packages, latest scan and vulnerability findings
      description: >
        The host's summary row plus the advisory-backed findings of its hidden vulnerability
        context, highest risk first, in the same shape as the engagement findings list. License
        findings derived from the same packages are excluded. A host that never reported packages
        returns an empty findings list; a non-host asset is a 400.
      responses:
        '200': {description: Host vulnerabilities, content: {application/json: {schema: {$ref: '#/components/schemas/HostVulnerabilities'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/appsec/assets:
    get:
      tags: [assets]
      operationId: listBusinessAssets
      summary: List tenant-scoped business Assets
      parameters:
      - {name: q, in: query, schema: {type: string, maxLength: 256}}
      - {name: type, in: query, schema: {type: string, enum: [product, application, system, business_service]}}
      - {name: criticality, in: query, schema: {type: string, enum: [critical, high, medium, low]}}
      - {name: lifecycle, in: query, schema: {type: string, enum: [draft, active, decommissioning, retired]}}
      - {name: owner, in: query, schema: {type: string, maxLength: 256}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200': {description: Asset page, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessAssetPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [assets]
      operationId: createBusinessAsset
      summary: Create a business Asset
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateBusinessAssetRequest'}}}}
      responses:
        '201': {description: Created Asset, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessAsset'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Tenant key conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /api/v1/appsec/assets/{assetID}:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: getBusinessAsset
      summary: Get a business Asset
      responses:
        '200': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessAsset'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [assets]
      operationId: updateBusinessAsset
      summary: Update metadata or advance Asset lifecycle with optimistic versioning
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateBusinessAssetRequest'}}}}
      responses:
        '200': {description: Updated Asset, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessAsset'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Version conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /api/v1/appsec/assets/{assetID}/projects:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: listBusinessAssetProjects
      responses: {'200': {description: Project memberships, content: {application/json: {schema: {$ref: '#/components/schemas/AssetMemberships'}}}}}
    put:
      tags: [assets]
      operationId: replaceBusinessAssetProjects
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssetMemberships'}}}}
      responses: {'204': {description: Memberships replaced}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}}

  /api/v1/appsec/assets/{assetID}/technical-assets:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: listBusinessAssetTechnicalAssets
      responses: {'200': {description: Technical Asset memberships, content: {application/json: {schema: {$ref: '#/components/schemas/AssetMemberships'}}}}}
    put:
      tags: [assets]
      operationId: replaceBusinessAssetTechnicalAssets
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssetMemberships'}}}}
      responses: {'204': {description: Memberships replaced}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}}

  /api/v1/appsec/assets/{assetID}/engagements:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: listBusinessAssetEngagements
      responses: {'200': {description: Assigned Engagements, content: {application/json: {schema: {type: array, items: {type: object}}}}}, '404': {$ref: '#/components/responses/NotFound'}}

  /api/v1/appsec/assets/{assetID}/findings:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: listBusinessAssetFindings
      responses:
        '200':
          description: First-party and imported Findings resolved through assigned Engagements
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BusinessAssetFinding'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/appsec/assets/{assetID}/coverage:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: getBusinessAssetCoverage
      responses: {'200': {description: Coverage and freshness projection, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessAssetCoverage'}}}}, '404': {$ref: '#/components/responses/NotFound'}}

  /api/v1/appsec/assets/{assetID}/posture:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: getBusinessAssetPosture
      responses: {'200': {description: Deterministic posture projection, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessAssetPosture'}}}}, '404': {$ref: '#/components/responses/NotFound'}}

  /api/v1/appsec/assets/{assetID}/history:
    parameters: [{$ref: '#/components/parameters/BusinessAssetId'}]
    get:
      tags: [assets]
      operationId: getBusinessAssetHistory
      responses: {'200': {description: Assessment history, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BusinessAssetHistoryItem'}}}}}, '404': {$ref: '#/components/responses/NotFound'}}

  /api/v1/engagements/{id}/asset:
    parameters: [{$ref: '#/components/parameters/EngagementId'}]
    put:
      tags: [assets, engagements]
      operationId: assignEngagementBusinessAsset
      summary: Assign or clear an Engagement's primary business Asset
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [asset_id], properties: {asset_id: {type: string, description: Empty string clears assignment}}}}}}
      responses: {'204': {description: Assignment updated}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}}

  /api/v1/ai-triage/reviews:
    get:
      tags: [ai-triage]
      operationId: listAITriageReviews
      summary: List the tenant's durable human-review queue
      parameters:
      - {name: severity, in: query, schema: {type: string, enum: [critical, high, medium, low, info, unknown]}}
      - {name: cwe, in: query, schema: {type: string}}
      - {name: project, in: query, schema: {type: string}}
      - {name: state, in: query, schema: {type: string, enum: [pending, accepted, rejected]}}
      responses:
        '200':
          description: Review queue
          content:
            application/json:
              schema:
                type: object
                required: [reviews]
                properties:
                  reviews: {type: array, items: {$ref: '#/components/schemas/AITriageReview'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/ai-triage/observability:
    get:
      tags: [ai-triage]
      operationId: getAITriageObservability
      summary: Aggregate tenant-scoped AI triage safety, cost, and input-distribution metrics
      responses:
        '200': {description: Latest per-project AI triage metrics, baseline alerts, and drift-ready distribution snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/AITriageDashboard'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/redteam/halt:
    post:
      tags: [redteam]
      operationId: haltOffensiveWork
      summary: Kill switch — halt all in-flight offensive work for the tenant
      description: >-
        One operator action (PermAdminister) that cancels every in-flight offensive work order. The
        response reports the MEASURED duration against the stated bound rather than asserting
        compliance, and reports partial failure as failure. The bound covers the CONTROL PLANE only:
        a technique already running on a host stops within one further agent poll interval, which is
        why estate_stop_note is part of the response. See docs/redteam/offensive-policy.md section 8.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OffensiveHaltRequest'}
      responses:
        '200': {description: Every in-flight offensive work order was cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/OffensiveHaltResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {description: The halt did not fully succeed; the partial result names the orders still in flight, content: {application/json: {schema: {$ref: '#/components/schemas/OffensiveHaltResult'}}}}

  /api/v1/ai-triage/reviews/{rid}/claim:
    parameters: [{$ref: '#/components/parameters/AITriageReviewId'}]
    post:
      tags: [ai-triage]
      operationId: claimAITriageReview
      summary: Assign an unowned review to the authenticated reviewer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AITriageReviewClaimRequest'}
      responses:
        '200': {description: Claimed review, content: {application/json: {schema: {$ref: '#/components/schemas/AITriageReview'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Version or ownership conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /api/v1/ai-triage/reviews/{rid}/decision:
    parameters: [{$ref: '#/components/parameters/AITriageReviewId'}]
    post:
      tags: [ai-triage]
      operationId: decideAITriageReview
      summary: Accept or reject an owned AI false-positive recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AITriageReviewDecisionRequest'}
      responses:
        '200': {description: Decided review, content: {application/json: {schema: {$ref: '#/components/schemas/AITriageReview'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Version, state, or ownership conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /api/v1/vulnerability/overview:
    get:
      tags: [vulnerability-intelligence]
      summary: Get vulnerability intelligence operational overview
      description: Requires view permission. Counts active exposure from occurrences whose current state is `detected`; historical or no-longer-detected occurrences are excluded.
      responses:
        '200': {description: Tenant overview, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityOverview'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/vulnerability/advisories:
    get:
      tags: [vulnerability-intelligence]
      summary: List canonical vulnerability advisories
      description: Requires view permission. `active_affected_count` counts current tenant occurrences in `detected` state only. Aggregate tenant filters are applied before the returned cursor page. Pagination is ordered by canonical advisory ID and continued with `after`.
      parameters:
      - {name: after, in: query, schema: {type: string}, description: Last advisory ID from the previous page}
      - {name: search, in: query, schema: {type: string}}
      - {name: status, in: query, schema: {type: array, items: {type: string, enum: [active, rejected, withdrawn]}}, explode: true}
      - {name: kev, in: query, schema: {type: boolean}}
      - {name: min_cvss, in: query, schema: {type: number, minimum: 0, maximum: 10}}
      - {name: max_cvss, in: query, schema: {type: number, minimum: 0, maximum: 10}}
      - {name: source, in: query, schema: {type: string}}
      - {name: risk_priority, in: query, schema: {type: array, items: {type: integer, minimum: 1, maximum: 5}}, explode: true}
      - {name: risk_trend, in: query, schema: {type: array, items: {type: string, enum: [none, new, increased, decreased, unchanged]}}, explode: true}
      - {name: affected_asset, in: query, schema: {type: string}, description: Case-insensitive asset, engagement, component, package, fingerprint, or CPE search}
      - {name: detection_state, in: query, schema: {type: array, items: {type: string, enum: [detected, no_longer_detected, withdrawn]}}, explode: true}
      - {name: action_state, in: query, schema: {type: array, items: {type: string, enum: [open, acknowledged, resolved, none]}}, explode: true}
      - {$ref: '#/components/parameters/VulnerabilityLimit'}
      responses:
        '200': {description: Advisory page, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityAdvisoryPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/vulnerability/advisories/{id}:
    parameters: [{$ref: '#/components/parameters/VulnerabilityAdvisoryId'}]
    get:
      tags: [vulnerability-intelligence]
      summary: Get the current canonical advisory
      responses:
        '200': {description: Current advisory, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityAdvisoryItem'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/vulnerability/advisories/{id}/revisions:
    parameters: [{$ref: '#/components/parameters/VulnerabilityAdvisoryId'}]
    get:
      tags: [vulnerability-intelligence]
      summary: List immutable advisory revision history
      parameters:
      - {name: before_revision, in: query, schema: {type: integer, minimum: 1}, description: Continue with revisions lower than this value}
      - {$ref: '#/components/parameters/VulnerabilityLimit'}
      responses:
        '200': {description: Revision page, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityAdvisoryRevisionPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/vulnerability/advisories/{id}/revisions/{revision}:
    parameters:
    - {$ref: '#/components/parameters/VulnerabilityAdvisoryId'}
    - {name: revision, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      tags: [vulnerability-intelligence]
      summary: Get one immutable advisory revision
      responses:
        '200': {description: Advisory revision, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityAdvisoryRevisionItem'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/vulnerability/occurrences:
    get:
      tags: [vulnerability-intelligence]
      summary: List tenant vulnerability occurrences
      description: Requires view permission. Both cursor fields are required together. Results are ordered by `UpdatedAt` and `ID` descending.
      parameters:
      - {name: engagement_id, in: query, schema: {type: string}}
      - {name: advisory_id, in: query, schema: {type: string}}
      - {name: state, in: query, schema: {type: array, items: {type: string, enum: [detected, no_longer_detected, withdrawn]}}, explode: true}
      - {$ref: '#/components/parameters/VulnerabilityCursorTime'}
      - {$ref: '#/components/parameters/VulnerabilityCursorId'}
      - {$ref: '#/components/parameters/VulnerabilityLimit'}
      responses:
        '200': {description: Occurrence page, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityOccurrencePage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/vulnerability/occurrences/{id}/assessments:
    parameters: [{$ref: '#/components/parameters/VulnerabilityOccurrenceId'}]
    get:
      tags: [vulnerability-intelligence]
      summary: List immutable risk assessments for an occurrence
      parameters:
      - {$ref: '#/components/parameters/VulnerabilityCursorTime'}
      - {$ref: '#/components/parameters/VulnerabilityCursorId'}
      - {$ref: '#/components/parameters/VulnerabilityLimit'}
      responses:
        '200': {description: Assessment page, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityAssessmentPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/vulnerability/occurrences/{id}/transitions:
    parameters: [{$ref: '#/components/parameters/VulnerabilityOccurrenceId'}]
    get:
      tags: [vulnerability-intelligence]
      summary: List immutable risk transitions for an occurrence
      parameters:
      - {$ref: '#/components/parameters/VulnerabilityCursorTime'}
      - {$ref: '#/components/parameters/VulnerabilityCursorId'}
      - {$ref: '#/components/parameters/VulnerabilityLimit'}
      responses:
        '200': {description: Transition page, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityTransitionPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/vulnerability/sources:
    get:
      tags: [vulnerability-intelligence]
      summary: List configured vulnerability sources and health
      description: Requires view permission. Credential material is never returned; only `credential_configured` is exposed.
      parameters:
      - {name: include_archived, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Source views, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/VulnerabilitySource'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/vulnerability/sync-runs:
    get:
      tags: [vulnerability-intelligence]
      summary: List durable provider synchronization runs
      description: Requires view permission. Active states are `queued` and `running`; all other states are terminal. The ordinary view omits source snapshots, credential references, and raw provider payloads.
      parameters:
      - {name: source_id, in: query, schema: {type: string}}
      - {name: state, in: query, schema: {type: array, items: {$ref: '#/components/schemas/VulnerabilitySyncState'}}, explode: true}
      - {name: mode, in: query, schema: {type: array, items: {type: string, enum: [incremental, full]}}, explode: true}
      - {name: trigger, in: query, schema: {type: string}}
      - {name: from, in: query, schema: {type: string, format: date}, description: Inclusive UTC creation date}
      - {name: to, in: query, schema: {type: string, format: date}, description: Inclusive UTC creation date}
      - {$ref: '#/components/parameters/VulnerabilityCursorTime'}
      - {$ref: '#/components/parameters/VulnerabilityCursorId'}
      - {$ref: '#/components/parameters/VulnerabilityLimit'}
      responses:
        '200': {description: Safe sync-run page, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilitySyncRunPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/vulnerability/sync-runs/{id}:
    parameters: [{$ref: '#/components/parameters/VulnerabilityRunId'}]
    get:
      tags: [vulnerability-intelligence]
      summary: Get a safe durable synchronization run view
      description: Source snapshots, credential references, and raw provider payloads are not returned.
      responses:
        '200': {description: Safe sync run, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilitySyncRun'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/vulnerability/actions:
    get:
      tags: [vulnerability-intelligence]
      summary: List tenant vulnerability risk actions
      parameters:
      - {name: status, in: query, schema: {type: array, items: {type: string, enum: [open, acknowledged, resolved]}}, explode: true}
      - {name: before_created_at, in: query, schema: {type: string, format: date-time}, description: Must be supplied together with `before_id`}
      - {name: before_id, in: query, schema: {type: string}, description: Must be supplied together with `before_created_at`}
      - {$ref: '#/components/parameters/VulnerabilityLimit'}
      responses:
        '200': {description: Action page, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityActionPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/vulnerability/sources/{id}/sync:
    parameters: [{$ref: '#/components/parameters/VulnerabilitySourceId'}]
    post:
      tags: [vulnerability-intelligence]
      summary: Enqueue a durable source synchronization
      description: Requires operate permission. Reuse one idempotency key for retries of the same operator action.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilitySyncRequest'}}}}
      responses:
        '202': {description: Durable synchronization accepted, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilitySyncAccepted'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/vulnerability/sources/test:
    post:
      tags: [vulnerability-intelligence]
      summary: Test an unsaved vulnerability source draft
      description: Requires administer permission. The draft is normalized and tested with the code-owned adapter but is never persisted. When `existing_source_id` is supplied and `credential_ref` is omitted, the stored credential reference is resolved without returning it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: {type: object, additionalProperties: true}
                existing_source_id: {type: string}
      responses:
        '200': {description: Draft connectivity succeeded}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/vulnerability/advisories/{id}/reconcile:
    parameters: [{$ref: '#/components/parameters/VulnerabilityAdvisoryId'}]
    post:
      tags: [vulnerability-intelligence]
      summary: Enqueue tenant correlation for one advisory
      description: Requires operate permission. The HTTP request only creates durable work and returns `202`.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityReconcileRequest'}}}}
      responses:
        '202': {description: Durable reconciliation accepted, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityReconcileAccepted'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/vulnerability/reconcile/tenant:
    post:
      tags: [vulnerability-intelligence]
      summary: Enqueue a tenant-wide full reconciliation
      description: Requires operate permission. Rollback or disabling this operation stops new mutation only and never deletes historical occurrences, assessments, transitions, actions, or runs.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityReconcileRequest'}}}}
      responses:
        '202': {description: Durable reconciliation accepted, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityReconcileAccepted'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/vulnerability/reconcile-runs/{id}:
    parameters: [{$ref: '#/components/parameters/VulnerabilityRunId'}]
    get:
      tags: [vulnerability-intelligence]
      summary: Get a durable reconciliation run
      description: Active states are `queued` and `running`; `succeeded` and `failed` are terminal.
      responses:
        '200': {description: Reconciliation run, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityReconcileRun'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/vulnerability/reconcile-runs/{id}/diffs:
    parameters: [{$ref: '#/components/parameters/VulnerabilityRunId'}]
    get:
      tags: [vulnerability-intelligence]
      summary: List durable dry-run reconciliation differences
      description: >-
        Requires view permission. Cursor fields are required as one complete set and results are ordered by mismatch class,
        engagement, advisory, and component fingerprint. Dry-run count fields map to persisted classes:
        added=`missing_occurrence`, updated=`changed_occurrence`, unchanged=`in_sync`, retired=`stale_occurrence`,
        unmatchable=`unmatchable_input`; processed is their total.
      parameters:
      - {name: class, in: query, schema: {$ref: '#/components/schemas/VulnerabilityReconcileDiffClass'}}
      - {$ref: '#/components/parameters/VulnerabilityLimit'}
      - {name: after_class, in: query, schema: {$ref: '#/components/schemas/VulnerabilityReconcileDiffClass'}, description: Must be supplied with all other `after_*` fields}
      - {name: after_engagement_id, in: query, schema: {type: string}, description: Must be supplied with all other `after_*` fields}
      - {name: after_advisory_id, in: query, schema: {type: string}, description: Must be supplied with all other `after_*` fields}
      - {name: after_component_fingerprint, in: query, schema: {type: string}, description: Must be supplied with all other `after_*` fields}
      responses:
        '200': {description: Reconciliation difference page, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityReconcileDiffPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/sla/policies:
    get:
      tags: [remediation-sla]
      operationId: listSLAPolicies
      summary: List immutable SLA policy versions and the active version
      description: Requires view permission. The built-in policy is installed on first use when no tenant policy exists.
      responses:
        '200':
          description: Active policy and append-only tenant policy history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SLAPolicyList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [remediation-sla]
      operationId: activateSLAPolicy
      summary: Validate, append, and activate an SLA policy version
      description: Requires administer permission and a human principal. Existing assessments are never rewritten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config: {$ref: '#/components/schemas/SLAConfig'}
      responses:
        '200': {description: Existing identical policy selected, content: {application/json: {schema: {$ref: '#/components/schemas/SLAPolicyActivation'}}}}
        '201': {description: New immutable policy created and selected, content: {application/json: {schema: {$ref: '#/components/schemas/SLAPolicyActivation'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/engagements/{id}/slas:
    parameters: [{$ref: '#/components/parameters/EngagementId'}]
    get:
      tags: [remediation-sla, findings]
      operationId: listEngagementSLAs
      summary: List current remediation SLA views for an engagement
      description: Time-sensitive overdue and acceptance-expiry fields are calculated at read time.
      responses:
        '200':
          description: Current SLA views
          content:
            application/json:
              schema:
                type: object
                required: [slas]
                properties:
                  slas: {type: array, items: {$ref: '#/components/schemas/SLAView'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/engagements/{id}/slas/{fid}:
    parameters:
    - $ref: '#/components/parameters/EngagementId'
    - $ref: '#/components/parameters/FindingId'
    get:
      tags: [remediation-sla, findings]
      operationId: getFindingSLA
      summary: Get the current SLA assessment and remediation lifecycle for a finding
      responses:
        '200': {description: Current SLA view, content: {application/json: {schema: {$ref: '#/components/schemas/SLAView'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/engagements/{id}/slas/{fid}/assessments:
    parameters:
    - $ref: '#/components/parameters/EngagementId'
    - $ref: '#/components/parameters/FindingId'
    get:
      tags: [remediation-sla, findings]
      operationId: listSLAAssessmentHistory
      summary: List immutable SLA assessments for a finding
      responses:
        '200':
          description: Oldest-to-newest assessment history
          content:
            application/json:
              schema:
                type: object
                required: [assessments]
                properties:
                  assessments: {type: array, items: {$ref: '#/components/schemas/SLAAssessment'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/engagements/{id}/slas/{fid}/events:
    parameters:
    - $ref: '#/components/parameters/EngagementId'
    - $ref: '#/components/parameters/FindingId'
    get:
      tags: [remediation-sla, findings]
      operationId: listSLALifecycleEvents
      summary: List append-only human remediation lifecycle events
      responses:
        '200':
          description: Oldest-to-newest lifecycle audit history
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: {type: array, items: {$ref: '#/components/schemas/SLALifecycleEvent'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/engagements/{id}/slas/{fid}/transition:
    parameters:
    - $ref: '#/components/parameters/EngagementId'
    - $ref: '#/components/parameters/FindingId'
    post:
      tags: [remediation-sla, findings]
      operationId: transitionFindingSLA
      summary: Apply an optimistic-concurrency protected human remediation decision
      description: Machine principals are rejected. Accepted risk requires a reason, compensating control, and future expiry; remediated is terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SLATransitionRequest'}
      responses:
        '200': {description: Updated current SLA view, content: {application/json: {schema: {$ref: '#/components/schemas/SLAView'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Lifecycle version changed since it was loaded, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /api/v1/agents/{id}/keys:
    parameters:
    - $ref: '#/components/parameters/AgentId'
    get:
      tags: [fleet]
      operationId: listAgentSigningKeys
      summary: List an agent's content-signing keys
      responses:
        '200':
          description: Signing-key lifecycle records
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentSigningKeyList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/agents/{id}/keys/{keyID}/revoke:
    parameters:
    - $ref: '#/components/parameters/AgentId'
    - $ref: '#/components/parameters/SigningKeyId'
    post:
      tags: [fleet]
      operationId: revokeAgentSigningKey
      summary: Revoke one agent content-signing key
      responses:
        '200':
          description: Key revoked monotonically
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, key_id, state]
                properties:
                  agent_id: {type: string}
                  key_id: {type: string}
                  state: {type: string, const: revoked}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/fleet/keys:
    post:
      tags: [fleet]
      operationId: registerFleetSigningKey
      summary: Register an agent content-signing key with proof-of-possession
      description: The canonical agent identity comes from the bearer credential, never the request body.
      security:
      - fleetAgentAuth: []
      parameters:
      - $ref: '#/components/parameters/FleetProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentSigningKeyRegistration'}
      responses:
        '201':
          description: Key registered or idempotently re-registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentSigningKeyRegistrationResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/fleet/detections:
    post:
      tags: [fleet]
      operationId: ingestFleetDetectionBatch
      summary: Verify and ingest an independently signed agent detection batch
      description: Accepts only V2 batches. Verifies authenticated agent identity, key lifecycle, signature, exact membership, causal durable telemetry, privacy-policy attribution, and per-detection content digests before exactly-once evidence sealing.
      security:
      - fleetAgentAuth: []
      parameters:
      - $ref: '#/components/parameters/FleetProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentDetectionBatchRequest'}
      responses:
        '200':
          description: The complete batch was admitted or idempotently skipped
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentDetectionBatchResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/fleet/privacy-policies/active:
    get:
      tags: [fleet]
      operationId: getActiveFleetPrivacyPolicy
      summary: Get the active immutable source-privacy policy assignment
      description: Human/operator read of the tenant's active source-redaction policy. Tenant identity comes only from the authenticated principal.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Active privacy-policy assignment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivacyPolicyAssignmentEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/privacy-policies:
    get:
      tags: [fleet]
      operationId: listFleetPrivacyPolicyHistory
      summary: List immutable source-privacy policy history
      description: Human/operator read of every immutable policy assignment admitted for the authenticated tenant.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Ordered immutable privacy-policy assignment history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivacyPolicyHistoryResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      tags: [fleet]
      operationId: admitFleetPrivacyPolicy
      summary: Admit an immutable source-privacy policy assignment
      description: Human administrator admission of immutable policy content. Activation is a separate revisioned governance operation.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PrivacyPolicyAdmissionRequest'}
      responses:
        '200':
          description: An identical immutable assignment already existed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivacyPolicyAdmissionResponse'}
        '201':
          description: Immutable privacy-policy assignment admitted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivacyPolicyAdmissionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/privacy-policies/activate:
    post:
      tags: [fleet]
      operationId: activateFleetPrivacyPolicy
      summary: Activate an admitted immutable source-privacy policy assignment
      description: Human administrator mutation of the active-policy pointer. Every transition requires a caller-stable operation ID and appends an immutable revision.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PrivacyPolicyActivationRequest'}
      responses:
        '200':
          description: Privacy-policy assignment activated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivacyPolicyAssignmentEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/privacy-policy:
    get:
      tags: [fleet]
      operationId: getFleetAgentPrivacyPolicy
      summary: Deliver the active source-privacy policy to an authenticated fleet agent
      description: >
        Returns only the active assignment for the authenticated agent's tenant. Agent identity and tenant
        binding come from fleet-agent authentication; request-controlled identity cannot select another policy.
      security:
      - fleetAgentAuth: []
      parameters:
      - $ref: '#/components/parameters/FleetProtocolVersion'
      responses:
        '200':
          description: Active privacy-policy assignment bound to the authenticated fleet agent's tenant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivacyPolicyAssignmentEnvelope'}
        '401': {description: Fleet agent authentication failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {description: Privacy-policy delivery is unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/coverage-windows:
    get:
      tags: [fleet]
      operationId: listFleetCoverageWindows
      summary: List immutable telemetry coverage-window revisions
      description: >
        Human/operator read of tenant-scoped coverage revisions derived from signed sensor state,
        immutable telemetry accounting, agent-origin gaps, and inferred delivery gaps. Tenant identity
        comes only from the authenticated principal. Filters use half-open overlap semantics; the
        response excludes raw telemetry, source payloads, signing material, and request-controlled
        tenant identity. A gap, loss fact, or unhealthy sensor state cannot be represented as complete
        coverage. Coverage may lower Confidence but never changes true Risk.
      security:
      - bearerAuth: []
      parameters:
      - name: agent_id
        in: query
        schema: {type: string, minLength: 1}
      - name: asset_id
        in: query
        schema: {type: string, minLength: 1}
      - name: host_id
        in: query
        schema: {type: string, minLength: 1}
      - name: since
        in: query
        description: RFC 3339 lower overlap bound; when both bounds are present it must be before until.
        schema: {type: string, format: date-time}
      - name: until
        in: query
        description: RFC 3339 exclusive upper overlap bound; when both bounds are present it must be after since.
        schema: {type: string, format: date-time}
      - name: limit
        in: query
        description: Maximum revisions to return; omit or set zero for the server default.
        schema: {type: integer, minimum: 0, maximum: 1000}
      responses:
        '200':
          description: Ordered immutable coverage-window revisions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoverageWindowList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/sensor-states:
    post:
      tags: [fleet]
      operationId: ingestFleetSensorState
      summary: Verify and persist a signed P0 sensor-state report
      description: >
        Persists restart-safe sensor-state and class-coverage history after verifying
        the enrolled agent, session, server-authoritative asset binding, telemetry-signing
        key lifecycle, purpose-bound signature, and payload digest. Unknown JSON fields
        fail closed and reports are idempotent by immutable report identity.
      security:
      - fleetAgentAuth: []
      parameters:
      - $ref: '#/components/parameters/FleetProtocolVersion'
      - name: Content-Encoding
        in: header
        required: false
        description: Optional wire compression. Omit for raw JSON.
        schema: {type: string, enum: [gzip]}
      requestBody:
        required: true
        content:
          application/vnd.synapse.sensor-state+json:
            schema: {$ref: '#/components/schemas/SensorStateReport'}
      responses:
        '200':
          description: Sensor-state report durably acknowledged or idempotently observed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorStateAcknowledgement'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Fleet agent authentication failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Immutable sensor-state report identity conflicts with different content, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: Encoded or decoded sensor-state body exceeds the bounded transport limit, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '415': {description: Unsupported content encoding or media type, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Backpressure; the agent keeps the report pending and retries according to Retry-After, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/telemetry:
    post:
      tags: [fleet]
      operationId: ingestFleetTelemetry
      summary: Ingest one signed raw telemetry batch or one signed durable agent gap
      description: >
        Agent-plane endpoint for A3 telemetry transport. The authenticated tenant and agent
        identity are authoritative; AgentID, HostID, enrollment Session, server-derived delivery
        StreamID, and AssetID carried on the wire are validated against server state and cannot
        redirect a delivery lane. Telemetry batch manifests and gap reports are purpose-bound
        Ed25519 signed and fail closed on unknown keys, unsupported protocol/schema versions,
        digest mismatches, stale incarnations, or invalid identity bindings. Batch delivery is
        at-least-once and idempotent. The returned ACK is the highest contiguous transport-batch
        sequence durably ingested. Agent-origin gap coordinates are local WAL-record coordinates:
        they are persisted for audit and completeness reporting but never advance the transport-batch
        ACK. Content-Encoding gzip is accepted for either media type. Request decoding is strict;
        unknown JSON fields fail. A missing Content-Type remains backward-compatible with legacy
        batch clients and is interpreted as application/json; an explicit unsupported media type fails 415.
      security:
      - fleetAgentAuth: []
      parameters:
      - $ref: '#/components/parameters/FleetProtocolVersion'
      - name: Content-Encoding
        in: header
        required: false
        description: Optional wire compression. Omit for raw JSON.
        schema: {type: string, enum: [gzip]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [Manifest, Events]
              properties:
                Manifest:
                  type: object
                  additionalProperties: false
                  required: [ProtocolVersion, SchemaVersion, BatchID, AgentID, HostID, AssetID, StreamID, Position, EventTimeMin, EventTimeMax, ObservedCount, KeptCount, SampledOutCount, TruncatedCount, DroppedCount, SamplingPolicyDigest, Events, PayloadDigest, KeyID, Signature]
                  properties:
                    ProtocolVersion: {type: integer, const: 1}
                    SchemaVersion: {type: integer, minimum: 1, maximum: 2}
                    BatchID: {type: string, minLength: 1}
                    AgentID: {type: string, minLength: 1}
                    HostID: {type: string, minLength: 1}
                    AssetID: {type: string, minLength: 1}
                    StreamID: {type: string, minLength: 1, description: Server-derived delivery stream identity; agent choice is rejected}
                    Position:
                      type: object
                      additionalProperties: false
                      required: [Priority, Epoch, Sequence, Session, Boot]
                      properties:
                        Priority: {type: integer, minimum: 0, maximum: 3, description: P0..P3 encoded as 0..3}
                        Epoch: {type: integer, format: uint64, minimum: 1}
                        Sequence: {type: integer, format: uint64, minimum: 1, description: Transport-batch sequence within the priority/epoch lane}
                        Session: {type: string, minLength: 1}
                        Boot: {type: string, minLength: 1}
                    PreviousSequence: {type: integer, format: uint64, minimum: 0}
                    EventTimeMin: {type: string, format: date-time}
                    EventTimeMax: {type: string, format: date-time}
                    ObservedCount: {type: integer, minimum: 0}
                    KeptCount: {type: integer, minimum: 0, description: May be zero when every observed event was honestly sampled out, dropped, or otherwise accounted without fabricating a retained event}
                    SampledOutCount: {type: integer, minimum: 0}
                    TruncatedCount: {type: integer, minimum: 0}
                    DroppedCount: {type: integer, minimum: 0}
                    SamplingPolicyDigest: {type: string, minLength: 1}
                    Events:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required: [ID, Digest]
                        properties:
                          ID: {type: string, minLength: 1}
                          Digest: {type: string, minLength: 1}
                    PayloadDigest: {type: string, minLength: 1}
                    KeyID: {type: string, minLength: 1}
                    Signature: {type: string, description: "Base64 Ed25519 signature produced by encoding/json for []byte"}
                Events:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [EventID, Class, Payload, ObservedAt]
                    properties:
                      EventID: {type: string, minLength: 1}
                      Class: {type: string, minLength: 1}
                      Payload: {type: string, format: byte, description: Base64-encoded event bytes}
                      ObservedAt: {type: string, format: date-time}
          application/vnd.synapse.telemetry-gap+json:
            schema:
              type: object
              additionalProperties: false
              required: [ProtocolVersion, GapID, AgentID, HostID, AgentSessionID, AssetID, StreamID, Priority, Epoch, KnownSequence, FromSequence, ToSequence, Count, Reason, FromAt, ToAt, KeyID, Signature]
              properties:
                ProtocolVersion: {type: integer, const: 1}
                GapID: {type: string, minLength: 1}
                AgentID: {type: string, minLength: 1}
                HostID: {type: string, minLength: 1}
                AgentSessionID: {type: string, minLength: 1}
                AssetID: {type: string, minLength: 1}
                StreamID: {type: string, minLength: 1, description: Server-derived delivery stream identity}
                Priority: {type: integer, minimum: 0, maximum: 3}
                Epoch: {type: integer, format: uint64, minimum: 1}
                KnownSequence: {type: boolean, description: True when the durable loss report has an exact local WAL-record range; this never advances the transport-batch ACK}
                FromSequence: {type: integer, format: uint64, minimum: 0, description: First lost local WAL-record sequence when KnownSequence is true}
                ToSequence: {type: integer, format: uint64, minimum: 0, description: Last lost local WAL-record sequence when KnownSequence is true}
                Count: {type: integer, format: uint64, minimum: 1}
                Reason: {type: string, enum: [quota_eviction, quota_backpressure, corrupt_frame, torn_write, io_failure, unsynced_tail, state_recovery]}
                FromAt: {type: string, format: date-time}
                ToAt: {type: string, format: date-time}
                KeyID: {type: string, minLength: 1}
                Signature: {type: string, description: "Base64 Ed25519 signature produced by encoding/json for []byte"}
      responses:
        '200':
          description: Batch persisted/idempotently observed, or signed gap durably acknowledged
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required: [accepted, duplicate, ack, provenance, gap_open]
                  properties:
                    accepted: {type: boolean}
                    duplicate: {type: boolean}
                    ack: {type: integer, format: uint64, minimum: 0, description: Highest contiguous durably ingested transport-batch sequence}
                    provenance: {type: string}
                    gap_open: {type: boolean}
                - type: object
                  additionalProperties: false
                  required: [acknowledged, gap_id]
                  properties:
                    acknowledged: {type: boolean, const: true}
                    gap_id: {type: string, minLength: 1}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Fleet agent authentication failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Replay/incarnation, immutable gap identity, or stream-state conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: Encoded or decoded telemetry body exceeds the bounded transport limit, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '415': {description: Unsupported content encoding or explicit media type, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: Backpressure; the agent preserves WAL state and retries according to Retry-After, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/assets/{id}/desired-capabilities:
    parameters: [{$ref: '#/components/parameters/FleetAssetId'}]
    put:
      tags: [fleet]
      operationId: setFleetAssetDesiredCapabilities
      summary: Declare the capabilities a canonical host or cluster asset should have
      description: >
        Operator-owned desired state, deliberately separate from the capabilities an untrusted agent
        observes and advertises. The tenant comes from the authenticated principal, the asset from the
        path, and the actor from the authenticated principal; none of the three is a body field. The
        submitted list is normalized (trimmed, de-duplicated, sorted) before storage, so the stored set
        may be shorter than the one sent. Replacing an existing set increments Version within the same
        PolicyID; clearing and recreating mints a new PolicyID. Only host and cluster assets are
        accepted.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetFleetDesiredCapabilitiesRequest'}
      responses:
        '200':
          description: Stored desired-capability state after normalization
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FleetDesiredCapabilityState'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    get:
      tags: [fleet]
      operationId: getFleetAssetDesiredCapabilities
      summary: Read the desired capabilities declared for one asset
      description: Tenant comes from the authenticated principal; an asset with no declared intent answers 404.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current desired-capability state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FleetDesiredCapabilityState'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    delete:
      tags: [fleet]
      operationId: clearFleetAssetDesiredCapabilities
      summary: Clear the desired capabilities declared for one asset
      description: >
        Idempotent: an asset with no declared intent also answers 204. Clearing ends the policy
        lifecycle, so a later declaration receives a new PolicyID and Version 1.
      security:
      - bearerAuth: []
      responses:
        '204': {description: Desired capabilities cleared, or none were declared}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/desired-capabilities/gaps:
    get:
      tags: [fleet]
      operationId: listFleetDesiredCapabilityGaps
      summary: List desired capabilities not covered by a healthy bound agent
      description: >
        Reconciles every declared desired capability in the tenant against the current agent bindings
        and the observed agent fleet, and returns only the uncovered rows. The read is side-effect
        free. A capability is covered when a healthy bound agent advertises it; otherwise the row
        carries the most informative representative agent and a closed-set gap reason.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Uncovered desired capabilities, ordered by asset then capability
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FleetDesiredCapabilityGapList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/assets/{id}/processes:
    parameters: [{$ref: '#/components/parameters/FleetAssetId'}]
    post:
      tags: [fleet]
      operationId: reportFleetAssetProcesses
      summary: Report the running-process snapshot for one host asset
      description: >
        Upserts the reported snapshots by (tenant, asset, entity); re-reporting a process in place
        flips Running rather than adding a row. The tenant is the authenticated fleet tenant and the
        asset is the path id, so a report cannot claim another tenant's or asset's processes. At most
        10000 processes per report. Reporting also folds the profile into the asset's behavioural
        baseline when that learner is wired; a learn failure is logged and does not fail the report.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportFleetEndpointProcessesRequest'}
      responses:
        '200':
          description: Snapshots durably upserted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportFleetEndpointProcessesResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    get:
      tags: [fleet]
      operationId: listFleetAssetProcesses
      summary: List the currently running processes on one host asset
      description: Returns only snapshots whose Running flag is set, ordered by EntityID. An asset with none returns an empty array.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Running-process projection for the asset
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FleetEndpointProcessList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/assets/{id}/timeline:
    parameters: [{$ref: '#/components/parameters/FleetAssetId'}]
    get:
      tags: [fleet]
      operationId: queryFleetAssetTimeline
      summary: Query the endpoint state timeline for one host asset
      description: >
        Reads the per-asset projection of accepted telemetry, ordered by event time (when the
        transition happened on the host), never by ingest order. The tenant is the authenticated
        fleet tenant. Entries stay explainable after the raw telemetry that produced them expires.
      security:
      - bearerAuth: []
      parameters:
      - name: from
        in: query
        description: RFC 3339 inclusive lower bound on event time. Omit for no lower bound.
        schema: {type: string, format: date-time}
      - name: to
        in: query
        description: RFC 3339 inclusive upper bound on event time. Omit for no upper bound.
        schema: {type: string, format: date-time}
      - name: entity
        in: query
        description: Restrict the window to one endpoint entity id.
        schema: {type: string}
      - name: limit
        in: query
        description: >
          Maximum entries to return. An absent, unparsable, or non-positive value falls back to 500;
          a value above 5000 is clamped to 5000.
        schema: {type: integer, minimum: 1, maximum: 5000, default: 500}
      responses:
        '200':
          description: Event-time ordered timeline window
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FleetEndpointTimelineList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/assets/{id}/retro-hunt:
    parameters: [{$ref: '#/components/parameters/FleetAssetId'}]
    post:
      tags: [fleet]
      operationId: retroHuntFleetAssetTimeline
      summary: Re-hunt the endpoint timeline window around a pivot time
      description: >
        Read-only analysis: pivots to the transitions in [around - before_seconds, around +
        after_seconds] on the asset, optionally focused on one entity. Fail-closed on a missing pivot,
        a negative look-back or look-forward, or a zero-width window. Truncated is honest: the service
        queries one entry past the effective limit so a capped window is always reported as partial.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FleetRetroHuntRequest'}
      responses:
        '200':
          description: The surrounding timeline window
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FleetRetroHuntResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/engagements/{id}/legal-hold:
    parameters: [{$ref: '#/components/parameters/EngagementId'}]
    put:
      tags: [fleet]
      operationId: placeFleetLegalHold
      summary: Place a legal hold on an engagement's data
      description: >
        A hold suspends retention expiry: held data survives its retention window until the hold is
        released. Idempotent, so re-placing returns the existing active hold unchanged. The reason is
        mandatory for accountability; the placing operator and the tenant are server-side.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlaceFleetLegalHoldRequest'}
      responses:
        '200':
          description: The active hold, newly placed or already in force
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FleetLegalHold'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    delete:
      tags: [fleet]
      operationId: releaseFleetLegalHold
      summary: Release the active legal hold on an engagement's data
      description: >
        Idempotent: an engagement with no active hold also answers 204. The released hold is retained
        as append-only history so the hold and release trail stays auditable.
      security:
      - bearerAuth: []
      responses:
        '204': {description: Hold released, or none was active}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/legal-holds:
    get:
      tags: [fleet]
      operationId: listFleetLegalHolds
      summary: List the tenant's active legal holds
      description: Active holds only, ordered by engagement id. Tenant identity comes from the authenticated principal.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Active legal holds
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FleetLegalHoldList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/engagements/{id}/privacy-export:
    parameters: [{$ref: '#/components/parameters/EngagementId'}]
    get:
      tags: [fleet]
      operationId: exportFleetEngagementPrivacyData
      summary: Export the governance data held for one engagement
      description: >
        Data-subject and DPO export: the detection projection rows the control plane holds for the
        engagement plus the active legal holds covering them. Read-only and mutates nothing; the
        immutable evidence chain is untouched. The export itself is an audited governance access, so
        an audit-write failure fails the request rather than returning an unlogged bundle.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The export bundle
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FleetPrivacyExportBundle'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/engagements/{id}/detection-data:
    parameters: [{$ref: '#/components/parameters/EngagementId'}]
    delete:
      tags: [fleet]
      operationId: purgeFleetEngagementDetectionData
      summary: Delete an engagement's detection projection on demand
      description: >
        Right-to-erasure over the queryable projection only: the append-only evidence chain is
        preserved. Destructive and irreversible for the projection, so a reason is mandatory and the
        deletion is audited with actor and reason. Fail-closed on a legal hold, which answers 403:
        preservation trumps erasure. An engagement with no detection rows answers 200 with a zero
        count.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PurgeFleetDetectionDataRequest'}
      responses:
        '200':
          description: Projection rows deleted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurgeFleetDetectionDataResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/engagements/{id}/correlate:
    parameters: [{$ref: '#/components/parameters/EngagementId'}]
    post:
      tags: [fleet]
      operationId: correlateFleetEngagementDetections
      summary: Fold an engagement's sealed detections into incidents
      description: >
        No request body: the detections are read server-side and the actor is the authenticated
        principal. Idempotent, because the correlator mints deterministic incident ids, so a re-run
        over the same detections creates nothing new. Tri-scoring each new incident is best-effort
        when the reassessor is wired: a scoring failure never rolls back a durably recorded incident,
        it is counted in reassess_failed so a caller sees that scoring was partial.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The incidents created by this pass and how many were scored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FleetCorrelationResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/fleet/incidents/{id}/risk/reassess:
    parameters: [{$ref: '#/components/parameters/FleetIncidentId'}]
    post:
      tags: [fleet]
      operationId: reassessFleetIncidentRisk
      summary: Re-run the tri-score risk assessment for one incident
      description: >
        No request body: the Threat, Exposure, Behaviour and telemetry Coverage factors are gathered
        server-side and the actor is the authenticated principal. The deterministic scorer records a
        RiskAssessment as an event on the append-only incident log and the updated projection is
        returned. Risk, Confidence and Coverage stay separate fields: missing coverage lowers
        Coverage, never Risk.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The incident projection with its new risk assessment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FleetIncident'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /api/v1/users:
    get:
      tags: [users]
      summary: List the operators of the caller's own tenant
      description: >
        Requires the `administer` capability (admin role). The roster is scoped to the caller's
        tenant; no caller lists another tenant's operators. The API-key hash is never serialized.
      responses:
        "200":
          description: The tenant's operators
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/User"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [users]
      summary: Provision an operator and return its API key once
      description: >
        Requires the `administer` capability. The key is shown exactly once and is not recoverable.
        `tenant_id` defaults to the caller's own tenant; a different tenant is refused with `403`
        unless the caller is the bootstrap platform principal, which is the only identity allowed to
        seed another tenant's first admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateUserRequest"}
      responses:
        "201":
          description: Created; the API key is returned once
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserWithAPIKey"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Missing the administer capability, or the requested tenant is not the caller's own}

  /api/v1/users/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    patch:
      tags: [users]
      summary: Update an operator's name and role
      description: >
        Requires the `administer` capability. An omitted or empty field is left unchanged. Demoting
        the tenant's last enabled admin is refused with `409`, so a tenant cannot be locked out.
        Deleting an operator is deliberately not offered: an identity owns its audit, evidence, and
        finding attribution, so access is revoked by disabling the account or rotating its key.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateUserRequest"}
      responses:
        "200":
          description: The updated operator
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: The change would leave the tenant with no enabled admin}

  /api/v1/users/{id}/disable:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    post:
      tags: [users]
      summary: Disable an operator's credentials
      description: >
        Requires the `administer` capability. The identity and its attribution are preserved; only
        authentication stops, immediately, for the operator's API key. Disabling the tenant's last
        enabled admin is refused with `409`.
      responses:
        "200":
          description: The disabled operator
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: The operator is the tenant's last enabled admin}

  /api/v1/users/{id}/enable:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    post:
      tags: [users]
      summary: Re-enable a disabled operator
      description: Requires the `administer` capability. The operator keeps the API key it had.
      responses:
        "200":
          description: The re-enabled operator
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/users/{id}/rotate-key:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    post:
      tags: [users]
      summary: Rotate an operator's API key and return the new key once
      description: >
        Requires the `administer` capability. The previous key stops authenticating immediately,
        which is how a leaked key is revoked. The new key is shown exactly once.
      responses:
        "200":
          description: The operator and its new API key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserWithAPIKey"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Human/operator API token.
    fleetAgentAuth:
      type: http
      scheme: bearer
      description: Enrolled fleet-agent bearer credential. A deployment may instead authenticate through its configured trusted mTLS proxy path.

  parameters:
    FleetProtocolVersion:
      name: X-Synapse-Fleet-Proto
      in: header
      required: true
      description: Fleet transport protocol version. Only version 1 is accepted; unsupported values fail closed.
      schema: {type: string, const: "1"}
    EngagementId:
      name: id
      in: path
      required: true
      schema: {type: string}
    DetectionId:
      name: did
      in: path
      required: true
      schema: {type: string, minLength: 1}
    FindingId:
      name: fid
      in: path
      required: true
      schema: {type: string, minLength: 1}
    AgentId:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    FleetAssetId:
      name: id
      in: path
      required: true
      description: Canonical host or cluster asset identifier
      schema: {type: string, minLength: 1}
    FleetIncidentId:
      name: id
      in: path
      required: true
      description: Phase-C incident identifier
      schema: {type: string, minLength: 1}
    SigningKeyId:
      name: keyID
      in: path
      required: true
      schema: {type: string, minLength: 1}
    BusinessAssetId:
      name: assetID
      in: path
      required: true
      schema: {type: string, minLength: 1}
    HostAssetId:
      name: assetID
      in: path
      required: true
      description: Server-issued id of a Kind=host fleet asset.
      schema: {type: string, minLength: 1}
    AITriageReviewId:
      name: rid
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ProjectKey:
      name: key
      in: path
      required: true
      description: Unique identifier of the project
      schema:
        type: string
        pattern: ^[a-z0-9_-]+$
    AnalysisId:
      name: id
      in: path
      required: true
      description: Immutable Project analysis identifier
      schema: {type: string, minLength: 1}
    LensParam:
      name: lens
      in: query
      description: Filter by lens (overall or new-code)
      schema:
        type: string
        enum:
        - overall
        - new-code
    VulnerabilityAdvisoryId:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    VulnerabilityOccurrenceId:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    VulnerabilityRunId:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    VulnerabilitySourceId:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    VulnerabilityLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    VulnerabilityCursorTime:
      name: before_time
      in: query
      schema: {type: string, format: date-time}
      description: RFC 3339 timestamp; must be supplied together with `before_id`
    VulnerabilityCursorId:
      name: before_id
      in: query
      schema: {type: string}
      description: Stable tie-breaker; must be supplied together with `before_time`

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: AUP not accepted, or target outside scope / authorization window
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Request conflicts with immutable or current resource state
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    DetectionProvenanceStatus:
      type: string
      enum: [pending, complete, expired, broken]

    DetectionProvenanceCurrent:
      type: object
      additionalProperties: false
      required: [tenant_id, engagement_id, detection_id, status, updated_at]
      properties:
        tenant_id: {type: string, minLength: 1}
        engagement_id: {type: string, minLength: 1}
        detection_id: {type: string, minLength: 1}
        status: {$ref: '#/components/schemas/DetectionProvenanceStatus'}
        evidence_id: {type: string, minLength: 1}
        updated_at: {type: string, format: date-time}

    DetectionProvenanceList:
      type: object
      additionalProperties: false
      required: [provenance]
      properties:
        provenance:
          type: array
          items: {$ref: '#/components/schemas/DetectionProvenanceCurrent'}

    DetectionProvenanceTransitionKind:
      type: string
      enum: [received, telemetry_durable, commitment_pending, commitment_sealed, acknowledged, expired, broken]

    TelemetryReference:
      type: object
      additionalProperties: false
      required: [stream_id, epoch, sequence, event_id, digest]
      properties:
        stream_id: {type: string, minLength: 1}
        epoch: {type: integer, format: uint64, minimum: 1}
        sequence: {type: integer, format: uint64, minimum: 1}
        event_id: {type: string, minLength: 1}
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}

    DetectionProvenanceTransition:
      type: object
      additionalProperties: false
      required: [tenant_id, engagement_id, detection_id, sequence, kind, status, occurred_at]
      properties:
        tenant_id: {type: string, minLength: 1}
        engagement_id: {type: string, minLength: 1}
        detection_id: {type: string, minLength: 1}
        sequence: {type: integer, format: uint64, minimum: 1}
        kind: {$ref: '#/components/schemas/DetectionProvenanceTransitionKind'}
        status: {$ref: '#/components/schemas/DetectionProvenanceStatus'}
        evidence_id: {type: string, minLength: 1}
        telemetry_refs:
          type: array
          items: {$ref: '#/components/schemas/TelemetryReference'}
        agent_id: {type: string, minLength: 1}
        asset_id: {type: string, minLength: 1}
        reason: {type: string}
        occurred_at: {type: string, format: date-time}

    DetectionProvenanceTransitionList:
      type: object
      additionalProperties: false
      required: [transitions]
      properties:
        transitions:
          type: array
          items: {$ref: '#/components/schemas/DetectionProvenanceTransition'}

    CoverageClassState:
      type: object
      additionalProperties: false
      required: [class, host_id, agent_id, state, since]
      properties:
        class: {type: string, enum: [process, network, file, privilege]}
        host_id: {type: string, minLength: 1}
        agent_id: {type: string, minLength: 1}
        state: {type: string, enum: [active, degraded, failed, disabled]}
        reason: {type: string}
        since: {type: string, format: date-time}

    CoverageVector:
      type: object
      additionalProperties: false
      required: [process, network, file, privilege, reasons]
      properties:
        process: {type: integer, minimum: 0, maximum: 100}
        network: {type: integer, minimum: 0, maximum: 100}
        file: {type: integer, minimum: 0, maximum: 100}
        privilege: {type: integer, minimum: 0, maximum: 100}
        reasons:
          type: array
          items: {type: string}

    PrivacyPolicy:
      type: object
      additionalProperties: false
      required: [dispositions, redact_secrets, max_arg_len, max_arg_count, max_path_len, version]
      properties:
        dispositions:
          type: object
          description: Closed-set source field categories mapped to allow, redact, hash, or drop. Omitted categories use the server-defined allow behavior subject to the non-relaxable source-privacy floor.
          propertyNames:
            enum: [process_arg, process_path, process_comm, process_env, file_path, file_comm, network_comm, privilege_comm]
          additionalProperties:
            type: string
            enum: [allow, redact, hash, drop]
        redact_secrets: {type: boolean, description: Scrub recognized secret patterns before telemetry WAL serialization}
        max_arg_len: {type: integer, minimum: 0, description: Maximum retained argument length; zero means unbounded subject to the source-privacy floor}
        max_arg_count: {type: integer, minimum: 0, description: Maximum retained argument count; zero means unbounded subject to the source-privacy floor}
        max_path_len: {type: integer, minimum: 0, description: Maximum retained path length; zero means unbounded subject to the source-privacy floor}
        hash_salt: {type: string, description: Sensitive. Salt for hash-disposition pseudonymization; required on admission when any category uses hash. Returned ONLY on the agent-authenticated policy route, because agents hash at the source. The human read routes (active pointer, history, admission echo) always omit it, since a principal who can read hashed telemetry and also learn the salt could de-anonymize it offline. Identify a policy by its digest instead.}
        version: {type: string, minLength: 1, description: Immutable policy-version alias; not part of the redaction behavior digest}

    PrivacyPolicyAssignment:
      type: object
      additionalProperties: false
      required: [tenant_id, policy, digest, created_by, created_at]
      properties:
        tenant_id: {type: string, minLength: 1}
        policy: {$ref: '#/components/schemas/PrivacyPolicy'}
        digest: {type: string, pattern: '^[0-9a-f]{64}$', description: Immutable assignment digest}
        created_by: {type: string, minLength: 1}
        created_at: {type: string, format: date-time}

    PrivacyPolicyAdmissionRequest:
      type: object
      additionalProperties: false
      required: [policy]
      properties:
        policy: {$ref: '#/components/schemas/PrivacyPolicy'}

    PrivacyPolicyAdmissionResponse:
      type: object
      additionalProperties: false
      required: [assignment, created]
      properties:
        assignment: {$ref: '#/components/schemas/PrivacyPolicyAssignment'}
        created: {type: boolean}

    PrivacyPolicyAssignmentEnvelope:
      type: object
      additionalProperties: false
      required: [assignment]
      properties:
        assignment: {$ref: '#/components/schemas/PrivacyPolicyAssignment'}

    PrivacyPolicyHistoryResponse:
      type: object
      additionalProperties: false
      required: [assignments]
      properties:
        assignments:
          type: array
          items: {$ref: '#/components/schemas/PrivacyPolicyAssignment'}

    PrivacyPolicyActivationRequest:
      type: object
      additionalProperties: false
      required: [digest, operation_id]
      properties:
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        operation_id: {type: string, minLength: 1, description: Stable idempotency identity for this activation transition}

    CoverageWindow:
      type: object
      additionalProperties: false
      required: [asset_id, agent_id, host_id, since, until, input_digest, revision, created_at, states, sampled_count, truncated_count, dropped_count, gap_count, batch_count, coverage]
      properties:
        asset_id: {type: string, minLength: 1}
        agent_id: {type: string, minLength: 1}
        host_id: {type: string, minLength: 1}
        since: {type: string, format: date-time, description: Inclusive coverage-window lower bound}
        until: {type: string, format: date-time, description: Exclusive coverage-window upper bound}
        input_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        revision: {type: string, pattern: '^[0-9a-f]{64}$'}
        created_at: {type: string, format: date-time}
        states:
          type: array
          items: {$ref: '#/components/schemas/CoverageClassState'}
        sampled_count: {type: integer, minimum: 0}
        truncated_count: {type: integer, minimum: 0}
        dropped_count: {type: integer, minimum: 0}
        gap_count: {type: integer, minimum: 0}
        batch_count: {type: integer, minimum: 0}
        coverage: {$ref: '#/components/schemas/CoverageVector'}

    CoverageWindowList:
      type: object
      additionalProperties: false
      required: [coverage_windows]
      properties:
        coverage_windows:
          type: array
          items: {$ref: '#/components/schemas/CoverageWindow'}

    SensorClassCoverage:
      type: object
      additionalProperties: false
      required: [Class, HostID, AgentID, State, Since]
      properties:
        Class: {type: string, enum: [process, network, file, privilege]}
        HostID: {type: string, minLength: 1}
        AgentID: {type: string, minLength: 1}
        State: {type: string, enum: [active, degraded, failed, disabled]}
        Reason: {type: string}
        Since: {type: string, format: date-time}

    SensorStateReport:
      type: object
      additionalProperties: false
      required: [ProtocolVersion, ReportID, AgentID, HostID, AgentSessionID, AssetID, Kind, ObservedAt, SchemaVersion, PayloadDigest, States, KeyID, Signature]
      properties:
        ProtocolVersion: {type: integer, const: 1}
        ReportID: {type: string, minLength: 1}
        AgentID: {type: string, minLength: 1, description: Must equal the authenticated fleet-agent identity}
        HostID: {type: string, minLength: 1, description: Must equal the enrolled agent host identity}
        AgentSessionID: {type: string, minLength: 1, description: Must equal the current enrollment session}
        AssetID: {type: string, minLength: 1, description: Must equal the server-authoritative asset binding}
        Kind: {type: string, enum: [coverage, sensor_state]}
        ObservedAt: {type: string, format: date-time}
        SchemaVersion: {type: integer, minimum: 1}
        PayloadDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
        States:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/SensorClassCoverage'}
        KeyID: {type: string, minLength: 1}
        Signature: {type: string, contentEncoding: base64}

    SensorStateAcknowledgement:
      type: object
      additionalProperties: false
      required: [acknowledged, report_id]
      properties:
        acknowledged: {type: boolean, const: true}
        report_id: {type: string, minLength: 1}

    AgentSigningKeyRegistration:
      type: object
      additionalProperties: false
      required: [public_key, purpose, not_before, not_after, proof]
      properties:
        public_key: {type: string, contentEncoding: base64, description: Raw 32-byte Ed25519 public key}
        purpose: {type: string, enum: [telemetry-batch, detection-batch, response-result]}
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}
        proof: {type: string, contentEncoding: base64, description: Ed25519 signature over the purpose-bound key binding message}

    AgentSigningKeyRegistrationResult:
      type: object
      required: [key_id, agent_id, purpose, not_before, not_after]
      properties:
        key_id: {type: string}
        agent_id: {type: string}
        purpose: {type: string, enum: [telemetry-batch, detection-batch, response-result]}
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}

    AgentSigningKeySummary:
      type: object
      required: [key_id, purpose, algorithm, not_before, not_after, revoked, replaced_by]
      properties:
        key_id: {type: string}
        purpose: {type: string, enum: [telemetry-batch, detection-batch, response-result]}
        algorithm: {type: string, const: ed25519}
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}
        revoked: {type: boolean}
        replaced_by: {type: string}

    AgentSigningKeyList:
      type: object
      required: [agent_id, keys]
      properties:
        agent_id: {type: string}
        keys:
          type: array
          items: {$ref: '#/components/schemas/AgentSigningKeySummary'}

    DetectionBatchRefV2:
      type: object
      additionalProperties: false
      required: [id, content_sha256, asset_id, telemetry_refs, rulepack, redaction_policy_digest]
      properties:
        id: {type: string, minLength: 1}
        content_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        asset_id: {type: string, minLength: 1}
        telemetry_refs:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/TelemetryReference'}
        rulepack: {$ref: '#/components/schemas/RulepackReference'}
        redaction_policy_digest: {type: string, pattern: '^[0-9a-f]{64}$'}

    RulepackReference:
      type: object
      additionalProperties: false
      required: [id, version, digest]
      properties:
        id: {type: string, minLength: 1}
        version: {type: integer, minimum: 1}
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}

    AgentDetectionBatchV2:
      type: object
      additionalProperties: false
      required: [context, version, agent_id, engagement_id, sequence, key_id, signature, detections]
      properties:
        context: {type: string, const: 'synapse-agent-detection-batch:v2'}
        version: {type: integer, const: 2}
        agent_id: {type: string, description: Must equal the authenticated agent identity}
        engagement_id: {type: string, minLength: 1}
        sequence: {type: integer, format: uint64, minimum: 1}
        key_id: {type: string, minLength: 1}
        signature: {type: string, contentEncoding: base64}
        detections:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/DetectionBatchRefV2'}

    DetectionBatchItemV2:
      type: object
      additionalProperties: false
      required: [id, detection, asset_id, telemetry_refs, rulepack, redaction_policy_digest]
      properties:
        id: {type: string, minLength: 1}
        detection:
          type: object
          description: Typed detection.Detection body whose canonical attribution must match its signed V2 reference.
          additionalProperties: true
        asset_id: {type: string, minLength: 1}
        telemetry_refs:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/TelemetryReference'}
        rulepack: {$ref: '#/components/schemas/RulepackReference'}
        redaction_policy_digest: {type: string, pattern: '^[0-9a-f]{64}$'}

    AgentDetectionBatchRequest:
      type: object
      additionalProperties: false
      required: [batch_v2, items_v2]
      properties:
        batch_v2: {$ref: '#/components/schemas/AgentDetectionBatchV2'}
        items_v2:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/DetectionBatchItemV2'}

    AgentDetectionBatchResult:
      type: object
      required: [engagement_id, sealed, skipped, missing, replay]
      properties:
        engagement_id: {type: string}
        sealed: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0}
        missing: {type: integer, format: uint64, minimum: 0}
        replay: {type: boolean}

    SetFleetDesiredCapabilitiesRequest:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: array
          description: >
            Capability names the asset should have. At most 256 raw entries are accepted; blank
            entries are dropped and the rest are trimmed, de-duplicated and sorted, after which at
            most 64 distinct names may remain. An empty canonical result is rejected: clear the
            intent with DELETE instead.
          maxItems: 256
          items: {type: string, maxLength: 128}

    FleetDesiredCapabilityState:
      type: object
      description: Serialized from the domain struct (PascalCase keys).
      required: [TenantID, AssetID, PolicyID, Capabilities, UpdatedBy, Version, Audit]
      properties:
        TenantID: {type: string}
        AssetID: {type: string, description: The canonical host or cluster asset the intent is declared for.}
        PolicyID: {type: string, description: Stable for the life of one policy; clearing and recreating mints a new one.}
        Capabilities:
          type: array
          description: Canonical form; trimmed, unique and sorted.
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 128}
        UpdatedBy: {type: string}
        Version: {type: integer, format: int64, minimum: 1, description: Starts at 1 and increments once per semantic replacement within the PolicyID lifecycle.}
        Audit:
          type: object
          properties:
            CreatedAt: {type: string, format: date-time}
            UpdatedAt: {type: string, format: date-time}
            CreatedBy: {type: string}
            UpdatedBy: {type: string}

    FleetAgentHealth:
      type: string
      description: Derived liveness of a fleet agent. Stale is first-class; an idle agent is never reported as healthy.
      enum: [healthy, stale, revoked, decommissioned]

    FleetDesiredCapabilityGapReason:
      type: string
      description: Closed set naming why a desired capability is not covered by a healthy bound agent.
      enum: [agent_missing, agent_stale, agent_revoked, agent_decommissioned, capability_missing]

    FleetDesiredCapabilityGap:
      type: object
      required: [asset_id, policy_id, policy_version, capability, covered, last_seen]
      properties:
        asset_id: {type: string}
        policy_id: {type: string}
        policy_version: {type: integer, format: int64, minimum: 1}
        agent_id:
          type: string
          description: >
            The witness that satisfied the capability, or the best available representative when it is
            uncovered. Absent when no current agent is bound to the asset.
        capability: {type: string}
        agent_health: {$ref: '#/components/schemas/FleetAgentHealth'}
        covered: {type: boolean}
        gap_reason: {$ref: '#/components/schemas/FleetDesiredCapabilityGapReason'}
        detail: {type: string, description: Human-readable explanation of the gap.}
        last_seen:
          type: string
          format: date-time
          description: Last heartbeat of the representative agent; the zero time when no observed agent row backs the row.

    FleetDesiredCapabilityGapList:
      type: object
      required: [gaps]
      properties:
        gaps: {type: array, items: {$ref: '#/components/schemas/FleetDesiredCapabilityGap'}}

    ReportFleetEndpointProcessesRequest:
      type: object
      required: [processes]
      properties:
        processes:
          type: array
          maxItems: 10000
          items:
            type: object
            required: [entity_id]
            properties:
              entity_id: {type: string, minLength: 1, description: Stable endpoint entity id; the upsert key together with the server-side tenant and asset.}
              pid: {type: integer, minimum: 0}
              comm: {type: string, description: Short kernel command name.}
              path: {type: string, description: Resolved executable path.}
              running: {type: boolean, description: False marks a process that has exited; the row is kept and flipped in place.}
              last_seen_at: {type: string, format: date-time}

    ReportFleetEndpointProcessesResult:
      type: object
      required: [saved]
      properties:
        saved: {type: integer, minimum: 0, description: Number of snapshots upserted.}

    FleetEndpointProcess:
      type: object
      description: Serialized from the port struct (PascalCase keys).
      required: [TenantID, AssetID, EntityID, PID, Comm, Path, Running, LastSeenAt]
      properties:
        TenantID: {type: string}
        AssetID: {type: string}
        EntityID: {type: string}
        PID: {type: integer, minimum: 0}
        Comm: {type: string}
        Path: {type: string}
        Running: {type: boolean}
        LastSeenAt: {type: string, format: date-time}

    FleetEndpointProcessList:
      type: object
      required: [processes]
      properties:
        processes: {type: array, items: {$ref: '#/components/schemas/FleetEndpointProcess'}}

    FleetEndpointEntityKind:
      type: string
      enum: [process, network, file, identity, container]

    FleetEndpointTimelineEntryKind:
      type: string
      enum: [process_start, process_exec, network_connect, file_open, file_write, file_rename, privilege_change]

    FleetEndpointTimelineEntry:
      type: object
      description: Serialized from the domain struct (PascalCase keys). One endpoint state transition, ordered by event time.
      required: [OccurredAt, TenantID, AssetID, EntityKind, EntityID, Kind, EventID, Summary]
      properties:
        OccurredAt: {type: string, format: date-time, description: When the transition happened on the host, never the ingest time.}
        TenantID: {type: string}
        AssetID: {type: string}
        EntityKind: {$ref: '#/components/schemas/FleetEndpointEntityKind'}
        EntityID: {type: string}
        Kind: {$ref: '#/components/schemas/FleetEndpointTimelineEntryKind'}
        EventID: {type: string, description: Source envelope event id; the dedupe key and the tiebreak for transitions sharing OccurredAt.}
        Summary: {type: string, description: Self-contained description, so the entry stays explainable after the raw telemetry expires.}

    FleetEndpointTimelineList:
      type: object
      required: [entries]
      properties:
        entries: {type: array, items: {$ref: '#/components/schemas/FleetEndpointTimelineEntry'}}

    FleetRetroHuntRequest:
      type: object
      required: [around]
      properties:
        around: {type: string, format: date-time, description: The pivot time to hunt around. Required.}
        before_seconds: {type: integer, format: int64, minimum: 0, default: 0, description: Look-back from the pivot. At least one of before_seconds and after_seconds must be positive.}
        after_seconds: {type: integer, format: int64, minimum: 0, default: 0, description: Look-forward from the pivot. At least one of before_seconds and after_seconds must be positive.}
        entity_id: {type: string, description: Optionally focus the hunt on one entity's transitions.}
        limit: {type: integer, minimum: 0, default: 0, description: Caps the entries returned. Zero or negative applies the default bound of 1000.}

    FleetRetroHuntResult:
      type: object
      description: Serialized from the usecase struct (PascalCase keys).
      required: [AssetID, From, To, Entries, Truncated]
      properties:
        AssetID: {type: string}
        From: {type: string, format: date-time, description: Pivot minus before_seconds.}
        To: {type: string, format: date-time, description: Pivot plus after_seconds.}
        Entries:
          type: [array, "null"]
          items: {$ref: '#/components/schemas/FleetEndpointTimelineEntry'}
        Truncated: {type: boolean, description: The effective limit capped the window, so the view is partial.}

    PlaceFleetLegalHoldRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, description: Why the data must be preserved. Mandatory for accountability.}

    FleetLegalHold:
      type: object
      description: Serialized from the domain struct (PascalCase keys). Active while ReleasedAt is the zero time.
      required: [TenantID, EngagementID, Reason, PlacedBy, PlacedAt, ReleasedBy, ReleasedAt]
      properties:
        TenantID: {type: string}
        EngagementID: {type: string}
        Reason: {type: string}
        PlacedBy: {type: string}
        PlacedAt: {type: string, format: date-time}
        ReleasedBy: {type: string, description: Empty while the hold is active.}
        ReleasedAt: {type: string, format: date-time, description: The zero time while the hold is active.}

    FleetLegalHoldList:
      type: object
      required: [holds]
      properties:
        holds:
          type: [array, "null"]
          description: Null rather than an empty array when the tenant holds none.
          items: {$ref: '#/components/schemas/FleetLegalHold'}

    PurgeFleetDetectionDataRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, description: Why the projection is being deleted. Mandatory; recorded in the audit log with the actor.}

    PurgeFleetDetectionDataResult:
      type: object
      required: [purged]
      properties:
        purged: {type: integer, minimum: 0, description: Number of detection projection rows deleted.}

    FleetDetectionClass:
      type: string
      enum: [process, network, file, privilege]

    FleetDetectionEvent:
      type: object
      description: >
        Serialized from the domain struct (PascalCase keys). Exactly one per-class payload is present;
        the other three are null, and the one present always matches Class.
      required: [Class, At, Host]
      properties:
        Class: {$ref: '#/components/schemas/FleetDetectionClass'}
        At: {type: string, format: date-time}
        Host: {type: string}
        Process:
          type: [object, "null"]
          properties:
            PID: {type: integer}
            PPID: {type: integer}
            Comm: {type: string}
            Path: {type: string}
            Args: {type: [array, "null"], items: {type: string}}
            UID: {type: integer}
        Network:
          type: [object, "null"]
          properties:
            Proto: {type: string, enum: [tcp, udp]}
            RemoteAddr: {type: string}
            RemotePort: {type: integer}
            Direction: {type: string, enum: [egress, ingress]}
            PID: {type: integer}
            Comm: {type: string}
        File:
          type: [object, "null"]
          properties:
            Path: {type: string}
            Op: {type: string, enum: [read, write, open, unlink]}
            PID: {type: integer}
            Comm: {type: string}
        Privilege:
          type: [object, "null"]
          properties:
            PID: {type: integer}
            Comm: {type: string}
            FromUID: {type: integer}
            ToUID: {type: integer}
            Cap: {type: string, description: Capability gained, if any.}
            Kind: {type: string, enum: [setuid, setgid, capset]}

    FleetDetection:
      type: object
      description: Serialized from the domain struct (PascalCase keys). What a matched rule emitted, with full attribution.
      required: [RuleID, RuleVersion, Class, Severity, HostID, AgentID, Evidence, Truncated, ObservedCount, Observed]
      properties:
        RuleID: {type: string, minLength: 1}
        RuleVersion: {type: integer, minimum: 1}
        Class: {$ref: '#/components/schemas/FleetDetectionClass'}
        Severity: {type: string, enum: [critical, high, medium, low, info], description: A stored detection never carries the unknown severity; ingest rejects it.}
        HostID: {type: string, minLength: 1}
        AgentID: {type: string, minLength: 1}
        Evidence:
          type: array
          description: The triggering event plus surrounding context. A detection with no evidence is a claim, not a detection, so at least one event is always present.
          minItems: 1
          maxItems: 64
          items: {$ref: '#/components/schemas/FleetDetectionEvent'}
        Truncated: {type: boolean, description: The evidence window was capped, so Evidence is not the complete sequence.}
        ObservedCount: {type: integer, description: Events seen before truncation; at least the length of Evidence.}
        Observed: {type: string, format: date-time}

    FleetDetectionRecord:
      type: object
      description: Serialized from the domain struct (PascalCase keys). One sealed, chain-linked detection projection row.
      required: [ID, TenantID, EngagementID, AssetID, AgentID, Detection, EvidenceID, BatchSeq, RecordedAt, ExpiresAt]
      properties:
        ID: {type: string}
        TenantID: {type: string}
        EngagementID: {type: string}
        AssetID: {type: string, description: The asset the detection was observed on.}
        AgentID: {type: string}
        Detection: {$ref: '#/components/schemas/FleetDetection'}
        EvidenceID: {type: string, description: The evidence-chain link that sealed this detection.}
        BatchSeq: {type: integer, format: int64, minimum: 0, description: The agent batch sequence the detection arrived in.}
        RecordedAt: {type: string, format: date-time}
        ExpiresAt: {type: string, format: date-time, description: The zero time means the row never expires; a set value is enforced by audited retention.}

    FleetPrivacyExportBundle:
      type: object
      required: [engagement_id, generated_at, detections, legal_holds, detection_count]
      properties:
        engagement_id: {type: string}
        generated_at: {type: string, format: date-time}
        detections:
          type: [array, "null"]
          description: Null rather than an empty array when the engagement holds no detection rows.
          items: {$ref: '#/components/schemas/FleetDetectionRecord'}
        legal_holds:
          type: [array, "null"]
          description: Active holds covering this engagement's data; null when there are none.
          items: {$ref: '#/components/schemas/FleetLegalHold'}
        detection_count: {type: integer, minimum: 0}

    FleetIncidentState:
      type: string
      description: Where the incident sits in the response workflow. Independent of Disposition and of risk.
      enum: [new, open, triaged, investigating, contained, remediated, resolved, closed, reopened]

    FleetIncidentDisposition:
      type: string
      description: The analyst's verdict. Independent of State and never mutates the risk score.
      enum: [unknown, true_positive, benign_positive, false_positive, duplicate, test]

    FleetRiskScore:
      type: integer
      description: Normalized 0..100 factor, integer so scoring stays deterministic and reproducible.
      minimum: 0
      maximum: 100

    FleetIncidentRiskAssessment:
      type: object
      description: >
        Serialized from the domain struct (PascalCase keys). Risk, Confidence and Coverage are three
        different things and are carried separately: missing coverage lowers Coverage, never Risk.
      required: [AssessmentID, IncidentRevision, ScorerVersion, PolicyVersion, InputSnapshotHash, Risk, Confidence, Coverage, CoverageVector, Context, FactorContributions, ReasonCodes, CreatedAt]
      properties:
        AssessmentID: {type: string}
        IncidentRevision: {type: integer}
        ScorerVersion: {type: string}
        PolicyVersion: {type: string}
        InputSnapshotHash: {type: string, description: With ScorerVersion and PolicyVersion, makes the assessment reproducible and auditable.}
        Risk: {$ref: '#/components/schemas/FleetRiskScore'}
        Confidence: {$ref: '#/components/schemas/FleetRiskScore'}
        Coverage: {$ref: '#/components/schemas/FleetRiskScore'}
        CoverageVector:
          type: object
          description: Coverage per telemetry class, never averaged into a scalar.
          properties:
            Process: {$ref: '#/components/schemas/FleetRiskScore'}
            Network: {$ref: '#/components/schemas/FleetRiskScore'}
            File: {$ref: '#/components/schemas/FleetRiskScore'}
            Privilege: {$ref: '#/components/schemas/FleetRiskScore'}
            Reasons: {type: [array, "null"], items: {type: string}}
        Context:
          type: object
          description: The three independent risk factors. Exposure and Behavior are zero until those pillars fill them.
          properties:
            Threat: {$ref: '#/components/schemas/FleetRiskScore'}
            Exposure: {$ref: '#/components/schemas/FleetRiskScore'}
            Behavior: {$ref: '#/components/schemas/FleetRiskScore'}
        FactorContributions:
          type: [array, "null"]
          description: Weighted inputs to Risk, each with a human reason, so a score is explainable.
          items:
            type: object
            properties:
              Factor: {type: string}
              Points: {$ref: '#/components/schemas/FleetRiskScore'}
              Reason: {type: string}
        ReasonCodes: {type: [array, "null"], items: {type: string}}
        CreatedAt: {type: string, format: date-time}

    FleetIncident:
      type: object
      description: >
        Serialized from the domain struct (PascalCase keys). The projection folded from the incident's
        append-only event log, which remains the source of truth.
      required: [ID, AssetID, Title, Severity, State, Disposition, OwnerID, DetectionIDs, Risk, MergedInto, Comments, Responses, Revision, CreatedAt, UpdatedAt]
      properties:
        ID: {type: string}
        AssetID: {type: string}
        Title: {type: string}
        Severity: {type: string, enum: ["", critical, high, medium, low, info, unknown], description: Empty when the created event carried no severity; the fold accepts that and the scorer abstains on it.}
        State: {$ref: '#/components/schemas/FleetIncidentState'}
        Disposition: {$ref: '#/components/schemas/FleetIncidentDisposition'}
        OwnerID: {type: string, description: Empty until an owner is assigned.}
        DetectionIDs:
          type: [array, "null"]
          description: Every detection folded in, so an auditor can descend to the individual hash-chained records.
          items: {type: string}
        Risk:
          description: Null until a risk assessment has been recorded on the log.
          anyOf: [{$ref: '#/components/schemas/FleetIncidentRiskAssessment'}, {type: 'null'}]
        MergedInto: {type: string, description: Empty unless the incident was merged into another.}
        Comments:
          type: [array, "null"]
          items:
            type: object
            properties:
              At: {type: string, format: date-time}
              Actor: {type: string}
              Text: {type: string}
        Responses:
          type: [array, "null"]
          description: Governed response actions linked to the incident, with whether their post-condition was telemetry-verified.
          items:
            type: object
            properties:
              ActionID: {type: string}
              Verified: {type: boolean}
        Revision: {type: integer, description: The number of events folded, so a projection is comparable to any point in the log.}
        CreatedAt: {type: string, format: date-time}
        UpdatedAt: {type: string, format: date-time}

    FleetCorrelationResult:
      type: object
      required: [created, reassessed, reassess_failed]
      properties:
        created:
          type: [array, "null"]
          description: The incidents this pass recorded. Null when the pass created none.
          items: {$ref: '#/components/schemas/FleetIncident'}
        reassessed: {type: integer, minimum: 0, description: How many of the created incidents were tri-scored.}
        reassess_failed: {type: integer, minimum: 0, description: How many scoring attempts failed; the incidents are still recorded.}

    EngagementTransitionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, completed, archived]
          description: Target lifecycle status. draft is the creation state and cannot be returned to.

    Capability:
      type: object
      required: [key, name, enabled, switch]
      properties:
        key:
          type: string
          description: Stable subsystem identifier a client keys its navigation off.
          example: fleet
        name:
          type: string
          description: Human name for display.
          example: Agent fleet transport
        enabled:
          type: boolean
          description: Whether this deployment serves the subsystem's routes.
        switch:
          type: string
          description: The SYNAPSE_* environment variable an operator sets to change `enabled`.
          example: SYNAPSE_FLEET_ENABLED
        requires:
          type: array
          description: >
            Keys of the capabilities this one depends on. Present only when the subsystem needs more
            than its own switch, so a client can explain an enabled switch that is still disabled.
          items: {type: string}

    User:
      type: object
      required: [id, name, role, disabled, createdAt]
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: string, enum: [admin, consultant, reviewer, readonly, member]}
        disabled:
          type: boolean
          description: A disabled operator keeps its identity and history; its API key stops authenticating.
        createdAt: {type: string, format: date-time}

    UserWithAPIKey:
      type: object
      required: [user, apiKey]
      properties:
        user: {$ref: "#/components/schemas/User"}
        apiKey:
          type: string
          description: The raw bearer key, shown exactly once and never recoverable afterwards.
          example: syn_0123456789abcdef

    CreateUserRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        role:
          type: string
          enum: [admin, consultant, reviewer, readonly, member]
          default: member
        tenant_id:
          type: string
          description: >
            Tenant the new operator belongs to. Empty means the calling admin's own tenant. A
            different tenant is refused with 403 unless the caller is the bootstrap platform principal.

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          description: Empty leaves the current name unchanged.
        role:
          type: string
          enum: [admin, consultant, reviewer, readonly, member]
          description: Empty leaves the current role unchanged.

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, failed]

    SLATier:
      type: string
      enum: [emergency, critical, high, medium, low, exception]

    SLARemediationStatus:
      type: string
      enum: [open, mitigating, remediated, accepted_risk]

    SLAWeights:
      type: object
      required: [severity, exploitability, threat_intel, exposure, criticality, feasibility_relief]
      properties:
        severity: {type: number, minimum: 0}
        exploitability: {type: number, minimum: 0}
        threat_intel: {type: number, minimum: 0}
        exposure: {type: number, minimum: 0}
        criticality: {type: number, minimum: 0}
        feasibility_relief: {type: number, minimum: 0}

    SLAThresholds:
      type: object
      description: Inclusive lower score bounds; values must be strictly descending from emergency to medium.
      required: [emergency, critical, high, medium]
      properties:
        emergency: {type: number, minimum: 0, maximum: 100}
        critical: {type: number, minimum: 0, maximum: 100}
        high: {type: number, minimum: 0, maximum: 100}
        medium: {type: number, exclusiveMinimum: 0, maximum: 100}

    SLADueRange:
      type: object
      description: Go duration values encoded as integer nanoseconds; mitigate_within must not exceed remediate_within.
      required: [mitigate_within, remediate_within]
      properties:
        mitigate_within: {type: integer, format: int64, minimum: 0, example: 86400000000000}
        remediate_within: {type: integer, format: int64, minimum: 0, example: 604800000000000}

    SLADueRanges:
      type: object
      required: [emergency, critical, high, medium, low, exception]
      properties:
        emergency: {$ref: '#/components/schemas/SLADueRange'}
        critical: {$ref: '#/components/schemas/SLADueRange'}
        high: {$ref: '#/components/schemas/SLADueRange'}
        medium: {$ref: '#/components/schemas/SLADueRange'}
        low: {$ref: '#/components/schemas/SLADueRange'}
        exception: {$ref: '#/components/schemas/SLADueRange'}

    SLAConfig:
      type: object
      required: [weights, thresholds, due_ranges, version]
      properties:
        weights: {$ref: '#/components/schemas/SLAWeights'}
        thresholds: {$ref: '#/components/schemas/SLAThresholds'}
        due_ranges: {$ref: '#/components/schemas/SLADueRanges'}
        version: {type: string, minLength: 1, example: sla-v2}

    SLAPolicy:
      type: object
      required: [tenant_id, config, sha256, created_by, created_at]
      properties:
        tenant_id: {type: string}
        config: {$ref: '#/components/schemas/SLAConfig'}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        created_by: {type: string}
        created_at: {type: string, format: date-time}

    SLAPolicyList:
      type: object
      required: [active, policies]
      properties:
        active: {$ref: '#/components/schemas/SLAPolicy'}
        policies: {type: array, items: {$ref: '#/components/schemas/SLAPolicy'}}

    SLAPolicyActivation:
      type: object
      required: [policy, created]
      properties:
        policy: {$ref: '#/components/schemas/SLAPolicy'}
        created: {type: boolean}

    SLAInputs:
      type: object
      required: [severity, cvss_score, kev, epss, public_poc, active_exploitation]
      properties:
        severity: {type: string, enum: ['', info, low, medium, high, critical]}
        cvss_score: {type: number, minimum: 0, maximum: 10}
        kev: {type: boolean}
        epss: {type: number, minimum: 0, maximum: 1}
        public_poc: {type: boolean}
        active_exploitation: {type: boolean}
        criticality: {type: string, enum: ['', low, medium, high]}
        exposure: {type: string, enum: ['', internal, external]}
        feasibility: {type: string, enum: ['', patch_available, change_window, compensating_control, no_patch]}

    SLABreakdown:
      type: object
      required: [severity, exploitability, threat_intel, exposure, criticality, feasibility]
      properties:
        severity: {type: number}
        exploitability: {type: number}
        threat_intel: {type: number}
        exposure: {type: number}
        criticality: {type: number}
        feasibility: {type: number}
        overrides: {type: array, items: {type: string}}

    SLAResult:
      type: object
      required: [tier, score, breakdown, mitigate_by, remediate_by, reason, computed_at, config_version]
      properties:
        tier: {$ref: '#/components/schemas/SLATier'}
        score: {type: number, minimum: 0, maximum: 100}
        breakdown: {$ref: '#/components/schemas/SLABreakdown'}
        mitigate_by: {type: string, format: date-time}
        remediate_by: {type: string, format: date-time}
        reason: {type: string}
        computed_at: {type: string, format: date-time}
        config_version: {type: string}

    SLAAssessment:
      type: object
      required: [tenant_id, id, engagement_id, finding_id, inputs, result, input_hash, config_hash, deadline_anchor_at, assessed_at, created_at]
      properties:
        tenant_id: {type: string}
        id: {type: string}
        engagement_id: {type: string}
        finding_id: {type: string}
        source_risk_assessment_id: {type: string}
        inputs: {$ref: '#/components/schemas/SLAInputs'}
        result: {$ref: '#/components/schemas/SLAResult'}
        input_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        config_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        previous_assessment_id: {type: string}
        deadline_anchor_at: {type: string, format: date-time}
        assessed_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}

    SLALifecycle:
      type: object
      required: [tenant_id, engagement_id, finding_id, assessment_id, status, version, updated_by, updated_at]
      properties:
        tenant_id: {type: string}
        engagement_id: {type: string}
        finding_id: {type: string}
        assessment_id: {type: string}
        status: {$ref: '#/components/schemas/SLARemediationStatus'}
        version: {type: integer, minimum: 1}
        reason: {type: string}
        compensating_control: {type: string}
        accepted_by: {type: string}
        accepted_at: {type: string, format: date-time}
        acceptance_expires_at: {type: string, format: date-time}
        updated_by: {type: string}
        updated_at: {type: string, format: date-time}

    SLAView:
      type: object
      required: [assessment, lifecycle, effective_state, overdue, acceptance_expired]
      properties:
        assessment: {$ref: '#/components/schemas/SLAAssessment'}
        lifecycle: {$ref: '#/components/schemas/SLALifecycle'}
        effective_state: {$ref: '#/components/schemas/SLARemediationStatus'}
        overdue: {type: boolean}
        acceptance_expired: {type: boolean}

    SLALifecycleEvent:
      type: object
      required: [tenant_id, id, engagement_id, finding_id, assessment_id, from, to, reason, actor, before_version, after_version, at]
      properties:
        tenant_id: {type: string}
        id: {type: string}
        engagement_id: {type: string}
        finding_id: {type: string}
        assessment_id: {type: string}
        from: {$ref: '#/components/schemas/SLARemediationStatus'}
        to: {$ref: '#/components/schemas/SLARemediationStatus'}
        reason: {type: string}
        compensating_control: {type: string}
        acceptance_expires_at: {type: string, format: date-time}
        actor: {type: string}
        before_version: {type: integer, minimum: 1}
        after_version: {type: integer, minimum: 2}
        at: {type: string, format: date-time}

    SLATransitionRequest:
      type: object
      required: [to, reason, version]
      properties:
        to: {$ref: '#/components/schemas/SLARemediationStatus'}
        reason: {type: string, minLength: 1}
        compensating_control: {type: string}
        acceptance_expires_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}

    VulnerabilityCursor:
      type: object
      required: [before_time, before_id]
      properties:
        before_time: {type: string, format: date-time}
        before_id: {type: string}

    VulnerabilityOverview:
      type: object
      required: [enabled_sources, stale_or_failed_sources, changed_advisories_24_hours, open_high_critical_exposure, pending_risk_actions, queue_depth, dead_letters]
      properties:
        enabled_sources: {type: integer, minimum: 0}
        stale_or_failed_sources: {type: integer, minimum: 0}
        last_successful_sync: {type: string, format: date-time}
        changed_advisories_24_hours: {type: integer, minimum: 0}
        oldest_unevaluated_revision: {$ref: '#/components/schemas/VulnerabilityEvaluationLag'}
        open_high_critical_exposure: {type: integer, minimum: 0, description: Current detected occurrences whose latest risk severity is high or critical}
        pending_risk_actions: {type: integer, minimum: 0}
        queue_depth: {type: integer, minimum: 0}
        dead_letters: {type: integer, minimum: 0}

    VulnerabilityEvaluationLag:
      type: object
      required: [advisory_id, current_revision, evaluated_revision, changed_at]
      properties:
        advisory_id: {type: string}
        current_revision: {type: integer, minimum: 1}
        evaluated_revision: {type: integer, minimum: 0}
        changed_at: {type: string, format: date-time}

    VulnerabilityCanonicalAdvisory:
      type: object
      description: Canonical advisory projection. Nested fields retain legacy Go field names.
      additionalProperties: true
      properties:
        Advisory: {type: object, additionalProperties: true}
        Status: {type: string, enum: [active, rejected, withdrawn]}
        PublishedAt: {type: string, format: date-time}
        ModifiedAt: {type: string, format: date-time}
        KEV: {type: [boolean, 'null']}
        EPSS: {type: [number, 'null'], minimum: 0, maximum: 1}
        EPSSPercentile: {type: [number, 'null'], minimum: 0, maximum: 1}
        PublicExploit: {type: [boolean, 'null']}
        ActiveExploitation: {type: [boolean, 'null']}
        Sources: {type: array, items: {type: string}}

    VulnerabilityAdvisoryItem:
      type: object
      required: [canonical, revision, active_affected_count, affected_asset_count, affected_component_count, risk_priority, previous_risk_priority, risk_trend, risk_score, risk_score_change]
      properties:
        canonical: {$ref: '#/components/schemas/VulnerabilityCanonicalAdvisory'}
        revision: {type: integer, minimum: 1}
        changed_fields: {type: array, items: {type: string, enum: [identity, aliases, summary, cvss, dates, affected, status, exploitability, sources]}}
        changed_at: {type: string, format: date-time}
        active_affected_count: {type: integer, minimum: 0, description: Current tenant occurrences in detected state}
        affected_asset_count: {type: integer, minimum: 0}
        affected_component_count: {type: integer, minimum: 0}
        risk_priority: {type: integer, minimum: 0, maximum: 5, description: Zero when no current assessment exists}
        previous_risk_priority: {type: integer, minimum: 0, maximum: 5, description: Zero when no previous assessment exists}
        risk_trend: {type: string, enum: [none, new, increased, decreased, unchanged]}
        risk_score: {type: number, minimum: 0}
        risk_score_change: {type: number}
        detection_states: {type: array, items: {type: string, enum: [detected, no_longer_detected, withdrawn]}}
        action_states: {type: array, items: {type: string, enum: [open, acknowledged, resolved]}}
        last_evaluation: {type: string, format: date-time}

    VulnerabilityAdvisoryPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/VulnerabilityAdvisoryItem'}}
        next: {type: string}

    VulnerabilityAdvisoryRevisionItem:
      type: object
      required: [canonical, revision]
      properties:
        canonical: {$ref: '#/components/schemas/VulnerabilityCanonicalAdvisory'}
        revision: {type: integer, minimum: 1}
        changed_fields: {type: array, items: {type: string}}
        sync_run_ids: {type: array, items: {type: string}, description: Tenant-visible synchronization runs that created this canonical revision}
        changed_at: {type: string, format: date-time}

    VulnerabilityAdvisoryRevisionPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/VulnerabilityAdvisoryRevisionItem'}}
        next: {type: integer, minimum: 1}

    VulnerabilityOccurrence:
      type: object
      description: Legacy domain serialization; property names are PascalCase.
      additionalProperties: true
      properties:
        TenantID: {type: string}
        ID: {type: string}
        EngagementID: {type: string}
        AdvisoryID: {type: string}
        AdvisoryRevision: {type: integer, minimum: 1}
        State: {type: string, enum: [detected, no_longer_detected, withdrawn]}
        UpdatedAt: {type: string, format: date-time}

    VulnerabilityOccurrencePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/VulnerabilityOccurrence'}}
        next: {$ref: '#/components/schemas/VulnerabilityCursor'}

    VulnerabilityAssessmentPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {type: object, additionalProperties: true, description: Immutable legacy PascalCase risk assessment}}
        next: {$ref: '#/components/schemas/VulnerabilityCursor'}

    VulnerabilityTransitionPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {type: object, additionalProperties: true, description: Immutable legacy PascalCase risk transition}}
        next: {$ref: '#/components/schemas/VulnerabilityCursor'}

    VulnerabilitySource:
      type: object
      required: [id, key, name, adapter_type, endpoint, enabled, archived, cadence_seconds, stale_after_seconds, sync_mode, credential_configured, version, created_at, updated_at, health]
      properties:
        id: {type: string}
        key: {type: string}
        name: {type: string}
        adapter_type: {type: string, enum: [osv, csaf, oval, nvd, cisa_kev, first_epss, public_exploit]}
        endpoint: {type: string, format: uri, pattern: '^https://'}
        enabled: {type: boolean}
        archived: {type: boolean}
        cadence_seconds: {type: integer, minimum: 1}
        stale_after_seconds: {type: integer, minimum: 1}
        sync_mode: {type: string, enum: [incremental, full]}
        adapter_config: {type: object, additionalProperties: true}
        credential_configured: {type: boolean}
        version: {type: integer, minimum: 1}
