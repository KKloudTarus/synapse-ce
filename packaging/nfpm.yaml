# nfpm configuration for the Synapse fleet VM agent native packages (#412).
#
# STATUS: exercised on every pull request by .github/workflows/agent-package-matrix.yml, which builds
# from this spec and then installs, starts, heartbeats against a real control plane, and uninstalls on
# each supported row. Package SIGNING is still not wired: it needs the project GPG key in repository
# secrets. The gate that refuses an unsigned artifact exists (scripts/release/verify-artifacts-signed.sh)
# — what is missing is the step that produces a signature, not the check that demands one.
# See docs/guide/fleet-agent-packaging.md.
#
# nfpm produces rpm + deb from this single spec:
#   SYNAPSE_LIBC_FLOOR=2.28 nfpm package -f packaging/nfpm.yaml -p rpm
#   SYNAPSE_LIBC_FLOOR=2.28 nfpm package -f packaging/nfpm.yaml -p deb
name: synapse-agent
arch: ${SYNAPSE_ARCH}
platform: linux
version: ${SYNAPSE_VERSION}
section: admin
maintainer: KKloudTarus <security@kkloudtarus.example>
description: Synapse fleet VM agent — inventories a host and reports to the control plane.
license: proprietary
vendor: KKloudTarus

# libc floor, enforced ONCE here as a package dependency (the package manager refuses an install
# below it). The preinstall script enforces it a SECOND time against the actual runtime (#412 req 2).
overrides:
  rpm:
    depends:
      - glibc >= ${SYNAPSE_LIBC_FLOOR}
  deb:
    depends:
      - libc6 (>= ${SYNAPSE_LIBC_FLOOR})

contents:
  - src: ./dist/synapse-agent
    dst: /usr/bin/synapse-agent
    file_info:
      mode: 0755
  - src: ./packaging/systemd/synapse-agent.service
    dst: /lib/systemd/system/synapse-agent.service
    file_info:
      mode: 0644
  # Config carries the control-plane URL + enrolment-token file path; restrictive perms + kept on upgrade.
  - src: ./packaging/agent.env.example
    dst: /etc/synapse-agent/agent.env
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: synapse-agent

scripts:
  preinstall: ./packaging/scripts/preinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  # Neither rpm nor dpkg removes a directory that once held a config file, so /etc/synapse-agent
  # survives an erase as an empty orphan (req 11). Removed here, only when empty and only on a final
  # removal — see the script for why an operator's leftover file is kept.
  postremove: ./packaging/scripts/postremove.sh

# Signing (rpm --addsign / deb debsigs) is configured in the pipeline with the project GPG key whose
# public key ships in packaging/keys/ (see README). A release with an unsigned artifact must fail the
# pipeline (#412 req 4).
